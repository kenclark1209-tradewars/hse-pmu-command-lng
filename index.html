ptance","Chỉ học từ LTI mà không học từ barrier failure"],"refs":["IOGP","ND207","IFCGEN","ND210"],"partners":"PM, Contract, O&M, Legal, Information management","example":"Ví dụ: Lỗi SIMOPS lặp lại trong 2 EPC được chuyển thành yêu cầu HSE mới cho dự án tiếp theo.","tag":"Thực hành quản trị","legalPins":[{"clauseId":"ND30","expectedProof":"Handover index, dossier, punchlist, acceptance certificates"},{"clauseId":"ND5_2","expectedProof":"Hợp đồng PMC/EPC, responsibility matrix, interface matrix"},{"clauseId":"Q19_121","expectedProof":"ITP, FAT/SAT, NCR, certification dossier"},{"clauseId":"MT37","expectedProof":"EIA decision, commitment tracker, change log"}],"legalScopeNote":"Phân biệt nghĩa vụ pháp lý của chủ đầu tư và nghĩa vụ của nhà thầu/EPC; biểu mẫu playbook là công cụ quản trị đề xuất."}],"raci":[{"work":"Xác định nghĩa vụ pháp lý dự án","owner":"A","hse":"R/C","legal":"R","design":"C","epc":"I","note":"Chủ thể nghĩa vụ và đơn vị nộp hồ sơ xác lập theo văn bản cụ thể; RACI này chỉ là mẫu."},{"work":"Lập/triển khai ĐTM","owner":"A","hse":"C/R","legal":"R/C","design":"C","epc":"I","note":"Tư vấn chuyên môn có thể là đơn vị thực hiện; chủ đầu tư chịu trách nhiệm pháp lý theo luật."},{"work":"Thiết kế & safety studies HAZOP/QRA","owner":"A","hse":"C","legal":"I","design":"R","epc":"R/C","note":"Người có chuyên môn chịu trách nhiệm tính toán, nghiên cứu và xác nhận kỹ thuật."},{"work":"Employer HSE Requirements","owner":"A","hse":"R","legal":"C","design":"C","epc":"I","note":"Đưa vào gói thầu qua bộ phận hợp đồng/đấu thầu."},{"work":"Project HSE Plan EPC","owner":"A/C","hse":"C/R","legal":"I","design":"C","epc":"R","note":"EPC soạn và quản lý thực thi; chấp thuận theo nghĩa vụ và phân quyền hợp đồng."},{"work":"Biện pháp thi công và JSA của EPC","owner":"A/C","hse":"C","legal":"I","design":"C","epc":"R","note":"EPC phải lập và thực hiện; chủ đầu tư chấp thuận các hồ sơ bắt buộc theo luật/hợp đồng."},{"work":"PTW, an toàn từng ca tại EPC site","owner":"I/C","hse":"C","legal":"I","design":"C","epc":"R/A","note":"PTW authority thực tế xác lập trong bridging, nhất là khu vận hành/chạy thử."},{"work":"Điều phối giao diện hai EPC","owner":"A","hse":"R","legal":"I","design":"C","epc":"R/C","note":"BQLDA điều phối và EPC triển khai biện pháp theo hợp đồng."},{"work":"Kiểm chứng critical controls","owner":"A","hse":"R","legal":"I","design":"C","epc":"R","note":"BQLDA chọn mẫu/giám sát; EPC vẫn chịu trách nhiệm kiểm soát trực tiếp."},{"work":"Ứng cứu ban đầu tại công trường EPC","owner":"C","hse":"C/R","legal":"C","design":"I","epc":"R/A","note":"Tổ chức chỉ huy sự cố phụ thuộc ERP và phạm vi khu vực; cơ quan chức năng thực hiện nhiệm vụ theo luật."},{"work":"PSSR trước nạp khí","owner":"A","hse":"C/R","legal":"C","design":"R","epc":"R","note":"Commissioning/O&M và engineering có vai trò kỹ thuật chính; HSE điều phối sự sẵn sàng."},{"work":"Bàn giao sang O&M","owner":"A","hse":"R/C","legal":"C","design":"R","epc":"R","note":"Sign-off theo authority matrix; không có HSE ký thay tất cả chuyên ngành."}],"templates":[{"id":"legal","title":"Legal / Permit Register","desc":"Ma trận thủ tục, nghĩa vụ, người chịu trách nhiệm và bằng chứng.","columns":["ID","Hạng mục/hoạt động","Văn bản + điều khoản đã xác minh","Trigger áp dụng","Chủ thể có nghĩa vụ","Owner xử lý","Cơ quan/đầu mối","Thời điểm phải có","Trạng thái","Link bằng chứng","Xác minh cuối","Điểm chưa rõ"],"row":["L-001 [MẪU]","Kho LNG [XÁC NHẬN]","Luật BVMT; điều khoản chờ xác minh","Phân loại dự án theo phạm vi thực tế","Chủ đầu tư [XÁC NHẬN]","Legal + Environment","Cơ quan có thẩm quyền [XÁC MINH]","Trước hoạt động liên quan","Chờ rà soát","","2026-11-23","Không suy đoán ĐTM/GPMT"],"checklist":[{"id":"legal-C01","question":"Phạm vi công trình/hành vi đã được xác định chưa?","how":"Đối chiếu bản đồ kho LNG–cảng–tái hóa khí–nhà máy điện và các activity package; không gộp khác pháp nhân.","evidence":"Danh mục phạm vi, drawing revision, boundary map","critical":true},{"id":"legal-C02","question":"Mỗi nghĩa vụ có trigger áp dụng cụ thể chưa?","how":"Ghi loại công trình, quy mô, công năng, hoạt động, mốc thời gian; phân biệt luật chung và nghĩa vụ có điều kiện.","evidence":"Cột trigger và ghi chú phân loại","critical":true},{"id":"legal-C03","question":"Đã dẫn đúng văn bản, điều khoản và phiên bản đang hiệu lực?","how":"Truy cập nguồn chính thức, ghi điều/khoản và ngày kiểm tra; rà chuyển tiếp và văn bản sửa đổi.","evidence":"URL nguồn chính thức, date verified","critical":true},{"id":"legal-C04","question":"Đã xác định pháp nhân có nghĩa vụ và người điều phối?","how":"Rà quyết định dự án, hợp đồng, giấy phép, pháp nhân và phân quyền.","evidence":"Legal entity register, RACI/authority","critical":true},{"id":"legal-C05","question":"Có mốc phải hoàn thành trước công việc liên quan?","how":"Gắn nghĩa vụ với logic schedule; không đánh đồng “đã nộp” với “đã được cấp/đủ điều kiện”.","evidence":"Milestone and permit dependency tracker","critical":true},{"id":"legal-C06","question":"Tình trạng thủ tục có bằng chứng đáng tin?","how":"Yêu cầu số văn bản, cơ quan, ngày, hiệu lực, link hồ sơ; ghi “chưa xác minh” khi thiếu.","evidence":"Bản sao quyết định/biên nhận hợp lệ","critical":true},{"id":"legal-C07","question":"Có phân biệt hồ sơ của tư vấn và quyết định cơ quan?","how":"Kiểm soát trạng thái dự thảo, nộp, yêu cầu bổ sung, được phê duyệt theo từng bước.","evidence":"Workflow log với chứng cứ","critical":false},{"id":"legal-C08","question":"Có người chịu trách nhiệm làm rõ điểm chưa xác minh?","how":"Đối với mỗi gap phải có owner, due, mức độ ảnh hưởng tiến độ và hành động.","evidence":"Legal gap register","critical":true},{"id":"legal-C09","question":"Đã cập nhật thay đổi thiết kế ảnh hưởng nghĩa vụ?","how":"So drawing mới, hồ sơ ĐTM/PCCC và giấy phép; thông báo change control.","evidence":"Design/legal change log","critical":true},{"id":"legal-C10","question":"Có lịch review và phê duyệt đúng thẩm quyền?","how":"Rà register hàng tuần/giai đoạn; Legal xác minh nội dung pháp lý; PM ký kết luận quản trị theo phân quyền.","evidence":"Review minutes, approval matrix","critical":false}],"refs":["XD","MT","PCCC","Q19"],"review_note":"Bộ tiêu chí kiểm soát chất lượng của một biểu mẫu đề xuất; trạng thái “đạt” trong app không thay chữ ký, phê duyệt, xác nhận pháp lý/chuyên ngành ngoài đời thực."},{"id":"risk","title":"Major HSE Risk Register","desc":"Rủi ro cấp dự án; không thay HAZOP/QRA.","columns":["ID","Giai đoạn","Top event / nguy cơ","Nguyên nhân","Hậu quả","Controls phòng ngừa","Controls giảm nhẹ","Owner","Bằng chứng hoạt động","Risk rating theo phương pháp được duyệt","Tồn tại","Hạn","Quyết định"],"row":["R-001 [MẪU]","Thiết kế","Rò rỉ LNG tại kết nối","Phần nối không kín","Hơi khí dễ cháy/lạnh sâu","Thiết kế và QA/QC","Detection, isolation, ERP","Process / Engineering","Study action tracker","Chưa đánh giá","Chờ chuyên gia","","Chưa chốt"],"checklist":[{"id":"risk-C01","question":"Mỗi dòng là kịch bản rủi ro cụ thể?","how":"Ghi event, causes, consequences, affected parties; không chỉ ghi “cháy nổ”.","evidence":"Scenario description và origin","critical":true},{"id":"risk-C02","question":"Có phân biệt rủi ro xây dựng, môi trường và process safety?","how":"Đối chiếu phạm vi thiết kế, HAZID, EIA và construction scope.","evidence":"Risk taxonomy and hazard sources","critical":true},{"id":"risk-C03","question":"Có tài liệu/phương pháp đánh giá rõ?","how":"Dẫn quy trình risk ranking được BQLDA phê duyệt, giữ consistency.","evidence":"Risk matrix reference","critical":false},{"id":"risk-C04","question":"Barrier phòng ngừa và giảm hậu quả có chủ sở hữu?","how":"Phân critical controls ra thiết kế, EPC, vận hành; gắn yêu cầu kiểm chứng.","evidence":"Barrier owner map and verification records","critical":true},{"id":"risk-C05","question":"Có rủi ro giao diện giữa hai gói và bên thứ ba?","how":"Kiểm tra battery limits, logistics, marine, cộng đồng, SIMOPS.","evidence":"Interface register link","critical":true},{"id":"risk-C06","question":"Residual risk và action có bằng chứng?","how":"Không giảm điểm rủi ro chỉ vì hứa CAPA; evidence kiểm chứng trước closure.","evidence":"Action close-out log","critical":true},{"id":"risk-C07","question":"Assumption/uncertainty được ghi rõ?","how":"Chưa có FEED/QRA thì đặt trạng thái provisional, xác định cần expert study.","evidence":"Assumption register","critical":false},{"id":"risk-C08","question":"Có tính khả năng xảy ra biến đổi theo giai đoạn?","how":"Rà chuyển đổi site sang commissioning và O&M; risk profile thay đổi.","evidence":"Risk review by milestone","critical":false},{"id":"risk-C09","question":"High consequence risks có escalation/gate rõ?","how":"Dẫn decision owner, hold point và review requirement.","evidence":"PM escalation matrix","critical":true},{"id":"risk-C10","question":"Có lịch cập nhật theo MOC và sự cố?","how":"Gắn incident learnings, thiết kế mới, thay đổi contractor vào register.","evidence":"MOC & incident cross-reference","critical":false}],"refs":["Q19","IOGP","IFCGEN"],"review_note":"Bộ tiêu chí kiểm soát chất lượng của một biểu mẫu đề xuất; trạng thái “đạt” trong app không thay chữ ký, phê duyệt, xác nhận pháp lý/chuyên ngành ngoài đời thực."},{"id":"raci","title":"RACI & Authority Matrix","desc":"Phân vai ai làm, ai chịu trách nhiệm, ai được ký.","columns":["Hoạt động","PM/Chủ đầu tư A","HSE BQLDA","Legal","Engineering","EPC","Approval authority theo văn bản/hợp đồng","Ghi chú"],"row":["Chấp thuận biện pháp thi công [MẪU]","A","C/R","I","C","R","Chủ đầu tư hoặc người được ủy quyền [XÁC MINH]","Không mặc nhiên là HSE Manager"],"checklist":[{"id":"raci-C01","question":"Đã xác định pháp nhân và phạm vi công việc của từng bên?","how":"Bám scope, project company, PMU mandate, EPC package và tư vấn.","evidence":"Organization and contract boundary map","critical":true},{"id":"raci-C02","question":"Mỗi quyết định có đúng một Accountable (A)?","how":"Nếu hai A hoặc không A, yêu cầu giải quyết trước khi ban hành.","evidence":"RACI review notes","critical":true},{"id":"raci-C03","question":"R và A không nhầm với quyền ký giấy phép nhà nước?","how":"R là người làm, A chịu trách nhiệm theo tổ chức; nghĩa vụ pháp lý xác định riêng.","evidence":"Legal responsibility note","critical":true},{"id":"raci-C04","question":"HSE PMU có phân biệt review, verify và approve?","how":"Ghi quyền ký cụ thể cho HSE, Technical Authority, PM, regulator, EPC.","evidence":"Authority matrix / delegation","critical":true},{"id":"raci-C05","question":"Stop-work/restart được quy định rõ?","how":"Ghi trigger, kênh yêu cầu, người xác nhận restart theo luật và hợp đồng.","evidence":"Stop work procedure","critical":true},{"id":"raci-C06","question":"SIMOPS/PTW có người điều phối vùng giao diện?","how":"Kiểm tra location, shared assets, isolation authority.","evidence":"Interface RACI and PTW bridging","critical":true},{"id":"raci-C07","question":"Phân quyền trong PSSR/first gas có chuyên môn phù hợp?","how":"HSE không mặc định tự ký go/no-go, xác định Operations/Technical Authority.","evidence":"Commissioning authority schedule","critical":true},{"id":"raci-C08","question":"Phân công incident notification và legal reporting?","how":"Rà nghĩa vụ của EPC/chủ đầu tư và cơ quan có thẩm quyền.","evidence":"Incident escalation flow","critical":true},{"id":"raci-C09","question":"Đã thống nhất thay đổi nhân sự/gói thầu?","how":"Phê duyệt version, cập nhật danh sách liên hệ và training.","evidence":"Rev control and dissemination log","critical":false},{"id":"raci-C10","question":"Có cơ chế xử lý tranh chấp trách nhiệm?","how":"Báo PM theo level và deadline, lập issue tracker.","evidence":"Escalation & dispute protocol","critical":false}],"refs":["ND207","XD","IOGP"],"review_note":"Bộ tiêu chí kiểm soát chất lượng của một biểu mẫu đề xuất; trạng thái “đạt” trong app không thay chữ ký, phê duyệt, xác nhận pháp lý/chuyên ngành ngoài đời thực."},{"id":"tender","title":"EPC HSE Requirement Matrix","desc":"Yêu cầu HSE đưa vào HSMT và đối chiếu hồ sơ dự thầu.","columns":["Requirement ID","Nhóm rủi ro","Yêu cầu đo được","Bằng chứng trong bid","Mức độ","Bidder response","Review comment","Status","Điều kiện hợp đồng"],"row":["HSE-001 [MẪU]","Critical lifting","Có năng lực và quy trình kiểm soát lift đặc biệt","Key CV/plan/audit sample","Mandatory","Chờ nộp","","Open","Xem theo package scope"],"checklist":[{"id":"tender-C01","question":"Yêu cầu dựa trên major hazards đúng scope?","how":"Xem HAZID/site logistics/process safety; không chỉ PPE.","evidence":"Hazard-to-contract requirement matrix","critical":true},{"id":"tender-C02","question":"Mỗi yêu cầu có cách kiểm chứng?","how":"Viết deliverable, tiêu chí accept, frequency, evidence và reviewer.","evidence":"Requirements verification column","critical":true},{"id":"tender-C03","question":"Phân định EPC – subcontractor – owner responsibilities?","how":"Bắt buộc contractor management và bridging; không để thầu phụ ngoài scope.","evidence":"Contract annex and RACI","critical":true},{"id":"tender-C04","question":"Có yêu cầu staff competence/availability?","how":"Role-critical competency, ca làm, thời điểm huy động và kiểm chứng.","evidence":"Competency & staffing schedule","critical":true},{"id":"tender-C05","question":"Critical work controls được chỉ ra?","how":"PTW, lifting, work at height, confined space, electrical isolation, pressure testing.","evidence":"Work control standards/plan","critical":true},{"id":"tender-C06","question":"Process safety deliverables có trong HSMT?","how":"Hazard study, MOC, instrumented protection, safety-critical testing, PSSR theo scope.","evidence":"Process safety deliverable matrix","critical":true},{"id":"tender-C07","question":"Có điều khoản incident escalation và audit rights?","how":"Kiểm tra reporting, audit, corrective action, access, confidentiality và contract mechanisms.","evidence":"Draft contract clauses reviewed by Legal","critical":true},{"id":"tender-C08","question":"Có quy tắc quản lý deviation/alternative E chỉ đưa nhận định trong scope, technical authority/PM/Operations theo phân quyền quyết định.","evidence":"PSSR authority and release record","critical":true}],"refs":["Q19","TC8611","IOGP"],"review_note":"Bộ tiêu chí kiểm soát chất lượng của một biểu mẫu đề xuất; trạng thái “đạt” trong app không thay chữ ký, phê duyệt, xác nhận pháp lý/chuyên ngành ngoài đời thực."},{"id":"handover","title":"HSE Handover Dossier Index","desc":"Chuyển giao không bỏ sót nghĩa vụ và hàng rào an toàn.","columns":["ID","Hồ sơ hoặc barrier","Nguồn","O&M receiver","Bản/phân loại","Bằng chứng","Outstanding","Risk control","Owner","Due","Sign-off"],"row":["H-001 [MẪU]","Fire & Gas test pack","EPC","","As-built","","Open","","Commissioning","",""],"checklist":[{"id":"handover-C01","question":"Danh mục hệ thống/tài sản bàn giao có đủ scope?","how":"So contract/asset register với as-built và system boundary.","evidence":"Turnover register","critical":true},{"id":"handover-C02","question":"Design basis/as-built/MOC đầy đủ và thống nhất?","how":"Đối chiếu bản vẽ mới nhất với thay đổi được phê duyệt.","evidence":"As-built / MOC dossier","critical":true},{"id":"handover-C03","question":"Hồ sơ pháp lý, ĐTM, PCCC và điều kiện vận hành đã chuyển?","how":"Legal xác định nghĩa vụ chuyển giao, hiệu lực và bên chịu trách nhiệm.","evidence":"Permit and commitment handover index","critical":true},{"id":"handover-C04","question":"Hazard studies và khuyến nghị chưa đóng có người tiếp nhận?","how":"Rà HAZOP/QRA/HAZID actions và residual risk.","evidence":"Hazard action handover","critical":true},{"id":"handover-C05","question":"Safety-critical equipment có lịch bảo trì/kiểm tra?","how":"Nhận test, certificate, life-cycle integrity/maintenance records.","evidence":"Maintenance criticality and inspection list","critical":true},{"id":"handover-C06","question":"O&M SOP và process safety metrics đã thống nhất?","how":"Có operating limits, MOC, emergency and incident reporting.","evidence":"Approved O&M management system","critical":true},{"id":"handover-C07","question":"Operator competency và training có đủ theo chức năng?","how":"Đối chiếu job description với đào tạo và assessment.","evidence":"Competency/training acceptance","critical":true},{"id":"handover-C08","question":"Emergency interfaces với bên ngoài còn hiệu lực?","how":"Rà fire, marine, medical, evacuation, mutual aid.","evidence":"ERP and interface handover record","critical":true},{"id":"handover-C09","question":"Open critical punch items có owner/decision?","how":"Không chuyển critical unowned items; trình PM/Operations về hold condition.","evidence":"Punch list register and signed disposition","critical":true},{"id":"handover-C10","question":"Có chữ ký của đúng bên nhận và lưu version?","how":"Phân biệt engineering acceptance, HSE verification, O&M sign-off.","evidence":"Handover signature/approval matrix","critical":true}],"refs":["Q19","XD","IOGP"],"review_note":"Bộ tiêu chí kiểm soát chất lượng của một biểu mẫu đề xuất; trạng thái “đạt” trong app không thay chữ ký, phê duyệt, xác nhận pháp lý/chuyên ngành ngoài đời thực."}],"scenarios":[{"id":"S1","title":"ĐTM chưa hoàn tất nhưng muốn san lấp","phase":"P0","story":"PM muốn bắt đầu một gói san lấp ngoài hiện trường ngay tuần tới để giữ tiến độ; pháp lý và phạm vi ĐTM/điều kiện khởi công chưa được xác minh.","choices":["Gật đầu vì đây là việc chuẩn bị, không cần xem pháp lý","Yêu cầu Legal/Environment xác minh điều kiện áp dụng, giữ hoạt động thuộc điều kiện chưa đạt và đề xuất giải pháp tiến độ phù hợp","Chỉ nhắc EPC ký cam kết HSE là đủ"],"correct":1,"explain":"Không tự suy luận một hoạt động đã đủ điều kiện chỉ từ tên gói thầu. Phải xác định các thủ tục và điều kiện pháp lý cụ thể trước khi triển khai; đồng thời hỗ trợ PM tìm phương án hợp pháp.","refs":["MT","ND08","ND48","XD"],"category":"Tiền dự án & pháp lý","difficulty":"Nâng cao","actions":["Kiểm tra chính xác loại công việc, vị trí, điều kiện pháp lý hiện có và văn bản áp dụng; không suy từ tên gói thầu.","Mời Legal, Environment, PM và tư vấn rà hồ sơ theo từng hạng mục và mốc.","Ghi blocker/owner/deadline; trình PM phương án hợp pháp bảo toàn tiến độ.","Chỉ kiến nghị mở lại hoạt động sau khi điều kiện liên quan được xác minh."],"evidence":["Phạm vi hạng mục và bản đồ công trường","Legal/Permit Register kèm ý kiến pháp lý","Biên bản giao việc/PM decision log"],"escalate":"Cần báo cáo PM nếu mốc khởi công vượt điều kiện pháp lý; đề xuất điều chỉnh tiến độ.","trap":"Gật đầu cho làm vì “san lấp nhỏ” là kết luận pháp lý không có cơ sở.","related":"P0-03"},{"id":"S2","title":"Tư vấn đề nghị HSE chủ đầu tư phê duyệt báo cáo QRA","phase":"P1","story":"Một tư vấn gửi QRA cho dự án và đề nghị HSE Manager BQLDA ký “approved” vào kết luận rủi ro kỹ thuật.","choices":["Ký ngay vì HSE là bộ phận an toàn","Không ký gì; từ chối mọi trách nhiệm HSE","Xác định thẩm quyền và năng lực, yêu cầu chuyên gia/engineering review kỹ thuật; HSE xem xét quản trị quy trình và đóng action"],"correct":2,"explain":"HSE chủ đầu tư không mặc nhiên có năng lực/phân quyền phê duyệt tính toán QRA. Vai trò là bảo đảm có review đúng người, action tracking và quyết định có thẩm quyền.","refs":["IFCLNG","NFPA59A"],"category":"Thiết kế & đấu thầu","difficulty":"Nâng cao","actions":["Xác định HAZOP/QRA do chuyên gia đủ năng lực thực hiện, bên nào là chủ sở hữu nghiên cứu.","Phối hợp kỹ thuật rà TOR, đầu vào thiết kế, phương pháp, tính độc lập và khuyến nghị.","Thiết lập action tracker: khuyến nghị, owner, deadline, bằng chứng đóng.","Trình đúng người phê duyệt theo authority matrix và ghi ý kiến HSE ở vai trò kiểm chứng."],"evidence":["TOR nghiên cứu HAZOP/QRA","Danh sách chuyên gia và biên bản workshop","Action close-out log có bằng chứng"],"escalate":"Trình PM/Technical Authority khi khuyến nghị mức trọng yếu chưa đóng.","trap":"Nhận ký phê duyệt báo cáo kỹ thuật thay người có thẩm quyền chỉ để kịp tiến độ.","related":"P1-05"},{"id":"S3","title":"EPC gửi HSE Plan 150 trang và xin huy động 500 người","phase":"P2","story":"Kế hoạch có đầy đủ tiêu đề, nhưng chưa chứng minh cứu hộ trên cao, phương án giao thông và nhân sự trực tiếp.","choices":["Chấp nhận vì EPC có ISO 45001","Review theo yêu cầu hợp đồng, làm readiness review, đóng blocker trước khi cho phần việc liên quan triển khai","Từ chối toàn bộ dự án mà không ghi nhận tồn tại"],"correct":1,"explain":"Tài liệu đủ trang không đồng nghĩa đủ điều kiện. Chỉ quyết định theo phạm vi, evidence, gate và đúng thẩm quyền.","refs":["ND207","Q18","IOGP"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Lập danh sách tài liệu huy động thuộc mức rủi ro/gói thầu và điều kiện bắt buộc.","Phân công HSE BQLDA, kỹ thuật, môi trường, pháp lý kiểm tra hồ sơ và kiểm chứng hiện trường.","Ghi điểm không phù hợp/owner/due, tách blocker ngăn huy động với việc cải thiện khác.","Báo cáo PM để đưa ra quyết định huy động có điều kiện hoặc chưa cho phép theo thẩm quyền."],"evidence":["HSE Plan, EMS, tổ chức và competency matrix","Mobilization readiness checklist","NCR và bằng chứng khắc phục"],"escalate":"Escalate blocker khi EPC yêu cầu huy động dù điều kiện trọng yếu chưa đạt.","trap":"Đánh đồng việc HSE Plan dày 150 trang với khả năng kiểm soát rủi ro thực tế.","related":"P2-01"},{"id":"S4","title":"Hai EPC đều có PTW nhưng công việc xung đột","phase":"P2","story":"EPC A nâng thiết bị qua đường chung. EPC B vận chuyển ống qua đường đó. Hai PTW đều hợp lệ trong hệ thống riêng.","choices":["Để hai EPC tự xử, HSE chủ đầu tư không can thiệp","Cho EPC nhanh hơn làm trước mà không cập nhật giấy phép","Tổ chức SIMOPS review, phân vùng/điều chỉnh lịch, xác định one controlling authority và kiểm chứng thực địa"],"correct":2,"explain":"Điểm giao diện không được có khoảng trống trách nhiệm. HSE BQLDA điều phối; EPC phải điều chỉnh thực thi theo kế hoạch được thống nhất.","refs":["ND207","IOGP","Q18"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Yêu cầu tổng hợp 2 lịch công việc và sơ đồ vị trí, vùng ảnh hưởng.","Họp SIMOPS giữa hai EPC, Planning, Construction và HSE để đánh giá điểm giao cắt.","Chốt trình tự/tách thời gian, chủ trì phối hợp, ranh giới PTW và cách liên lạc.","Kiểm chứng tại hiện trường trước khi được phép triển khai theo quy trình."],"evidence":["SIMOPS matrix cập nhật","Bản vẽ ranh giới và lịch thi công","Biên bản họp giao diện, PTW và kế hoạch kiểm soát"],"escalate":"PM quyết định ưu tiên tiến độ khi các EPC không thống nhất; rủi ro không kiểm soát thì can thiệp.","trap":"Hai PTW riêng có thể cùng hợp lệ nhưng vẫn tạo ra một giao diện nguy hiểm.","related":"P2-07"},{"id":"S5","title":"First gas nhưng ESD chưa hoàn thành test","phase":"P3","story":"Commissioning báo 99% hoàn thành; một ESD chức năng quan trọng chưa có test evidence. PM muốn nạp khí để giữ mốc.","choices":["Cho phép vì chỉ còn 1%","Yêu cầu phân loại safety critical item, review kỹ thuật và PSSR, báo cáo no-go/điều kiện quyết định theo phân quyền","Chỉ yêu cầu thêm PPE cho đội vận hành"],"correct":1,"explain":"Safety critical barrier không thể suy ra đạt từ tỷ lệ tiến độ. HSE bảo đảm có đánh giá kỹ thuật, chứng cứ, quyền quyết định và điều kiện go/no-go.","refs":["IFCLNG","NFPA59A","PCCC"],"category":"Commissioning & first gas","difficulty":"Nâng cao","actions":["Xác lập ESD test là điều kiện trọng yếu và yêu cầu bằng chứng ký xác nhận.","Triệu tập Commissioning, Operations, Technical Authority, HSE và EPC đánh giá trạng thái thật.","Ghi tồn tại, mức độ, workaround nếu có nhưng không tự đánh giá chấp nhận rủi ro công nghệ.","Khuyến nghị giữ mốc first gas đến khi đúng người xác nhận các barrier bắt buộc đã đạt."],"evidence":["PSSR/first gas readiness dossier","ESD test records và outstanding punch list","Decision/authorization log"],"escalate":"Báo cấp Giám đốc dự án khi có sức ép bỏ qua barrier trọng yếu.","trap":"Cho phép nạp khí với lý do “sẽ test sau” là đánh đổi không có cơ sở kỹ thuật và thẩm quyền.","related":"P3-03"},{"id":"S6","title":"Tai nạn nặng tại nhà thầu phụ","phase":"P2","story":"Có người bị thương nặng, thông tin ban đầu trái chiều, nhà thầu đề nghị chỉ báo cáo nội bộ và nhanh chóng làm lại.","choices":["Cho phép làm lại ngay để tránh trễ tiến độ","Ưu tiên cứu nạn, kiểm soát hiện trường, xác minh nghĩa vụ pháp lý, phối hợp điều tra đúng thẩm quyền và đánh giá risk trước resume","Tự đăng thông tin sự cố lên mạng xã hội"],"correct":1,"explain":"Phân biệt ứng cứu, báo cáo theo luật, điều tra nội bộ và resume. HSE owner kiểm soát trách nhiệm toàn dự án nhưng không thay cơ quan có thẩm quyền.","refs":["AT","ND207","Q18"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Đảm bảo cứu nạn, kích hoạt thông báo khẩn cấp và bảo vệ hiện trường theo quy định.","Kiểm tra nghĩa vụ báo cáo của đúng chủ thể và phối hợp cơ quan có thẩm quyền.","Tham gia/giám sát điều tra hệ thống và triển khai biện pháp kiểm soát ở các gói tương tự.","Báo PM/Ban lãnh đạo rủi ro, trách nhiệm, quyết định tạm dừng/tái khởi động đúng phân quyền."],"evidence":["Emergency log","Báo cáo sự cố theo mẫu áp dụng","Điều tra nguyên nhân, CAPA và verification records"],"escalate":"Sự cố nghiêm trọng phải kích hoạt kênh pháp lý/điều tra và lãnh đạo ngay, không chờ báo cáo cuối tuần.","trap":"Không tự tuyên bố mình là cơ quan điều tra tai nạn có thẩm quyền.","related":"P2-09"},{"id":"S7","title":"BQLDA chỉ có 3 HSE, EPC có 30 HSE","phase":"P2","story":"PM hỏi làm sao kiểm soát 2.000 công nhân khi đội chủ đầu tư chỉ có ba người.","choices":["Yêu cầu bố trí đủ người để đi giám sát tất cả","Dựa vào hệ thống EPC, kiểm chứng dựa trên rủi ro, critical controls, audit và reporting/escalation rõ ràng","Giao toàn bộ cho EPC, không cần đội BQLDA"],"correct":1,"explain":"Nguồn lực BQLDA tập trung vào assurance, interfaces và vấn đề lãnh đạo phải quyết định; EPC thực thi hệ thống của mình.","refs":["ND207","IOGP"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Thiết kế risk-based assurance dựa trên hoạt động trọng yếu, thay vì đi kiểm từng người.","Quy định EPC tự kiểm soát, quản lý thầu phụ và cung cấp dữ liệu minh chứng.","BQLDA audit chọn mẫu, kiểm tra các barrier quan trọng, kiểm soát giao diện và chất lượng CAPA.","Báo cáo PM khoảng trống nguồn lực để bổ sung khi profile rủi ro thay đổi."],"evidence":["Risk-based inspection plan","Assurance sampling log","KPI/leading indicator dashboard"],"escalate":"Đề xuất tăng nguồn lực hoặc thay đổi mô hình kiểm soát khi mức rủi ro vượt năng lực đội HSE BQLDA.","trap":"Không dùng 3 nhân viên BQLDA để làm thay toàn bộ HSE Supervisor của EPC.","related":"P2-03"},{"id":"S8","title":"Dữ liệu KPI đẹp nhưng kiểm tra thấy lỗi lặp lại","phase":"P2","story":"EPC báo 2 triệu giờ không LTI, nhưng ba lần kiểm tra phát hiện PTW không phản ánh hiện trường.","choices":["Dựa vào 2 triệu giờ để kết luận tốt","Phân tích leading indicators, yêu cầu RCA và corrective actions kiểm chứng được","Chỉ tăng số buổi toolbox talk"],"correct":1,"explain":"Lagging KPI không thay thế kiểm chứng barrier. Lỗi lặp lại là chỉ dấu vấn đề hệ thống.","refs":["IOGP","IFCGEN","ND207"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Đối chiếu KPI báo cáo với hiện trường, PTW, hồ sơ huấn luyện và mẫu vi phạm.","Phân tích sự lặp lại: hành động CAPA có đóng thật, đúng nguyên nhân hay chỉ khép hồ sơ.","Yêu cầu EPC điều tra nguyên nhân hệ thống và đề xuất sửa thiết kế kiểm soát.","Đánh giá lại chất lượng KPI, thiết lập leading indicators và báo sự thật cho PM."],"evidence":["KPI report và dữ liệu nguồn","NCR lặp lại, trend analysis","CAPA effectiveness verification"],"escalate":"Escalate khi phát hiện khai sai, giấu sự cố hoặc KPI gây ra quyết định không an toàn.","trap":"Không lấy tỷ lệ tai nạn bằng 0 để suy ra hệ thống đang an toàn.","related":"P2-06"},{"id":"S9","title":"Nhà thầu khảo sát vào khu vực đất chưa bàn giao","phase":"P0","story":"Tư vấn địa chất muốn khoan khảo sát ngày mai. Mặt bằng có hộ dân đang sử dụng, chưa rõ quyền tiếp cận, tuyến máy khoan và nguy cơ mất an toàn cộng đồng.","choices":["Đề nghị PM/Legal xác minh quyền tiếp cận, tình trạng bàn giao và điều kiện thực hiện; phối hợp khảo sát hiện trường, thông tin cộng đồng và duyệt kế hoạch kiểm soát trước huy động.","Cho vào ngay vì khảo sát là hoạt động nhẹ và thời gian gấp.","Chỉ yêu cầu tư vấn ký giấy cam kết tự chịu toàn bộ rủi ro."],"correct":0,"explain":"HSE chủ đầu tư phải phối hợp kiểm soát rủi ro với bên thứ ba và không thể dùng hợp đồng nhà thầu để thay điều kiện tiếp cận hợp pháp.","refs":["XD","ND207","MT","IFCGEN"],"category":"Tiền dự án & pháp lý","difficulty":"Nâng cao","actions":["Khóa bản đồ phạm vi và quyền tiếp cận từng vị trí.","Đánh giá rủi ro xe cơ giới, mũi khoan, đường dân sinh và tuyến điện.","Họp Legal, Community, Survey và PM thống nhất điều kiện vào.","Ghi quyết định và giám sát việc thực hiện."],"evidence":["Biên bản bàn giao/cho phép tiếp cận","JSA khảo sát và traffic plan","Community notice/issue log"],"escalate":"Chưa rõ quyền sử dụng mặt bằng hoặc có phản đối dân cư thì trình PM và Legal trước hoạt động.","trap":"Không tự ký giấy cho phép vào khu đất khi chưa xác minh cơ sở pháp lý.","related":"P0-01"},{"id":"S10","title":"Thiết kế FEED thiếu ranh giới cảng, kho LNG và nhà máy điện","phase":"P0","story":"Nhóm thiết kế gửi sơ đồ tổng mặt bằng nhưng đầu nối cảng – bồn chứa – tái hóa khí – nhà máy điện chưa rõ ai quản lý và giấy phép nào thuộc phạm vi hợp đồng nào.","choices":["Chấp nhận bản vẽ và để EPC giải quyết sau khi trúng thầu.","Yêu cầu PM lập interface register và boundary map; giao kỹ thuật xác định battery limits, HSE/Legal rà nghĩa vụ mỗi bên và các rủi ro giao diện trước khóa phạm vi.","Đề xuất HSE BQLDA tự điều chỉnh bản vẽ và ký phát hành."],"correct":1,"explain":"Rủi ro lớn thường nằm ở phần giao nhau; chưa xác định battery limits thì hợp đồng, pháp lý và emergency response dễ bị bỏ sót.","refs":["XD","Q19","TC8611","ND207","IOGP"],"category":"Tiền dự án & pháp lý","difficulty":"Nâng cao","actions":["Yêu cầu drawings có version và battery limits.","Lập bảng giao diện thiết kế – pháp lý – vận hành cho từng hạng mục.","Giao một accountable owner và thời hạn khóa giao diện.","Trình PM các interface chưa thể chấp nhận."],"evidence":["Battery limit / ownership drawing","Interface register","PM decision log"],"escalate":"Escalate nếu thiết kế/hợp đồng chuẩn bị phát hành khi còn lỗ hổng trách nhiệm nguy hiểm.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P0-01"},{"id":"S11","title":"ĐTM có giải pháp chống ồn nhưng chưa có dữ liệu baseline","phase":"P0","story":"Tư vấn báo ĐTM gần hoàn tất. Trong hồ sơ có đề xuất hạn chế tiếng ồn và nước thải nhưng chưa chứng minh dữ liệu nền, các điểm nhạy cảm và kế hoạch quan trắc phù hợp.","choices":["Đồng ý ký vì tư vấn chịu trách nhiệm về nội dung ĐTM.","Ghi HSE không phụ trách nên không cần tham gia.","Yêu cầu nhóm môi trường xác định thiếu dữ liệu nào, phạm vi và cơ sở phương pháp; phối hợp tư vấn điều chỉnh khảo sát/đánh giá trước khi xác nhận hồ sơ đáp ứng."],"correct":2,"explain":"HSE BQLDA kiểm soát đầu ra của tư vấn theo yêu cầu dự án, không ký thay chuyên gia; việc thiếu dữ liệu nền có thể làm sai đánh giá tác động.","refs":["MT","ND08","ND48","IFCGEN"],"category":"Tiền dự án & pháp lý","difficulty":"Nâng cao","actions":["Đối chiếu TOR và phạm vi đánh giá.","Yêu cầu danh sách khoảng trống dữ liệu và mức ảnh hưởng tới kết luận.","Giao tư vấn kế hoạch bổ sung dữ liệu hoặc giải trình theo căn cứ.","Theo dõi phê duyệt đúng thẩm quyền."],"evidence":["EIA gap register","Baseline survey and quality records","Review comments & close-out"],"escalate":"Escalate nếu thiếu sót làm sai kết luận hoặc ảnh hưởng điều kiện pháp lý trọng yếu.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P0-04"},{"id":"S12","title":"Đường công vụ đi sát trường học và chợ dân sinh","phase":"P0","story":"Dự kiến xe siêu trường siêu trọng đi qua đường địa phương gần trường học. Kỹ thuật đã chọn tuyến ngắn nhất nhưng chưa có đánh giá rủi ro với người dân.","choices":["Phối hợp Logistics, địa phương và Community để đánh giá hành lang vận chuyển, khung giờ, kiểm soát giao thông, phương án thông tin và ứng cứu; báo PM cân đối tuyến và tiến độ.","Giao EPC tự chịu trách nhiệm vì hoạt động diễn ra ngoài cổng dự án.","Chấp nhận tuyến ngắn vì tiết kiệm chi phí."],"correct":0,"explain":"Chủ đầu tư cần kiểm soát tác động của phương án logistics đến bên thứ ba; trách nhiệm cụ thể căn cứ hợp đồng và quy định địa phương.","refs":["IFCGEN","XD","ND207"],"category":"Tiền dự án & pháp lý","difficulty":"Nâng cao","actions":["Lấy bản đồ tuyến và lịch di chuyển.","Đi khảo sát rủi ro giao thông cộng đồng.","Xác định các điều kiện và đầu mối phối hợp địa phương.","Thiết lập monitor và kênh tiếp nhận phản ánh."],"evidence":["Traffic risk assessment","Stakeholder communication plan","Approved traffic management plan"],"escalate":"Báo PM khi không thể bảo đảm rủi ro bên thứ ba được kiểm soát.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P0-06"},{"id":"S13","title":"Công trình cảng: hồ sơ legal matrix thiếu cơ quan chuyên ngành","phase":"P0","story":"Nhóm pháp lý tổng hợp thủ tục xây dựng và môi trường nhưng các đầu việc hàng hải/cảng biển vẫn chưa có người phụ trách và chưa rõ phạm vi quyền quản lý.","choices":["Điền đại một cơ quan xử lý để kịp báo cáo.","Yêu cầu chuyên gia pháp lý chuyên ngành cảng rà nghĩa vụ, cơ quan có thẩm quyền và điều kiện kích hoạt; cập nhật ma trận permit với owner và bằng chứng, không suy đoán.","Chuyển tất cả cho HSE EPC xử lý sau đấu thầu."],"correct":1,"explain":"BQLDA phải quản trị chỗ trống pháp lý của toàn phạm vi, không tự kết luận hồ sơ cảng không cần thủ tục vì thiếu đầu mối.","refs":["XD","MT","PCCC","TC8612"],"category":"Tiền dự án & pháp lý","difficulty":"Nâng cao","actions":["Phân nhóm công trình biển/bờ theo thiết kế và ranh giới.","Giao Legal thuê/chỉ định chuyên gia chuyên ngành.","Lập danh mục trigger, mốc và thẩm quyền cần xác minh.","Đưa các đầu việc chưa rõ vào red issue log."],"evidence":["Permit register với trạng thái chưa xác minh","Scope boundary map","Ý kiến chuyên gia pháp lý ngành"],"escalate":"Trình PM khi có mốc thiết kế/thi công phụ thuộc thủ tục chưa xác định.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P0-03"},{"id":"S14","title":"Sức ép cắt ngân sách HSE trước gói thầu EPC","phase":"P1","story":"Tài chính yêu cầu giảm chi phí giám sát độc lập, huấn luyện và ứng phó khẩn cấp để tối ưu CAPEX. Giám đốc dự án yêu cầu HSE đánh giá tác động và đề xuất phương án.","choices":["Đồng ý cắt đồng loạt 30% mọi khoản HSE.","Phản đối mọi cắt giảm mà không đưa ra phương án khác.","Phân loại ngân sách theo yêu cầu bắt buộc, kiểm soát rủi ro trọng yếu và phương án thay thế có kiểm chứng; lập risk–cost options cho PM, không cắt tùy tiện."],"correct":2,"explain":"HSE cấp quản lý phải nói bằng rủi ro và bằng chứng, đồng thời đưa ra phương án tối ưu chi phí hợp pháp và khả thi.","refs":["XD","ND207","IOGP","IFCGEN"],"category":"Thiết kế & đấu thầu","difficulty":"Nâng cao","actions":["Xác định khoản chi đáp ứng nghĩa vụ và critical controls.","So sánh các phương án cùng mức kiểm soát rủi ro.","Lượng hóa hệ quả tiến độ/chất lượng/khả năng ứng cứu.","Trình PM quyết định và ghi lý do."],"evidence":["HSE resource & budget basis","Risk-based options table","PM approval record"],"escalate":"Nếu đề xuất làm giảm kiểm soát trọng yếu dưới mức chấp nhận thì cảnh báo chính thức.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P1-01"},{"id":"S15","title":"Hồ sơ dự thầu EPC có KPI đẹp nhưng không có bằng chứng","phase":"P1","story":"Một liên danh nộp báo cáo “0 tai nạn trong 5 năm”, nhưng từ chối cung cấp nguồn dữ liệu và hồ sơ các sự cố nghiêm trọng.","choices":["Đánh giá HSE capability theo tiêu chí HSMT, yêu cầu bằng chứng và đối chiếu hệ thống kiểm soát rủi ro; ghi nhận điểm chưa xác minh, không coi KPI bằng không là đủ năng lực.","Cho điểm tối đa vì nhà thầu có khẩu hiệu an toàn tốt.","Loại ngay không theo quy trình đánh giá thầu."],"correct":0,"explain":"Đánh giá năng lực phải dựa dữ liệu, hệ thống và điều kiện của hồ sơ mời thầu; kết quả do hội đồng được phân công quyết định.","refs":["IOGP","XD","ND210"],"category":"Thiết kế & đấu thầu","difficulty":"Nâng cao","actions":["Đối chiếu tiêu chí HSE đã công bố trong HSMT.","Yêu cầu clarification và tài liệu chứng minh theo quy trình thầu.","Kiểm tra năng lực critical controls, nhân sự, subcontracting, incident learning.","Lập bảng điểm và đưa kiến nghị khách quan."],"evidence":["HSE bid evaluation matrix","Clarification log","Evidence of OMS and critical control capability"],"escalate":"Escalate gian lận dữ liệu và xung đột lợi ích theo quy trình đấu thầu.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P1-02"},{"id":"S16","title":"Thiết kế HAZOP khuyến nghị bổ sung detector nhưng bị hoãn","phase":"P1","story":"Workshop HAZOP nêu khuyến nghị lắp thêm thiết bị phát hiện khí ở khu vực giao diện. Kỹ thuật muốn hoãn sang sau EPC để không đổi FEED.","choices":["Xóa khuyến nghị khỏi danh sách để giữ mốc thiết kế.","Yêu cầu Technical Authority giải trình và đánh giá ảnh hưởng barrier; theo dõi khuyến nghị HAZOP đến khi đóng có bằng chứng, trình đúng cấp phê duyệt thay đổi.","Tự ký duyệt HAZOP và xác nhận không cần detector."],"correct":1,"explain":"HSE BQLDA giữ tính minh bạch và khả năng truy xuất các khuyến nghị an toàn công nghệ, không tự đóng các quyết định thiết kế.","refs":["Q19","TC8611","NFPA59A","IOGP"],"category":"Thiết kế & đấu thầu","difficulty":"Nâng cao","actions":["Đọc action item, risk ranking và cơ sở thiết kế.","Đặt câu hỏi về người có thẩm quyền đánh giá và phương án giảm rủi ro.","Tổ chức review với design/process safety specialist.","Khóa quyết định trong action tracker và change log."],"evidence":["HAZOP action tracker","Technical authority disposition","Updated design/verification evidence"],"escalate":"Chưa có technical acceptance cho nguy cơ lớn thì báo PM/Design Lead trước thiết kế tiếp theo.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P1-05"},{"id":"S17","title":"Tài liệu EPC HSE Requirements không nhắc an toàn công nghệ","phase":"P1","story":"Bộ yêu cầu HSE gửi bộ phận đấu thầu có PPE, PTW và công việc trên cao nhưng không có yêu cầu về design risk, hazardous area, interlocks, MOC và pre-startup readiness.","choices":["Giữ nguyên vì HAZOP là việc của kỹ thuật, HSE không liên quan.","Bổ sung một dòng “đảm bảo an toàn tuyệt đối” mà không có deliverable.","Phối hợp Process Safety/Design/Operations bổ sung yêu cầu quản lý rủi ro công nghệ, bằng chứng kiểm chứng và cơ chế phê duyệt/đóng action rõ trong HSMT."],"correct":2,"explain":"Employer Requirements phải diễn đạt được kiểm soát và bằng chứng, không dừng ở khẩu hiệu hoặc chỉ an toàn lao động.","refs":["IOGP","Q19","TC8611","NFPA59A"],"category":"Thiết kế & đấu thầu","difficulty":"Nâng cao","actions":["Xác định các high consequence hazards trong phạm vi thiết kế.","Chuyển chúng thành deliverables và hold points rõ ràng.","Đề nghị các ngành kiểm tra phân công và tiêu chí nghiệm thu.","Cập nhật vào technical schedules/HSE appendix hợp đồng."],"evidence":["Contract HSE requirement matrix","Process safety deliverables list","Technical review sign-off"],"escalate":"Báo PM/Procurement trước ngày phát hành HSMT nếu thiếu barrier trọng yếu.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P1-01"},{"id":"S18","title":"Nhà thầu đề xuất thay tiêu chuẩn quốc tế để giảm giá","phase":"P1","story":"EPC đề xuất dùng tiêu chuẩn khác cho hệ thống LNG thay tiêu chuẩn trong Basis of Design. Họ khẳng định “tương đương” nhưng chưa có gap analysis.","choices":["Yêu cầu Engineering và chuyên gia kỹ thuật đánh giá equivalence, điều kiện pháp luật/quy chuẩn bắt buộc và tác động an toàn trước khi PM quyết định.","Chấp thuận vì nhà thầu đã nói tương đương.","HSE tự tuyên bố thay đổi vi phạm pháp luật dù chưa rà phạm vi."],"correct":0,"explain":"Chỉ so sánh tên tiêu chuẩn không đủ; cần đánh giá tương đương và ưu tiên yêu cầu bắt buộc trong phạm vi áp dụng.","refs":["Q19","TC8611","TC8612","TC8613"],"category":"Thiết kế & đấu thầu","difficulty":"Nâng cao","actions":["Khóa baseline tiêu chuẩn thiết kế và hợp đồng.","Yêu cầu EPC lập deviation register và gap/equivalence study.","Process Safety, Design và Legal thẩm tra các điểm an toàn.","Ghi quyết định chấp thuận/không chấp thuận bởi đúng cấp."],"evidence":["Design basis register","Technical deviation & equivalence review","Approval/waiver log"],"escalate":"Escalate khi deviation đụng QCVN hoặc critical barrier chưa được đánh giá.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P1-04"},{"id":"S19","title":"Gói EPC tiến độ rất gấp muốn bỏ bước đánh giá thầu HSE","phase":"P1","story":"Ban dự án muốn chỉ xét giá và tiến độ; hội đồng đánh giá chưa hoàn tất yêu cầu HSE capability và nhà thầu phụ trọng yếu.","choices":["Bỏ qua toàn bộ đánh giá năng lực HSE.","Đề xuất đánh giá HSE rủi ro trọng yếu theo HSMT bằng ma trận minh bạch, báo các mục chưa đạt và lựa chọn đúng thẩm quyền; không tự kéo dài không giới hạn.","Tự tuyên bố nhà thầu không trúng thầu và công bố ra ngoài."],"correct":1,"explain":"Giữ yêu cầu công bằng và bằng chứng của quá trình đánh giá, phân biệt vai trò tham mưu của HSE với quyết định của hội đồng.","refs":["IOGP","ND210","XD"],"category":"Thiết kế & đấu thầu","difficulty":"Nâng cao","actions":["Rà HSMT, phạm vi critical works và tiêu chí HSE.","Chấm dựa trên bằng chứng; hỏi làm rõ theo kênh procurement.","Lập danh sách deviation và proposed mitigations.","Trình committee/PM quyết định bằng hồ sơ."],"evidence":["HSE evaluation score sheet","Clarification & exception log","Bid evaluation meeting minutes"],"escalate":"Escalate xung đột lợi ích hoặc chấp thuận nguy cơ trọng yếu chưa kiểm chứng.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P1-02"},{"id":"S20","title":"Chưa đủ nhân sự giám sát nhưng EPC muốn đưa 600 người vào","phase":"P2","story":"EPC tăng tốc huy động 600 công nhân trong khi HSE supervisors, medical support, hệ thống cấp PTW và nhà thầu phụ chưa đủ theo kế hoạch được chấp thuận.","choices":["Đồng ý vì đã có HSE Plan được ký.","Buộc BQLDA tự bổ sung nhân sự để thay vai trò EPC ngay lập tức.","Xác định thiếu hụt theo yêu cầu hợp đồng, hoạt động rủi ro và điều kiện huy động; đề xuất giới hạn phạm vi/nhân lực đến khi EPC có bằng chứng đủ năng lực."],"correct":2,"explain":"Mobilization là một readiness gate, không chỉ là kiểm hồ sơ; EPC chịu trách nhiệm nguồn lực thực thi.","refs":["ND207","Q18","IOGP"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Yêu cầu mobilization register theo từng gói/nghề.","Kiểm tra thực tế supervisor ratio theo mức rủi ro và HSE Plan.","Đối chiếu PTW, y tế, ứng cứu, đào tạo trước vào.","Gửi blocker list và trình PM quyết định."],"evidence":["Mobilization readiness checklist","Organization/competency records","PTW & emergency preparedness proof"],"escalate":"Escalate nếu huy động khi chưa có người kiểm soát critical tasks.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-01"},{"id":"S21","title":"Báo cáo của EPC ghi “đã đào tạo” nhưng công nhân không hiểu PTW","phase":"P2","story":"Trong buổi walkdown, công nhân làm việc nóng không biết ai là người cho phép hoặc điều kiện kiểm soát trước khi hàn. Hồ sơ điểm danh đào tạo vẫn đầy đủ.","choices":["Yêu cầu EPC dừng/kiểm soát công việc bị ảnh hưởng, đánh giá năng lực thực chất, củng cố chương trình đào tạo và kiểm chứng lại tại hiện trường.","Kết luận đã tuân thủ vì có điểm danh.","BQLDA trực tiếp tổ chức lại toàn bộ lớp cho hàng nghìn công nhân."],"correct":0,"explain":"Assurance phải đối chiếu bằng chứng giấy với năng lực hành vi; EPC chịu trách nhiệm triển khai corrective action.","refs":["Q18","AT","ND207"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Chặn công việc có nguy cơ trực tiếp theo thẩm quyền.","Trao đổi chọn mẫu người lao động, giám sát và permit issuer.","Yêu cầu EPC đánh giá nguyên nhân huấn luyện không hiệu quả.","Kiểm chứng lại năng lực qua thực hành và spot check."],"evidence":["PTW sample & field interview log","Re-training and competency evidence","CAPA effectiveness result"],"escalate":"Báo PM khi phát hiện thiếu hụt năng lực hệ thống hoặc công việc nóng tiếp diễn không an toàn.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-03"},{"id":"S22","title":"Critical lift có bản vẽ nhưng vị trí chân cẩu thay đổi","phase":"P2","story":"EPC đã chấp thuận lift plan. Sáng triển khai, cẩu được chuyển gần mép hố đào so với vị trí trong bản vẽ vì mặt bằng bị chiếm.","choices":["Chấp thuận vì tổng tải không thay đổi.","Can thiệp giữ công việc, yêu cầu EPC và kỹ sư đủ năng lực đánh giá lại nền, khoảng cách, tải, lift plan và xác nhận theo quy trình; kiểm chứng trước khi nâng.","BQLDA tự tính lại ground bearing pressure trên điện thoại và ký thay."],"correct":1,"explain":"Một thay đổi vị trí có thể làm mất hiệu lực đánh giá ban đầu; HSE BQLDA kiểm soát MOC thực thi và bằng chứng.","refs":["Q18","ND207","IOGP"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Ghi nhận deviation thực tế, giữ vùng nâng an toàn.","Yêu cầu EPC so với approved lift plan và lập đánh giá lại.","Kỹ thuật/lifting authority xác minh bản cập nhật.","Kiểm chứng điều kiện trước khi cho tiếp tục."],"evidence":["Updated lift plan & engineering check","Ground condition assessment","Hold/release record"],"escalate":"Escalate nếu EPC cố tiếp tục khi thay đổi chưa được kiểm tra.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-04"},{"id":"S23","title":"PTW được cấp nhưng hai hệ thống permit trùng ranh giới","phase":"P2","story":"EPC A và EPC B cùng thi công trong một hành lang điện; cả hai sử dụng giấy phép riêng với khoảng cách an toàn và người kiểm soát khác nhau.","choices":["Chấp nhận vì bên nào cũng có giấy phép hợp lệ.","Giao supervisor hai bên tự thỏa thuận miệng.","Yêu cầu một cơ chế phối hợp PTW/interface được phê duyệt, cùng cơ quan điều phối vùng ảnh hưởng và cách cô lập năng lượng trước triển khai."],"correct":2,"explain":"Quản trị giao diện là trách nhiệm cấp dự án; hệ thống PTW phân mảnh có thể để lọt tình huống năng lượng nguy hiểm.","refs":["ND207","Q18","IOGP"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Tạm dừng công việc giao cắt chưa rõ ranh giới.","Lập conflict map theo vị trí và thời gian.","BQLDA họp với EPC, construction, electrical authority để chốt permit interface.","Xác minh thực thi và ghi thẩm quyền phát hành PTW."],"evidence":["PTW bridging document","SIMOPS matrix","Isolation/LOTO coordination records"],"escalate":"Báo PM nếu không chỉ định được một đầu mối điều phối hoặc trách nhiệm cô lập năng lượng.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-07"},{"id":"S24","title":"Nhà thầu phụ thay đổi nhưng không trình hồ sơ HSE","phase":"P2","story":"EPC thay nhà thầu lắp đặt cơ điện để lấy tiến độ. Nhà thầu mới đã đưa người vào nhưng chưa qua đánh giá năng lực, induction và hồ sơ thiết bị.","choices":["Yêu cầu EPC kiểm soát huy động nhà thầu phụ theo HSE Plan và hợp đồng, đóng lỗ hổng competency/permit trước khi làm việc; audit lại quy trình subcontractor management.","Cho tiếp tục vì hợp đồng chính giữa chủ đầu tư và EPC vẫn còn hiệu lực.","HSE BQLDA trực tiếp ký hợp đồng thuê nhà thầu phụ thay EPC."],"correct":0,"explain":"Trách nhiệm thầu phụ không biến mất sau hợp đồng EPC; chủ đầu tư kiểm chứng hệ thống quản lý của EPC.","refs":["ND207","IOGP","ND210"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Xác nhận đúng pháp nhân và phạm vi công việc phụ thầu.","So sánh hồ sơ với HSE prequalification criteria.","Yêu cầu EPC bổ sung induction, năng lực, inspection, supervision.","Kiểm chứng việc xử lý nguyên nhân quy trình bỏ lọt."],"evidence":["Subcontractor onboarding register","Competency & induction records","HSE NCR and correction"],"escalate":"Escalate việc EPC cho thầu phụ chưa đủ điều kiện thực hiện công việc rủi ro cao.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-02"},{"id":"S25","title":"Tần suất near-miss giảm đột ngột đúng lúc tiến độ tăng","phase":"P2","story":"Trong ba tuần tiến độ cao điểm, số near-miss bằng 0. Các giám sát nói công nhân ngại báo cáo vì sợ mất thưởng.","choices":["Tuyên dương ngay vì hệ thống an toàn đã hoàn hảo.","Đánh giá chất lượng hệ thống reporting và văn hóa không trừng phạt; đối chiếu trao đổi tại hiện trường, báo cáo giám sát và hành vi nguy hiểm, cải thiện leading indicators.","Chỉ yêu cầu EPC tăng số near-miss lên bằng chỉ tiêu bằng mọi giá."],"correct":1,"explain":"Chỉ số về 0 không nhất thiết là tốt; ép KPI có thể khiến người lao động báo cáo giả.","refs":["IOGP","IFCGEN","AT"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["So sánh tình hình công việc, các biện pháp kiểm soát và báo cáo.","Trao đổi nhóm nhỏ, bảo vệ người báo cáo thiện chí.","Audit cơ chế incentive và luồng xử lý gần sự cố.","Đề xuất chỉ số kiểm soát chất lượng thay vì số lượng."],"evidence":["Near-miss data quality review","Worker feedback log","Improved reporting & learning process"],"escalate":"Escalate nếu có dấu hiệu che giấu sự cố hoặc gây áp lực bất lợi cho người báo cáo.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-06"},{"id":"S26","title":"Báo cáo quan trắc môi trường có số liệu khác hiện trường","phase":"P2","story":"EPC gửi báo cáo môi trường theo kỳ; nhóm HSE BQLDA quan sát xả nước bùn không đúng vị trí, khác điểm đo và điều kiện được ghi trong báo cáo.","choices":["Yêu cầu tư vấn viết lại báo cáo theo số đẹp hơn.","Bỏ qua vì môi trường không phải vấn đề thi công cấp bách.","Yêu cầu kiểm tra nguồn dữ liệu, chuỗi lấy mẫu, điều kiện pháp lý và hoạt động xả thực tế; kiểm soát ngay nguy cơ và phối hợp Environment/Legal xử lý, không sửa số liệu."],"correct":2,"explain":"Quan trắc là bằng chứng phải có tính toàn vẹn; chủ đầu tư có trách nhiệm kiểm soát nghĩa vụ môi trường theo phạm vi.","refs":["MT","ND08","ND48","ND207"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Ghi ảnh/địa điểm/thời điểm và xử lý nguồn phát thải đang gây hại.","Đối chiếu điểm lấy mẫu, người lấy, chain of custody.","Cùng Legal đánh giá nghĩa vụ báo cáo và khắc phục.","Xác minh CAPA, cập nhật risk register."],"evidence":["Sampling chain of custody","Environmental deviation and corrective action","Legal notification assessment"],"escalate":"Báo PM và Legal ngay nếu phát sinh nguy cơ vi phạm hoặc yêu cầu báo cáo cơ quan quản lý.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-08"},{"id":"S27","title":"Công nhân ngất trong không gian hạn chế","phase":"P2","story":"Trong hố kỹ thuật kín, một công nhân bất tỉnh. Một công nhân khác định nhảy xuống cứu ngay, không có giám sát khí và đội cứu hộ sẵn sàng.","choices":["Kích hoạt cứu hộ chuyên nghiệp theo emergency plan, ngăn cứu hộ tự phát gây nạn nhân thứ hai; EPC điều phối tại hiện trường, BQLDA kiểm soát giao diện ứng cứu, thông báo và điều tra.","Cho người thứ hai xuống ngay để cứu cho nhanh.","Yêu cầu tiếp tục làm việc khu khác mà không cần kiểm tra hệ thống permit."],"correct":0,"explain":"Không gian hạn chế có rủi ro thiếu oxy, khí độc; cứu hộ không kiểm soát có thể tăng thương vong.","refs":["Q18","AT","ND207","IFCGEN"],"category":"Xây lắp & quản trị EPC","difficulty":"Khẩn cấp","actions":["Báo khẩn cấp và bảo vệ hiện trường, không cho người chưa có phương án cứu hộ vào.","Kích hoạt đội ứng cứu có thiết bị và năng lực.","Phối hợp y tế, Legal, PM theo luồng khẩn.","Đánh giá lại permit, rescue plan cho các khu tương tự."],"evidence":["Emergency activation log","Rescue/medical records","Confined space system review"],"escalate":"Báo cáo khẩn cấp ngay; nếu hoạt động tương tự đang diễn ra thì yêu cầu rà soát diện rộng.","trap":"HSE BQLDA phải bảo đảm hệ thống ứng cứu được kích hoạt, không tự ý lao vào không gian thiếu oxy.","related":"P2-09"},{"id":"S28","title":"Sự cố sập giàn giáo nhỏ bị EPC muốn xử lý kín","phase":"P2","story":"Một giàn giáo không có người sập trong giờ nghỉ. EPC đề nghị không báo để tránh đình trệ và chỉ thay giàn giáo rồi tiếp tục.","choices":["Đồng ý vì không có người bị thương nên không cần quản lý.","Yêu cầu phong tỏa khu vực, đánh giá theo tiêu chí phân loại và nghĩa vụ báo cáo, bảo toàn bằng chứng, xác minh nguyên nhân hệ thống trước khi mở lại các giàn giáo tương tự.","Tự đăng sự cố lên mạng xã hội để gây áp lực."],"correct":1,"explain":"High-potential incident không thể đo chỉ bằng số thương vong; trách nhiệm báo cáo phải dựa đúng tiêu chí pháp luật và quy trình.","refs":["Q18","ND207","AT"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Giữ hiện trường và kiểm soát hazard còn tồn tại.","Yêu cầu EPC báo cáo và phân loại sự cố theo quy định.","Rà hồ sơ thiết kế, nghiệm thu và kiểm tra giàn giáo tương tự.","Yêu cầu CAPA có xác minh hiệu lực."],"evidence":["Incident classification & evidence log","Scaffold inspection reports","Close-out of systemic CAPA"],"escalate":"Báo PM và Legal nếu có dấu hiệu phải thông báo cơ quan có thẩm quyền.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-09"},{"id":"S29","title":"Tư vấn giám sát và EPC bất đồng ai có quyền dừng việc","phase":"P2","story":"Trong một lần kiểm tra critical lift, tư vấn giám sát yêu cầu dừng; EPC phản đối vì không thấy văn bản nào quy định thẩm quyền stop-work của tư vấn.","choices":["Cho tiếp tục trong khi các bên tranh luận trách nhiệm.","Tự ban hành kỷ luật nhà thầu khi chưa đối chiếu thẩm quyền.","Ưu tiên cô lập nguy cơ, đối chiếu hệ thống phân quyền đã thông báo và điều khoản hợp đồng; PM xử lý xung đột, ban hành rõ cơ chế stop-work/restart áp dụng tất cả các bên."],"correct":2,"explain":"Thẩm quyền không được bỏ ngỏ tại hiện trường; yêu cầu an toàn và nghĩa vụ pháp lý không thể đình lại vì tranh luận văn bản.","refs":["ND207","XD","ND210"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Kiểm soát nguy cơ khẩn cấp và ghi quyết định ban đầu.","Đối chiếu authority matrix, construction management procedures, contract clauses.","Họp PM/Consultant/EPC thống nhất escalation.","Truyền thông lại stop-work và restart route."],"evidence":["Stop-work register","Authority matrix & contract excerpt","Restart authorization record"],"escalate":"Báo PM ngay khi các bên tranh chấp và công việc có rủi ro không kiểm soát.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-03"},{"id":"S30","title":"Thử áp pipeline gần khu vực công nhân EPC khác","phase":"P2","story":"EPC A chuẩn bị thử áp đường ống; EPC B bố trí công nhân làm sơn cách khu thử. Bên thử áp nói đã có rào chắn riêng.","choices":["Yêu cầu SIMOPS risk review cấp dự án, xác minh vùng nguy hiểm theo phương án kỹ thuật và di dời/giới hạn công việc giao cắt theo thẩm quyền.","Cho thử vì cả hai bên đều có phương án riêng.","HSE BQLDA tự ấn định mọi thông số áp lực và exclusion zone."],"correct":0,"explain":"Rủi ro thử áp có thể vượt ranh giới hợp đồng; chuyên gia kỹ thuật xác định vùng và điều kiện, PMU điều phối.","refs":["Q18","ND207","IOGP"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Lấy test package, bản đồ vùng tác động.","Technical authority xác định exclusion zone và barrier.","Họp hai EPC chốt lịch, permit interface, cảnh báo.","Kiểm tra hiện trường trước và trong test."],"evidence":["Test plan & engineering hazards","SIMOPS exclusion map","Joint briefing and permit records"],"escalate":"Escalate nếu không thể tách vùng nguy hiểm khỏi các bên đang làm việc.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-07"},{"id":"S31","title":"Mưa bão sắp tới, tiến độ ép tiếp tục thi công trên cao","phase":"P2","story":"Dự báo thời tiết xấu; chỉ huy trưởng EPC muốn tiếp tục lắp kết cấu trên cao. Kế hoạch weather-trigger và giới hạn gió trong lifting plan chưa rõ.","choices":["Tiếp tục nếu công nhân ký cam kết.","Yêu cầu EPC đối chiếu điều kiện môi trường và ngưỡng dừng theo thiết kế thiết bị/quy trình; BQLDA kiểm chứng sẵn sàng ứng phó và điều phối quyết định tạm dừng.","BQLDA tự đặt một con số gió tối đa áp dụng mọi cẩu và công việc."],"correct":1,"explain":"Ngưỡng vận hành phải dựa thiết bị, phương án kỹ thuật và quy trình áp dụng, không dựa vào cảm giác.","refs":["Q18","ND207","IFCGEN"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Yêu cầu EPC đánh giá điều kiện thi công tại thời điểm làm việc.","Kiểm tra ngưỡng ngừng việc trong thiết kế/biện pháp.","Kiểm tra secure equipment, evacuation/response.","Ghi quyết định stop/resume và thông báo các bên."],"evidence":["Weather monitoring log","Updated lift/work at height readiness","Decision & restart records"],"escalate":"Escalate khi có nguy cơ đe dọa tính mạng hoặc vi phạm điều kiện thiết bị.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-05"},{"id":"S32","title":"Cơ quan quản lý đến kiểm tra đột xuất công trường","phase":"P2","story":"Đoàn kiểm tra yêu cầu hồ sơ ATLĐ, môi trường và PCCC. EPC và tư vấn chưa thống nhất ai xuất trình hồ sơ nào, người phụ trách vắng mặt.","choices":["Đưa ngay các tài liệu chưa kiểm tra, tự ký xác nhận thay mọi bộ phận.","Chỉ đạo giấu các hồ sơ có lỗi.","Kích hoạt protocol tiếp đoàn theo phân quyền, bảo toàn tính trung thực của hồ sơ, phân công Legal, PM, EPC cung cấp đúng tài liệu và theo dõi các yêu cầu khắc phục."],"correct":2,"explain":"PMU phải duy trì traceability và kiểm soát phản hồi; không tự cản trở đoàn kiểm tra hoặc che giấu thông tin.","refs":["AT","XD","ND207","MT","PCCC"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Xác định thẩm quyền, phạm vi kiểm tra và điểm tiếp nhận.","Chỉ định chủ tài liệu và tập hợp hồ sơ đúng phiên bản.","Ghi nhận yêu cầu/biên bản, hạn đáp ứng.","Mở action tracker và báo cáo PM."],"evidence":["Inspection document index","Minutes & regulator action register","Close-out evidence"],"escalate":"Báo PM/Legal ngay nếu có yêu cầu dừng việc, xử phạt hoặc điều kiện pháp lý cấp thiết.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-10"},{"id":"S33","title":"EPC xin nghiệm thu có điều kiện khi còn lỗi critical","phase":"P3","story":"Công việc lắp đặt hệ thống phát hiện khí xong phần cơ nhưng commissioning test chưa chứng minh toàn bộ vòng phát hiện – báo động – liên động.","choices":["Giữ critical punch list mở; yêu cầu Technical/Commissioning/Operations xác minh functional test, không ký chấp thuận readiness hay kiến nghị tiếp nhận khí khi barrier chưa có bằng chứng.","Chấp nhận vì nhà cung cấp cam kết sẽ kiểm tra sau nạp khí.","HSE BQLDA tự ký xác nhận functional safety thay chuyên gia."],"correct":0,"explain":"Bằng chứng barrier hoạt động thực tế mới là cơ sở đánh giá readiness; hồ sơ lắp đặt không tự đồng nghĩa chạy thử đạt.","refs":["Q19","TC8611","NFPA59A"],"category":"Commissioning & first gas","difficulty":"Nâng cao","actions":["Xác định yêu cầu thử nghiệm trong scope và test procedures.","Đối chiếu punch list với commissioning gating.","Thu thập hồ sơ test có người xác nhận đúng năng lực.","Trình readiness panel xác nhận trước first gas."],"evidence":["Functional test records","Critical punch list & close-out","PSSR release record"],"escalate":"Báo PM/Commissioning Director nếu muốn bỏ qua kiểm tra bắt buộc.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P3-03"},{"id":"S34","title":"MOC chưa hoàn tất nhưng kỹ sư đề nghị thay cấu hình ESD","phase":"P3","story":"Gần ngày nạp khí, nhóm commissioning muốn tạm thời bypass liên động ESD cho thử nghiệm. Đề xuất chưa có đánh giá MOC và phương án an toàn.","choices":["Cho phép bypass vì mục đích test và có kỹ sư tại chỗ.","Yêu cầu dừng quyết định bypass đến khi có quy trình MOC/temporary override và Technical Authority phê duyệt; HSE kiểm chứng quản lý rủi ro, thời hạn và khôi phục.","HSE BQLDA tự xác nhận ESD không cần trong giai đoạn này."],"correct":1,"explain":"Bypass bảo vệ an toàn công nghệ cần quản lý thay đổi, trách nhiệm rõ và chứng minh kiểm soát thay thế nếu áp dụng.","refs":["Q19","TC8611","NFPA59A"],"category":"Commissioning & first gas","difficulty":"Nâng cao","actions":["Xác nhận phạm vi thay đổi và hệ quả.","Triệu tập Process Safety/Operations/Commissioning/Controls.","Yêu cầu MOC/waiver theo thẩm quyền và commissioning procedure.","Theo dõi restoration & functional re-test."],"evidence":["MOC / override register","Technical risk assessment","Restoration and re-test evidence"],"escalate":"Escalate ngay khi bypass thiếu phê duyệt và có nguy cơ first gas.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P3-02"},{"id":"S35","title":"Đưa LNG vào bồn khi đội emergency chưa diễn tập","phase":"P3","story":"Các hệ thống kỹ thuật báo sẵn sàng. Đội vận hành/ứng cứu liên cơ sở chưa diễn tập kịch bản rò LNG, mất điện và người bị bỏng lạnh.","choices":["Cho phép vì chưa có sự cố thực tế nên chưa cần diễn tập.","HSE BQLDA tự ký chứng nhận đủ điều kiện vận hành LNG.","Đưa emergency preparedness vào PSSR gating; yêu cầu diễn tập phù hợp rủi ro, khép các phát hiện và xác nhận năng lực ứng cứu trước quyết định nạp khí."],"correct":2,"explain":"First gas readiness bao gồm con người và khả năng ứng phó, không chỉ thiết bị.","refs":["Q19","TC8611","PCCC","IFCGEN"],"category":"Commissioning & first gas","difficulty":"Nâng cao","actions":["Xác định các kịch bản rủi ro theo HAZID/QRA đã được phê duyệt.","Đối chiếu các yêu cầu diễn tập, phối hợp bên ngoài.","Tổ chức diễn tập và đánh giá hậu diễn tập.","Theo dõi corrective actions vào readiness panel."],"evidence":["Emergency response plan","Drill report and lessons learned","Readiness closure with accountable signatures"],"escalate":"Escalate khi emergency capability bắt buộc chưa được chứng minh.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P3-03"},{"id":"S36","title":"Tàu LNG tới cảng nhưng bờ–tàu chưa thống nhất trách nhiệm","phase":"P3","story":"Bộ phận hàng hải xác nhận tàu LNG đến sớm. Biên bản interface ship/shore, ESD link, thông tin liên lạc và trách nhiệm ứng cứu chưa được khép.","choices":["Chủ trì phối hợp interface review giữa Marine/Terminal/Operations/EPC theo phân quyền, giữ mốc giao nhận nếu còn barrier quan trọng chưa được xác minh.","Cho cập cảng và kết nối vì lịch tàu không thể thay đổi.","HSE BQLDA tự thực hiện thao tác ship/shore và phê duyệt thay Port Authority."],"correct":0,"explain":"Giao diện cảng–bờ là kiểm soát hệ thống; việc bến tiếp nhận sẵn sàng không thể chỉ dựa tiến độ.","refs":["Q19","TC8612","TC8613","IFCGEN"],"category":"Commissioning & first gas","difficulty":"Nâng cao","actions":["Xác định terminal operator, marine authority và thủ tục áp dụng.","Rà ship/shore safety checklist, interface agreement và communication.","Xác minh test chức năng kết nối nếu yêu cầu.","Trình đúng cấp phê duyệt go/no-go."],"evidence":["Ship/shore interface protocol","ESD link readiness and checklist","Joint emergency coordination record"],"escalate":"Escalate tới PM, Marine, Operations khi có rủi ro không được giao chủ sở hữu.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P3-04"},{"id":"S37","title":"Phát hiện khí trong chạy thử: EPC đổ lỗi cho O&M","phase":"P3","story":"Khi test áp lực có tín hiệu detector khí. EPC cho rằng do thiết bị đo lỗi, O&M nói phải dừng; chưa có phân quyền thống nhất trong giai đoạn chuyển giao.","choices":["Cho EPC tự reset alarm để tiếp tục test.","Kích hoạt response theo alarm philosophy, bảo đảm cô lập nguy cơ, và dùng commissioning interface matrix để phân công xác minh độc lập và quyết định restart.","Yêu cầu HSE BQLDA xóa tín hiệu báo động trên hệ thống."],"correct":1,"explain":"Bất đồng trách nhiệm không được làm chậm ứng cứu; phải theo quy trình đã có và kiểm chứng trước restart.","refs":["Q19","TC8611","IFCGEN"],"category":"Commissioning & first gas","difficulty":"Nâng cao","actions":["Kích hoạt trạng thái an toàn theo quy trình hiện hành.","Tập hợp log tín hiệu/kiểm tra hiện trường bởi người có năng lực.","Ghi owner xác minh và authority to restart.","Cập nhật interface/commissioning procedure nếu còn lỗ hổng."],"evidence":["Alarm/event log","Test & investigation record","Restart authorization"],"escalate":"Báo Commissioning Manager/PM khi chưa rõ thẩm quyền restart hoặc còn nghi ngờ rò khí.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P3-01"},{"id":"S38","title":"Vận hành chưa nhận đầy đủ hồ sơ HSE nhưng EPC xin hoàn công","phase":"P4","story":"EPC bàn giao mechanical completion nhưng thiếu hồ sơ chemical inventory, PSSR, maintenance safety barriers và training records cho O&M.","choices":["Nhận hồ sơ trước vì EPC hứa gửi sau qua email.","HSE BQLDA tự cấp chứng nhận vận hành an toàn cho toàn hệ thống.","Yêu cầu HSE handover dossier index theo hệ thống, phân loại hồ sơ bắt buộc/điều kiện nghiệm thu và outstanding list; phối hợp O&M, Engineering, EPC đóng trước các mốc hợp đồng."],"correct":2,"explain":"Không bàn giao “khoảng trống kiểm soát” cho O&M; bàn giao phải có traceability, người nhận và trạng thái.","refs":["Q19","TC8611","XD","IOGP"],"category":"Bàn giao & vận hành","difficulty":"Nâng cao","actions":["Rà scope bàn giao theo từng hệ thống.","Tạo index về HSE documents, training, permits, MOC, hazards.","Gán owner và closure criteria cho missing critical items.","Tham gia handover review và trình cấp được phân quyền."],"evidence":["HSE dossier index","Punch list with criticality","Receiving O&M acceptance record"],"escalate":"Escalate khi thiếu dữ liệu thiết yếu để kiểm soát process safety khi vận hành.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P4-01"},{"id":"S39","title":"ĐTM phê duyệt một phương án, as-built lại thay đổi vị trí xả","phase":"P4","story":"Hệ thống xả nước sau xây lắp có điểm cuối khác với phương án trong hồ sơ pháp lý hiện có. Nhóm vận hành bảo vị trí mới hợp lý hơn.","choices":["Yêu cầu phối hợp Legal/Environment/Engineering đánh giá thay đổi so với hồ sơ đã được chấp thuận và các nghĩa vụ điều chỉnh; không mặc nhiên chấp nhận vận hành thử.","Cho thử ngay vì môi trường thực tế chưa thấy ảnh hưởng.","Giao toàn bộ cho EPC rồi không cần theo dõi."],"correct":0,"explain":"MOC còn áp dụng cả nghĩa vụ môi trường; thay đổi as-built có thể tạo nghĩa vụ cập nhật hoặc điều chỉnh hồ sơ.","refs":["MT","ND08","ND48"],"category":"Bàn giao & vận hành","difficulty":"Nâng cao","actions":["Khóa bản vẽ as-built và trạng thái pháp lý hiện hành.","Đánh giá thay đổi thông số, địa điểm, ảnh hưởng.","Lấy ý kiến chuyên môn pháp lý môi trường về thủ tục cần làm.","Theo dõi quyết định đến khi có bằng chứng."],"evidence":["As-built/approved design comparison","Environment legal opinion & action tracker","Change authorization record"],"escalate":"Báo PM/O&M nếu hoạt động dự kiến cần điều kiện môi trường chưa đạt.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P4-02"},{"id":"S40","title":"KPI HSE năm đầu vận hành chưa có chỉ số process safety","phase":"P4","story":"O&M đề xuất báo cáo duy nhất LTI, PPE, số buổi huấn luyện. Không có chỉ số kiểm chứng thiết bị an toàn trọng yếu, MOC, PSSR hay overdue safety-critical maintenance.","choices":["Chấp nhận vì nhà máy chưa ghi nhận tai nạn.","Đề xuất khung leading/lagging indicators cho cả occupational và process safety, thống nhất hệ thống dữ liệu, ownership và cơ chế cảnh báo.","Áp dụng một KPI duy nhất là “zero accident” cho mọi bộ phận."],"correct":1,"explain":"KPI phản ánh hàng rào kiểm soát, không chỉ kết quả tai nạn; phải do chủ sở hữu hệ thống vận hành xác nhận.","refs":["Q19","IOGP","IFCGEN"],"category":"Bàn giao & vận hành","difficulty":"Nâng cao","actions":["Đối chiếu bowtie/hazard register và các barrier được chọn.","Làm việc với Maintenance/Operations/Process Safety định nghĩa chỉ tiêu.","Thống nhất nguồn dữ liệu, ngưỡng cảnh báo và action ownership.","Báo cáo xu hướng cho lãnh đạo và review định kỳ."],"evidence":["Process safety KPI dictionary","Data owner & verification workflow","Management dashboard with action triggers"],"escalate":"Escalate khi barrier trọng yếu liên tục quá hạn mà KPI tổng thể vẫn “xanh”.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P4-01"},{"id":"S41","title":"Thay đổi đơn vị vận hành trước bàn giao","phase":"P4","story":"Chủ đầu tư quyết định thuê O&M khác so với dự kiến. Tài liệu HSE và đào tạo đã lập theo tổ chức cũ.","choices":["Chỉ đổi tên đơn vị trong file Excel rồi đóng hồ sơ.","Để EPC quyết định người vận hành mới đủ năng lực hay không.","Đánh giá lại organization/competency/authority matrix, xác nhận khả năng tiếp nhận, đào tạo chuyển giao, emergency interface và các nghĩa vụ hợp đồng trước bàn giao."],"correct":2,"explain":"Việc thay người vận hành là thay đổi tổ chức có thể ảnh hưởng safety-critical competence và trách nhiệm vận hành.","refs":["Q19","XD","IOGP"],"category":"Bàn giao & vận hành","difficulty":"Nâng cao","actions":["Lập bản đồ tổ chức cũ/mới và gap năng lực.","Rà những hồ sơ, giấy phép, quyền truy cập và trách nhiệm phải chuyển.","Thực hiện competency assessment và bridging training.","Xác minh readiness với PM/Operations."],"evidence":["O&M transition action plan","Competency and training record","Revised authority/emergency interface matrix"],"escalate":"Escalate nếu chưa có người chịu trách nhiệm an toàn công nghệ sau ngày tiếp nhận.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P4-02"},{"id":"S42","title":"Giám đốc yêu cầu ký “đã an toàn” khi chưa kiểm tra đủ","phase":"P4","story":"Ngày ký bàn giao, PM yêu cầu HSE BQLDA ký xác nhận toàn nhà máy “an toàn tuyệt đối” để phát hành thông cáo. HSE BQLDA chưa có đủ bằng chứng các điều kiện liên ngành.","choices":["Giải thích không có chứng nhận tuyệt đối; chỉ xác nhận nội dung thuộc phạm vi được giao, dựa chứng cứ và ngoại lệ; đề xuất đúng người ký theo authority matrix.","Ký ngay vì Giám đốc dự án đã chỉ đạo.","Tự ý công bố mọi hồ sơ nội bộ ra công chúng."],"correct":0,"explain":"HSE Manager cấp quản lý cần minh bạch trách nhiệm, giới hạn chữ ký và chất lượng bằng chứng.","refs":["XD","ND207","Q19"],"category":"Bàn giao & vận hành","difficulty":"Nâng cao","actions":["Xác định câu chữ/đối tượng ký và ý nghĩa pháp lý.","Tách factual verification, technical acceptance, corporate announcement.","Ghi phần chưa được kiểm chứng, caveats và người chịu trách nhiệm.","Đề xuất văn bản đúng scope để PM ra quyết định."],"evidence":["Authority matrix","Readiness exception log","Approval wording with limitation"],"escalate":"Escalate nếu có yêu cầu ký vượt thẩm quyền hoặc che giấu risk-critical open items.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P4-01"},{"id":"S43","title":"Thầu phụ không cấp nước uống và khu nghỉ cho lao động","phase":"P2","story":"Walkdown phát hiện lao động nhà thầu phụ làm ngoài trời nhiều giờ, thiếu nước uống và khu nghỉ, EPC báo chỉ quản lý tai nạn rủi ro cao.","choices":["Chỉ nhắc công nhân tự mang nước.","Yêu cầu EPC kiểm soát điều kiện lao động theo pháp luật và hợp đồng, phối hợp HR/HSE kiểm tra rủi ro nhiệt, phúc lợi và CAPA theo cấp độ ảnh hưởng.","Yêu cầu BQLDA tự thanh toán phúc lợi cho toàn bộ nhà thầu mà không rà hợp đồng."],"correct":1,"explain":"Occupational health và điều kiện lao động là thành phần của HSE; trách nhiệm chính của sử dụng lao động cần được thực hiện.","refs":["AT","ND207","IFCGEN"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Kiểm tra dấu hiệu căng thẳng nhiệt và điều kiện làm việc.","Đối chiếu yêu cầu pháp luật/hợp đồng và risk assessment.","Yêu cầu EPC xử lý, kiểm tra các subcontractor khác.","Theo dõi bằng bằng chứng hiện trường và worker feedback."],"evidence":["Welfare inspection record","Contractual minimum conditions review","Corrective action close-out"],"escalate":"Escalate khi có nguy cơ ảnh hưởng sức khỏe tức thời.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-08"},{"id":"S44","title":"Tổ chức diễn tập PCCC chỉ có EPC A, bỏ quên EPC B","phase":"P2","story":"EPC A có kế hoạch diễn tập cháy tại kho vật tư. EPC B dùng cùng cổng thoát hiểm nhưng không được thông báo, đội bảo vệ không rõ ai điểm danh.","choices":["Cho diễn tập riêng; việc của EPC B không thuộc hợp đồng EPC A.","Chờ tới khi xảy ra cháy thật mới họp liên hợp.","Yêu cầu diễn tập và phương án ứng cứu liên hợp theo interface, xác lập accountability về alarm, evacuation, muster và thông tin cơ quan hỗ trợ."],"correct":2,"explain":"Ứng cứu tại công trường có rủi ro giao diện, chủ đầu tư phải bảo đảm phối hợp giữa các nhà thầu.","refs":["PCCC","Q18","ND207"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Rà vùng ảnh hưởng và luồng sơ tán của từng EPC.","Họp Security/Fire/EPC A/EPC B xác lập joint ERP.","Thử thông tin, muster and accountability.","Ghi lessons learned và kiểm tra CAPA."],"evidence":["Joint emergency interface plan","Drill evaluation minutes","CAPA closure evidence"],"escalate":"Escalate khi luồng sơ tán/danh sách lao động có nguy cơ sai.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-07"},{"id":"S45","title":"Mua thiết bị LNG chưa yêu cầu HSE trong hồ sơ nhà sản xuất","phase":"P1","story":"Nhóm mua sắm chuẩn bị đặt thiết bị có yêu cầu an toàn công nghệ, nhưng hồ sơ thương mại không yêu cầu dữ liệu hazard, test, certification hoặc maintenance critical.","choices":["Phối hợp kỹ thuật và procurement gắn HSE deliverables/hold points vào purchase specification và hợp đồng, xác minh tiêu chuẩn áp dụng trước PO.","Đặt mua trước, bổ sung chứng từ sau khi thiết bị đến.","HSE BQLDA tự chỉ định nhà sản xuất theo cảm nhận."],"correct":0,"explain":"HSE trong mua sắm gắn với thiết kế, tính toàn vẹn và hồ sơ kiểm chứng an toàn từ đầu chuỗi cung ứng.","refs":["Q19","TC8611","IOGP"],"category":"Thiết kế & đấu thầu","difficulty":"Nâng cao","actions":["Liệt kê safety-critical equipment theo thiết kế.","Chốt technical data requirements với Engineering/QAQC.","Thiết kế vendor documentation review/inspection hold points.","Theo dõi giao hồ sơ trước FAT và giao hàng."],"evidence":["PO HSE/quality requirements","Vendor document register","FAT/ITP records"],"escalate":"Escalate procurement khi hợp đồng sắp chốt mà thiếu yêu cầu bắt buộc.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P1-03"},{"id":"S46","title":"Rò LNG giả định trong HAZID ảnh hưởng khu dân cư","phase":"P1","story":"Nghiên cứu HAZID nhận diện kịch bản phát tán có khả năng ảnh hưởng ngoài hàng rào dự án. Nhóm truyền thông đề nghị giấu để tránh phản ứng cộng đồng.","choices":["Xóa kịch bản khỏi báo cáo vì chưa xảy ra.","Yêu cầu chuyên gia process safety/quantitative risk đánh giá theo TOR và pháp luật, xây dựng phương án kiểm soát; phối hợp Legal/Community thông tin chính xác theo quy trình.","Tự công bố mức nguy hiểm hoặc bán kính phát tán khi chưa có nghiên cứu."],"correct":1,"explain":"HSE BQLDA không tự tính QRA nhưng phải bảo đảm giả định, khuyến nghị và giao diện cộng đồng được quản trị đúng.","refs":["Q19","TC8611","IFCGEN","MT"],"category":"Thiết kế & đấu thầu","difficulty":"Nâng cao","actions":["Giữ nguyên traceability của hazard study.","Yêu cầu chuyên gia xác minh kịch bản, input và consequence.","Đưa design/ERP/community actions vào tracker.","Trình PM/Legal kế hoạch quản lý và thông tin."],"evidence":["HAZID/QRA action register","Design mitigation and emergency planning","Communication approval log"],"escalate":"Escalate risk high consequence không được giải quyết trước freeze design.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P1-05"},{"id":"S47","title":"Phát hiện tham nhũng trong chứng chỉ kiểm định máy nâng","phase":"P2","story":"Một nhà thầu dùng chứng chỉ kiểm định có dấu hiệu sửa ngày và tên thiết bị. EPC chỉ hứa “đổi bản scan”, đang xin phép tiếp tục nâng hạ.","choices":["Chấp nhận bản scan mới không cần xác minh độc lập.","Tự cáo buộc cá nhân phạm tội và công bố công khai.","Dừng sử dụng thiết bị nghi vấn theo thẩm quyền, yêu cầu đối chiếu nguồn kiểm định, giao EPC kiểm tra diện rộng và chuyển Legal/Compliance nếu có dấu hiệu gian lận."],"correct":2,"explain":"Bằng chứng kiểm định phải truy xuất được thiết bị và tổ chức kiểm định; HSE PMU không là cơ quan điều tra nhưng phải bảo vệ hệ thống quản lý.","refs":["Q18","AT","ND207"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Cách ly thiết bị bị nghi ngờ.","Kiểm tra số seri, thời hạn, tổ chức/đơn vị cấp chứng chỉ.","Yêu cầu EPC audit các thiết bị khác.","Thông báo Compliance/Legal và theo dõi kết luận."],"evidence":["Equipment inspection & certificate verification","Deviation evidence log","Legal/compliance review"],"escalate":"Escalate ngay khi có nguy cơ thiết bị mất an toàn hoặc gian lận hệ thống.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-04"},{"id":"S48","title":"Dự án tạm dừng 6 tháng, EPC đề nghị không duy trì bảo vệ thiết bị","phase":"P2","story":"Ban lãnh đạo giãn tiến độ, EPC muốn cắt bảo vệ, bảo quản thiết bị, phòng cháy và hệ thống kiểm tra trong 6 tháng.","choices":["Yêu cầu preservation & suspension HSE plan theo rủi ro công trường, bảo vệ thiết bị và môi trường, giao EPC/tư vấn thực hiện và BQLDA giám sát bằng KPI.","Đồng ý vì không thi công nên không có rủi ro.","BQLDA tự bảo dưỡng tất cả thiết bị thay EPC."],"correct":0,"explain":"Tạm dừng không loại trừ rủi ro cháy, bảo quản và lối thoát, hoặc trách nhiệm giữ công trường an toàn.","refs":["ND207","Q18","PCCC","IOGP"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Lập inventory thiết bị/hóa chất/công trình dở dang.","Đánh giá rủi ro thời gian tạm dừng và trách nhiệm theo hợp đồng.","Chốt bảo vệ, quan trắc, PCCC, inspection, restart criteria.","Rà định kỳ và update PM."],"evidence":["Suspension HSE plan","Asset preservation & emergency log","Restart readiness criteria"],"escalate":"Báo PM nếu tiết giảm nguồn lực đe dọa hàng rào an toàn cơ bản.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-10"},{"id":"S49","title":"Áp lực ra thông cáo “0 sự cố” dù có sự kiện high-potential","phase":"P2","story":"Truyền thông muốn đăng thông cáo công trường tuyệt đối an toàn dù vừa xảy ra sự cố suýt rơi thiết bị nặng không có người bị thương.","choices":["Chấp nhận ngôn ngữ “không có sự cố” vì không ai bị thương.","Phối hợp PM/Comms báo trung thực theo định nghĩa KPI, không nhầm zero injury với zero high potential event; đưa bài học và CAPA vào báo cáo quản trị.","Tự tiết lộ hồ sơ nội bộ chưa được phép công khai."],"correct":1,"explain":"Thông điệp chính xác bảo vệ uy t
