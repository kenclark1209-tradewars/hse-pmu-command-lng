ín dài hạn; KPI cần định nghĩa rõ và không giấu high potential incident.","refs":["IOGP","ND207"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Kiểm tra phân loại sự kiện và chứng cứ.","Rà wording/metrics với Communication/Legal.","Lập corrective action and learning summary.","Trình PM thông điệp thống nhất."],"evidence":["Event classification","Approved KPI definition","Comms review and action close-out"],"escalate":"Escalate nếu yêu cầu trình bày sai sự thật hoặc trái nghĩa vụ công bố.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-06"},{"id":"S50","title":"Nhà thầu thuê lao động thời vụ thiếu chứng chỉ cho công việc nghiêm ngặt","phase":"P2","story":"EPC bổ sung lao động thời vụ vào công việc điện và nâng hạ nhưng các hồ sơ đào tạo/competency không khớp nhiệm vụ, đội giám sát muốn sử dụng ngay.","choices":["Cho làm với điều kiện có HSE supervisor theo sát.","Cho nhân sự BQLDA cấp chứng chỉ thay cơ quan đào tạo.","Yêu cầu EPC đối chiếu năng lực theo vị trí và quy định, giữ công việc có yêu cầu chưa đáp ứng, xác minh training/certification và bố trí người đủ điều kiện."],"correct":2,"explain":"Có giám sát không thay điều kiện năng lực bắt buộc; trách nhiệm người sử dụng lao động/nhà thầu phải được kiểm soát.","refs":["AT","ND44","Q18","ND207"],"category":"Xây lắp & quản trị EPC","difficulty":"Nâng cao","actions":["Xác định công việc, điều kiện năng lực áp dụng.","Đối chiếu hồ sơ đào tạo/chứng chỉ với người và nghề.","Yêu cầu EPC bố trí thay thế hoặc đào tạo phù hợp.","Kiểm chứng trực tiếp trên hiện trường."],"evidence":["Competency matrix","Certificates and verification log","Work authorization"],"escalate":"Escalate khi người chưa đủ điều kiện thực hiện công việc rủi ro cao.","trap":"Không biến HSE BQLDA thành người thay nhà thầu lập hoặc ký duyệt hồ sơ kỹ thuật.","related":"P2-01"}],"glossary":[["PMU/BQLDA","Project Management Unit","Ban Quản lý dự án phía chủ đầu tư, tùy cơ cấu được thành lập."],["EPC","Engineering – Procurement – Construction","Tổng thầu thiết kế, mua sắm và xây dựng theo phạm vi hợp đồng."],["FEED","Front-End Engineering Design","Thiết kế cơ sở/thiết kế tiền triển khai tùy cấu trúc dự án, dùng để định hình phạm vi, công nghệ và chi phí."],["Employer’s Requirements","Owner technical/HSE requirements","Yêu cầu của chủ đầu tư trong HSMT/hợp đồng; không phải quy phạm pháp luật tự thân."],["EIA/ĐTM","Environmental Impact Assessment","Đánh giá tác động môi trường theo đối tượng, thủ tục và thẩm quyền áp dụng."],["GPMT","Giấy phép môi trường","Giấy phép môi trường đối với đối tượng áp dụng, khác với thủ tục ĐTM."],["PCCC/CNCH","Fire prevention, firefighting / rescue","Phòng cháy chữa cháy và cứu nạn cứu hộ."],["HSE-MS","Health, Safety & Environment Management System","Hệ thống quản lý an toàn, sức khỏe và môi trường."],["RACI","Responsible / Accountable / Consulted / Informed","Ma trận ai trực tiếp làm, ai chịu trách nhiệm cuối, ai được tham vấn, ai được thông báo."],["Authority Matrix","Delegation of Authority","Ma trận phân quyền phê duyệt/chấp thuận/ký; tách rõ với người quản lý HSE."],["HSMT","Hồ sơ mời thầu","Hồ sơ phát hành cho nhà thầu tham dự theo gói."],["HAZID","Hazard Identification","Nghiên cứu nhận diện mối nguy có cấu trúc."],["HAZOP","Hazard and Operability Study","Đánh giá sai lệch vận hành so với ý định thiết kế; do đội chuyên môn thực hiện."],["QRA","Quantitative Risk Assessment","Đánh giá định lượng rủi ro; cần chuyên gia, dữ liệu và phương pháp phù hợp."],["MAH","Major Accident Hazard","Mối nguy gây sự cố lớn, không đồng nghĩa tai nạn lao động thường gặp."],["Barrier","Risk-control barrier","Hàng rào phòng ngừa hoặc giảm nhẹ sự cố; phải có bằng chứng hiệu lực."],["Bow-tie","Barrier-based risk analysis","Trình bày nguyên nhân–sự cố trung tâm–hậu quả và các hàng rào hai phía."],["PTW","Permit to Work","Hệ thống giấy phép làm việc theo loại công việc, vùng và thẩm quyền."],["JSA/JHA","Job Safety Analysis / Job Hazard Analysis","Phân tích an toàn công việc, gắn với thao tác/địa điểm cụ thể."],["SIMOPS","Simultaneous Operations","Quản lý các hoạt động đồng thời có rủi ro tương tác."],["NCR","Non-conformance Report","Biên bản điểm không phù hợp theo yêu cầu/căn cứ cụ thể."],["CAPA","Corrective and Preventive Action","Hành động khắc phục và phòng ngừa, kiểm chứng hiệu lực."],["MOC","Management of Change","Quản lý thay đổi đối với thiết kế/quy trình/thiết bị/điều kiện."],["PSM","Process Safety Management","Quản trị an toàn công nghệ/kiểm soát sự cố lớn."],["PSSR","Pre-Startup Safety Review","Đánh giá sẵn sàng an toàn trước khi khởi động."],["First gas","First introduction of gas","Mốc đưa khí vào hệ thống, cần readiness và phân quyền rõ."],["O&M","Operation & Maintenance","Đơn vị vận hành và bảo dưỡng nhận bàn giao sau chạy thử."],["SCE","Safety Critical Element","Thiết bị, chức năng hoặc hàng rào quan trọng đối với an toàn."],["Hold point","Điểm dừng kiểm tra","Mốc không chuyển bước nếu chưa có xác nhận/chấp thuận theo hợp đồng và phân quyền."],["Go/No-go","Quyết định cho phép / chưa cho phép","Quyết định quản trị tại các mốc sẵn sàng, không thay thế giấy phép pháp lý."]],"ownerFocus":{"version":"4.3","asOf":"25/11/2026","confirmed":["Phạm vi quản trị đề xuất: HSE phía chủ đầu tư/BQLDA, xuyên suốt chuẩn bị đầu tư, thiết kế, EPC, thi công, chạy thử và bàn giao.","Kế hoạch 408/KH-UBND năm 2026, Phụ lục I, mục 5: phương án LNG Nghi Sơn 1.500 MW, tổng mức đầu tư dự kiến 45.000 tỷ đồng; liên danh Xuân Cầu Holdings – Trung Nam là nhà đầu tư quan tâm theo nguồn công khai.","Chủ trương đầu tư tại vị trí cũ đã chấm dứt. Phương án mới cần đối chiếu quyết định đầu tư, ranh giới công trình và hồ sơ chính thức. Xem Pháp lý theo mốc để đọc căn cứ."],"unknown":["Pháp nhân chủ đầu tư, quyết định thành lập BQLDA, cơ cấu báo cáo và văn bản giao nhiệm vụ/phân cấp.","Tình trạng lựa chọn nhà đầu tư chính thức, quy mô cuối cùng, hợp đồng EPC và phạm vi LNG–cảng–đường ống–nhà máy điện.","Dự án đã có FEED/FS/ĐTM/PCCC/HAZID/HAZOP đến đâu; hồ sơ nào đã được phê duyệt, hồ sơ nào chỉ là dự thảo.","Quyền tạm dừng, quyền review/accept/approve từng loại hồ sơ; HSE team và ngân sách được giao."],"role":"HSE Manager BQLDA / phía chủ đầu tư: người tổ chức khung HSE dự án, quản trị các rủi ro trọng yếu, tích hợp yêu cầu HSE trong thiết kế–hợp đồng–giám sát; kiểm chứng việc thực hiện và tham mưu quyết định cho Project Director. Không thay Legal, kỹ sư thiết kế, tư vấn chuyên ngành hoặc HSE EPC.","priority":["Xác định pháp nhân–phân quyền–phạm vi, trước khi kết luận bất kỳ nghĩa vụ hoặc người được ký.","Lập legal / permit / condition register theo hạng mục và thời điểm kích hoạt.","Lập project major hazard register và assurance plan theo risk-based controls.","Thiết lập Employer HSE Requirements có bằng chứng đo được đưa vào EPC tender/contract.","Quản lý giao diện (interface), sẵn sàng mobilization và giai đoạn PSSR/first gas qua đúng technical authority."],"clarify":[{"ask":"Pháp nhân nào là chủ đầu tư, ký hợp đồng EPC và hồ sơ pháp lý dự án?","why":"Xác định đối tượng có nghĩa vụ pháp lý, approval authority và cấu trúc interface.","next":"Xin sơ đồ pháp nhân và giấy ủy quyền/phân cấp, không suy ra từ tên tập đoàn."},{"ask":"Dự án đang ở bước đề xuất nhà đầu tư, lựa chọn chủ đầu tư, FS/FEED, ĐTM hay mời thầu EPC?","why":"Mỗi giai đoạn cần những HSE deliverables khác nhau.","next":"Xin baseline schedule, approved documents register và missing approvals."},{"ask":"Hạng mục nào thuộc dự án và ai quản lý interface: nhà máy, kho LNG, cảng, tuyến ống, lưới đấu nối?","why":"Tránh bỏ sót vùng giao diện và áp sai quy chuẩn.","next":"Xin battery-limits drawing, package list, interface register."},{"ask":"HSE báo cáo ai, được ký review gì, cấp nào phê duyệt, quy trình stop-work/escalation?","why":"Không ký nhầm HAZOP, QRA, PSSR, JSA, ĐTM/PCCC ngoài thẩm quyền.","next":"Xin authority matrix / RACI và chữ ký mẫu có hiệu lực."},{"ask":"Đội HSE hiện tại, tư vấn EHS/process safety và nguồn lực dự kiến?","why":"Xác định năng lực có thể tự thực hiện và khi cần mời chuyên gia.","next":"Đề xuất staffing by phase, scope of services, assurance coverage."},{"ask":"Các mục tiêu 30–60–90 ngày đầu và vấn đề ưu tiên của dự án là gì?","why":"Cam kết kết quả theo nhu cầu thật của Giám đốc dự án.","next":"Chốt deliverables có owner, hạn, nguồn lực và acceptance criteria."},{"ask":"Có dự kiến các gói EPC độc lập không, và ai là interface authority?","why":"Rủi ro SIMOPS và khoảng trống hợp đồng thường nằm giữa các gói.","next":"Thiết kế interface HSE rules và công việc assurance từ giai đoạn đấu thầu."}],"decisions":[{"title":"Phân định công việc / chữ ký","actual":"Không biết ai có thẩm quyền phê duyệt Project HSE Plan hoặc hồ sơ HAZOP.","hse":"Soạn ma trận RACI và approval workflow; gửi PM xác nhận, ghi rõ review/accept/approve.","others":"PM/Legal/Engineering/Technical Authority chịu trách nhiệm theo pháp luật, hợp đồng và phân cấp.","proof":"Quyết định phân quyền, danh sách ký duyệt, revision register.","stop":"Không đóng dấu “approved by HSE” nếu chỉ có quyền review.","refs":["ND207","XD"]},{"title":"Phạm vi ĐTM, giấy phép môi trường","actual":"Tư vấn nói đã hoàn thành 80% ĐTM, PM muốn báo đủ thủ tục.","hse":"Yêu cầu trigger và scope; rà package/battery limits; gap log, mốc critical path; phối hợp pháp lý và tư vấn.","others":"Chủ thể dự án và cơ quan thẩm quyền theo pháp luật môi trường; tư vấn chịu chuyên môn hồ sơ.","proof":"Hồ sơ đã nộp, biên nhận, kết quả thẩm định/phê duyệt, điều kiện phải thực hiện.","stop":"Không kết luận “đã có phép” chỉ bằng phần trăm hoàn thành.","refs":["MT","ND08","ND05","ND48"]},{"title":"Hồ sơ PCCC và thiết kế","actual":"Chưa rõ hạng mục nào phải thẩm định ở giai đoạn nào.","hse":"Yêu cầu Design/Legal lập design-stage/fire-safety matrix theo công năng, quy mô, quy chuẩn và văn bản hiện hành.","others":"Tư vấn thiết kế/technical reviewer và đúng chủ thể/cơ quan được luật phân công.","proof":"Design basis, scope matrix, kết quả thẩm định/kiểm tra, issue tracker.","stop":"Không nói mặc định Công an thẩm duyệt tất cả hay HSE tự ký xác nhận an toàn thiết kế.","refs":["PCCC","ND105","XD"]},{"title":"HAZID/HAZOP/QRA","actual":"Chủ đầu tư cần ra quyết định với các đề xuất từ chuyên gia công nghệ.","hse":"Lập TOR/participant matrix, đảm bảo input đủ, quản lý action owner/due/evidence; báo blocker cho PM.","others":"Process safety lead, kỹ sư công nghệ, chủ trì study, technical authority kết luận.","proof":"Study report, action tracker, thiết kế cập nhật, sign-off kỹ thuật.","stop":"Không tự chứng nhận QRA đạt hoặc đóng safety-critical action bằng email không rõ căn cứ.","refs":["Q19","IFCLNG"]},{"title":"Đưa HSE vào đấu thầu EPC","actual":"EPC chào giá thấp nhưng chứng minh năng lực HSE yếu.","hse":"Phối hợp Procurement lập yêu cầu có thể đo: nguồn lực, competency, controls, interfaces, reporting, hold points, audit rights.","others":"Procurement/Legal/PM phê duyệt HSMT và kết quả thầu theo phân cấp.","proof":"Employer HSE Requirements, prequal scorecard, clarification minutes, contract clauses.","stop":"Không chọn thầu chỉ dựa trên số nhân viên HSE hay ISO certificate.","refs":["IOGP","ND210","ND207"]},{"title":"Review kế hoạch HSE của EPC","actual":"EPC gửi 150 trang kế hoạch trước mobilization.","hse":"Review gap theo contract, evidence về nhân sự, đào tạo, emergency, subcontractors, critical controls; ghi comment từng mục.","others":"EPC lập và chịu trách nhiệm triển khai; PM/QA/QC/Construction approval route theo contract.","proof":"Comment matrix, accepted HSE Plan revision, mobilization readiness register.","stop":"Không để chữ ký review biến thành đảm bảo tuyệt đối không có tai nạn.","refs":["IOGP","ND207","Q18"]},{"title":"JSA và method statement","actual":"EPC hỏi HSE BQLDA ký hết JSA cho 500 công nhân.","hse":"Chỉ xác lập review hold points/risk sample và kiểm chứng hệ thống PTW/JSAs theo phân quyền.","others":"EPC chịu trách nhiệm biện pháp thi công và giám sát công việc thuộc hợp đồng.","proof":"Contract submittal matrix, signed Method Statement, sampled JSA and site walk records.","stop":"Không ký thay vai trò người lập/duyệt biện pháp thi công của nhà thầu.","refs":["ND207","Q18","IOGP"]},{"title":"Dừng công việc khi nguy hiểm","actual":"Giám sát BQLDA phát hiện công việc nâng hạ thiếu kiểm soát nền/cẩu.","hse":"Can thiệp ngay theo trách nhiệm quản lý an toàn chủ đầu tư, yêu cầu EPC khống chế nguy cơ, lập issue và báo PM.","others":"EPC tổ chức khắc phục và chứng minh đạt; người cho resume theo permit/authority matrix.","proof":"Stop-work record, findings, engineering verification, clearance/resume authorization.","stop":"Không đổi an toàn lấy tiến độ, không tự ký giải pháp nền nếu thiếu chuyên môn.","refs":["ND207","Q18"]},{"title":"SIMOPS hai nhà thầu","actual":"Hai EPC có PTW hợp lệ nhưng giao cắt tuyến vận tải/nâng hạ.","hse":"Gọi interface meeting, phối hợp lập SIMOPS matrix và phân vùng thời gian; chỉ một cơ chế work coordination cho interface.","others":"Construction / Planning / EPC leads điều phối thực thi; PM giải quyết tranh chấp hợp đồng.","proof":"SIMOPS plan, look-ahead schedule, permit interface, meeting minutes.","stop":"PTW độc lập không chứng minh được an toàn giao diện.","refs":["IOGP","ND207"]},{"title":"Tai nạn nghiêm trọng","actual":"Nhà thầu phụ có tai nạn nặng, EPC muốn gửi báo cáo sau.","hse":"Kích hoạt luồng incident owner; ưu tiên cứu nạn, kiểm soát hiện trường, thông tin quản lý và nghĩa vụ thông báo phối hợp đúng chủ thể.","others":"Đội ứng cứu tại hiện trường, EPC, HR/Legal và cơ quan có thẩm quyền theo luật.","proof":"Incident timeline, evidence log, notification tracker, investigation/CAPA assurance.","stop":"Không tự nhận thay thẩm quyền điều tra nhà nước hoặc cung cấp báo chí không được phép.","refs":["AT","ND207"]},{"title":"PSSR / first gas","actual":"EPC muốn nạp khí khi còn các punch item safety critical.","hse":"Yêu cầu PSSR gate: barrier tests, MOC, training, SOP, emergency, LOTO/PTW interfaces, closure tracker.","others":"Commissioning manager, operator/O&M, Engineering Technical Authority quyết định go/no-go theo phân quyền.","proof":"PSSR dossier, system completion certificates, critical punch list, start-up authorization.","stop":"Không coi ký của HSE là giấy phép tự động để first gas.","refs":["IFCLNG","Q19","IOGP"]}],"roadmap":[{"code":"D1–D5","name":"5 ngày đầu: hiểu đúng bối cảnh","why":"Chưa biết pháp nhân, scope, dự án đã đi tới đâu → cần xác minh trước khi kết luận về phê duyệt hoặc tuân thủ.","steps":["Họp 1-1 với Project Director: mục tiêu 90 ngày, cách báo cáo, quyền hạn và ranh giới công việc.","Nhận project charter, legal structure, battery limits, package list, baseline schedule, design docs register, danh mục hồ sơ ĐTM/PCCC.","Làm việc lần lượt với Legal, Environment, Design, Procurement, Planning, Construction/PMU để lập stakeholder map.","Lập Gap Log: điều đã xác minh, điều giả định, hồ sơ thiếu và chủ thể phải trả lời.","Đưa ra Top-10 HSE blockers, mức ưu tiên theo ảnh hưởng đến an toàn, pháp lý và tiến độ."],"outputs":["Project HSE Baseline v0 (facts/assumptions/issues)","Authority & Stakeholder Map v0","One-page Project Director Decision Brief"],"people":"Project Director, Legal, Engineering, Planning, Environment, Procurement","decision":"Xin PM xác nhận danh sách 3 ưu tiên và nguồn lực rà chuyên sâu.","check":"Mỗi blocker có issue ID, evidence/source, accountable owner và next review; không được chỉ ghi “đang xử lý”."},{"code":"D6–D15","name":"Tuần 2: pháp lý – rủi ro – giao diện","why":"Đưa rủi ro ra khỏi email/tài liệu rời rạc thành register quản trị.","steps":["Phân loại từng hạng mục, trigger pháp lý và mốc phải có; để “chưa xác minh” nếu thiếu design basis.","Phối hợp technical specialist tổ chức hoặc rà HAZID sơ bộ và Major Accident Hazard inventory.","Vẽ interfaces giữa cảng LNG, bồn chứa, tái hóa khí, đường ống, nhà máy điện, giao thông và các bên ký hợp đồng.","Xây draft Employer HSE Requirements theo nguy cơ trọng yếu và contractor assurance plan.","Tổ chức risk workshop ngắn với PM để quyết định chủ sở hữu hành động và action close-out evidence."],"outputs":["Legal / Permit / Condition Register v1","Major Hazard & Interface Register v1","EPC HSE Requirements outline"],"people":"Legal, EIA/Env Consultant, Design, Process Safety, Procurement","decision":"Trình các permit critical-path gaps và đề xuất chuyên gia cần thuê.","check":"Không gọi HAZOP là tài liệu do HSE tự chấp thuận; phân định study owner và technical authority."},{"code":"D16–D30","name":"Hết tháng 1: quản trị vận hành được","why":"Từ danh sách đầu việc chuyển thành cơ chế quản lý có cuộc họp, báo cáo, thẩm quyền.","steps":["Đề xuất HSE Policy/Project HSE Governance & approval workflow theo phân cấp thực.","Dự thảo 90-day assurance calendar; xây risk review, document submittal và escalation thresholds.","Tích hợp HSE trong tender package / technical evaluation nếu đúng giai đoạn.","Xây staffing by phase và budget nguyên tắc trên scenario, không tự invent headcount.","Báo cáo Project Director: 5 gaps đã đóng, 5 gaps mở, required decisions và nguồn lực."],"outputs":["Owner HSE Framework v1","Monthly assurance/committee schedule","30-day review / 60-day action priorities"],"people":"Project Director, PMO, Procurement, Finance, Construction","decision":"Đề nghị phê duyệt framework, RACI, resources và KPI.","check":"Có template document control, phiên bản, approver, đường dẫn evidence, owner từng action."},{"code":"D31–D60","name":"Tháng 2: đưa HSE vào hợp đồng và thiết kế","why":"Yêu cầu tốt trong hợp đồng mới có lực thực thi sau award.","steps":["Hoàn thiện Employer HSE Requirements/HSSE schedule trong HSMT và EPC contract.","Review contractor HSE prequalification, HSE Plan, critical-control assurance và bridging requirements theo phân quyền.","Lập design safety review plan: HAZID/HAZOP/QRA/ESD/layout, hành động và interface checks.","Định nghĩa mobilization gate: people competency, site conditions, PTW/emergency/medevac, subcontractor controls.","Diễn tập tình huống cross-contractor; kiểm tra hệ thống báo cáo và NCR/CAPA."],"outputs":["EPC HSE Requirements v1","Contractor HSE Assessment Matrix","Design Safety Action Tracker / Mobilization Gate checklist"],"people":"Procurement, Contracts, Engineering, Process Safety, EPC/consultants (nếu đã có)","decision":"Trình PM/Procurement các điều khoản và điều kiện cần đưa vào hợp đồng.","check":"Mỗi deliverable có contractual reference, revision, accountable owner và gate."},{"code":"D61–D90","name":"Tháng 3: assurance theo trạng thái thật","why":"Bảo đảm sẵn sàng thi công hoặc hoàn thiện chuẩn bị nếu EPC chưa được award.","steps":["Nếu còn tiền dự án: cập nhật legal/design/contract blockers và tổ chức stage-gate review.","Nếu EPC đã huy động: vận hành risk-based assurance, kiểm tra critical controls, SIMOPS, stop-work và CAPA.","Xác lập owner-side weekly report 1 trang: Top-5 risks, critical actions, overdue, decisions.","Tổ chức audit thử đối với 1–2 gói; kiểm tra năng lực tự giám sát của EPC.","Đề xuất roadmap tiếp theo cho construction → commissioning → O&M handover theo thiết kế và schedule cập nhật."],"outputs":["90-day Project HSE Assurance Report","Stage-gate / audit / CAPA register","Kế hoạch 6 tháng tiếp theo theo phase thực tế"],"people":"Project Director, Construction/Engineering, EPC, O&M representative","decision":"Xin quyết định xử lý blocker và ngân sách kiểm chứng chuyên gia.","check":"Không mặc định đã thi công: nhánh công việc phải điều kiện theo tình trạng EPC thực."}],"rhythms":[{"when":"Hằng ngày (nếu đang thi công)","question":"Hôm nay hoạt động critical nào có barrier chưa đạt?","input":"3-week lookahead, permits rủi ro cao, incident alert, NCR overdue","output":"Risk exceptions, decision/action log ngắn","owner":"EPC thực thi; HSE BQLDA xác minh chọn mẫu và báo PM."},{"when":"Hằng tuần (mọi giai đoạn)","question":"Permit/legal/design blockers nào cản milestone?","input":"Register có owner/due, 3 gói thầu quan trọng, số action quá hạn","output":"1-page owner HSE report và quyết định cần PM","owner":"HSE BQLDA chuẩn bị; Legal/Design/EPC xác nhận dữ liệu."},{"when":"Hai tuần / theo design gate","question":"Có thay đổi nào ảnh hưởng major accident hazards hoặc điều kiện thẩm định?","input":"MOC, design changes, HAZOP actions, PCCC/Environmental comments","output":"Design Safety Interface / MOC review log","owner":"Engineering Process Safety lead chủ chuyên môn; HSE theo dõi rủi ro hệ thống."},{"when":"Hằng tháng","question":"Barrier effectiveness, nhà thầu và nguồn lực có đủ cho tháng tới?","input":"Assurance findings, CAPA, contractor HSE performance, budget/resource plan","output":"Monthly Steering Committee HSE pack (≤5 trang)","owner":"Project Director quyết định theo authority matrix."},{"when":"Trước một gate quan trọng","question":"Đã đủ điều kiện theo luật, hợp đồng, thiết kế và O&M để tiến lên bước mới?","input":"Approved dossiers, testing/inspection certs, PSSR/MOC, critical punch list","output":"Gate review minutes + Go/No-Go recommendation","owner":"Decision owner theo phân quyền, HSE không đơn phương phê duyệt kỹ thuật."}],"legalGates":[{"name":"Xác định pháp nhân và công trình","phase":"Tiền dự án","trigger":"Tên nhà đầu tư, chủ đầu tư, pháp nhân ký hợp đồng và phạm vi mỗi gói được xác nhận.","question":"Ai là người có nghĩa vụ, công trình nào thuộc các luật/quy chuẩn khác nhau?","how":"Yêu cầu Legal + Engineering đối chiếu quyết định, sơ đồ pháp nhân, FS/FEED, drawing battery limits, danh mục gói.","proof":"Project charter, legal entity list, battery limits, register “đã kiểm/chưa xác minh”.","red":"Không áp toàn bộ pháp luật LNG cho hạng mục không thuộc phạm vi.","refs":["XD","ND207"],"assessment":{"status":"Ưu tiên ngay · chưa chốt pháp nhân và phạm vi","findings":[{"topic":"Phân loại dự án theo hình thức và quy mô","status":"Kết luận sơ bộ","conclusion":"Phương án 45.000 tỷ đồng thuộc lĩnh vực điện, vượt ngưỡng nhóm A 4.600 tỷ đồng. Áp dụng tiêu chí quy mô xây dựng, không suy ra đây là dự án đầu tư công; rà điều kiện dự án quan trọng quốc gia trước khi chốt. Việc nằm trong danh mục năng lượng trọng điểm không đồng nghĩa đã được chấp thuận đầu tư.","authority":"Cơ quan có thẩm quyền về đầu tư theo hồ sơ thực tế; Ban Quản lý KKT Nghi Sơn và các KCN chủ trì nhiệm vụ chuẩn bị/chấp thuận/lựa chọn theo kế hoạch tỉnh; chưa kết luận người ký.","when":"Giai đoạn chuẩn bị đầu tư; mục tiêu tháng 12/2026, không phải đã hoàn thành.","work":"Legal/PMO lập bản ghi phân loại nguồn vốn, căn cứ lựa chọn nhà đầu tư, phạm vi từng dự án thành phần; HSE lập register theo pháp nhân và phạm vi, báo các điều kiện chưa chứng minh.","evidence":"Quyết định chấp thuận chủ trương mới, quyết định lựa chọn/chấp thuận nhà đầu tư, hồ sơ pháp nhân, văn bản thành lập/giao nhiệm vụ BQLDA và sơ đồ phân quyền.","clauses":[{"locator":"Luật Xây dựng 135/2025/QH15 – Điều 16 khoản 1–3; Điều 17 khoản 1(d), 2(b), 3","content":"Dự án được phân loại theo hình thức đầu tư, quy mô và công năng; việc phân kỳ hoặc tách dự án do cấp có thẩm quyền quyết định.","url":"https://vanban.org/van-ban/luat-xay-dung-2025-135-2025-qh15/dieu-17"},{"locator":"Luật Đầu tư công 58/2024/QH15 (đã sửa đổi) – Điều 8; Điều 9 khoản 2 điểm b","content":"Ngành công nghiệp điện có tổng mức đầu tư từ 4.600 tỷ đồng thuộc tiêu chí nhóm A, trừ dự án quan trọng quốc gia.","url":"https://congluatviet.vn/van-ban/luat-dau-tu-cong-58-2024-qh15?at=2026-07-01"},{"locator":"Kế hoạch 408/KH-UBND – Phụ lục I, mục 5","content":"Vị trí cũ đã chấm dứt chủ trương; đang hoàn thiện phương án mới, liên danh là nhà đầu tư quan tâm, chưa phải quyết định lựa chọn.","url":"https://luatvietnam.vn/dien-luc/ke-hoach-408-kh-ubnd-thanh-hoa-2026-theo-doi-tien-do-du-an-nguon-dien-luoi-dien-451990-d2.html"}]},{"topic":"Cấp công trình và thẩm định FS","status":"Cần chốt cấu hình tổ máy và bồn","conclusion":"Nhà máy 1.500 MW không tự động là cấp đặc biệt. Nếu tổ máy ≥750 MW thì thuộc cấp đặc biệt theo tiêu chí công suất tổ máy; 450 đến dưới 750 MW là cấp I. Kho khí hóa lỏng có tổng dung tích >100.000 m³ thuộc cấp đặc biệt theo bảng; 5.000–100.000 m³ là cấp I. Phân cấp riêng cảng, đường ống, đường dây và hạng mục khác theo tiêu chí tương ứng.","authority":"Nếu dự án có công trình cấp đặc biệt và thuộc diện thẩm định FS, cơ quan chuyên môn về xây dựng thuộc bộ quản lý công trình xây dựng chuyên ngành thẩm định; xác định theo công trình chính/công trình chính cấp cao nhất (Điều 32–33 NĐ217). Nếu thuộc diện thẩm định nhưng không thuộc khoản 2 Điều 32, Ban Quản lý KKT Nghi Sơn và các KCN có thể thẩm định trong địa bàn và phạm vi được giao theo khoản 3 Điều 32, khoản 5–6 Điều 73; còn lại cơ quan chuyên môn cấp tỉnh theo khoản 5. Xác minh phân cấp hiện hành và phạm vi tách dự án.","when":"Trước phê duyệt dự án/FS, trước chốt cơ sở thiết kế và thẩm quyền PCCC.","work":"Engineering phát hành bảng phân cấp công trình có công suất từng tổ máy, dung tích tĩnh, bản vẽ ranh giới; Legal xác định tuyến thẩm định cho mỗi dự án/gói.","evidence":"FS/FEED, equipment list, công suất tổ máy, dung tích bồn, drawing battery limits, văn bản thẩm định.","clauses":[{"locator":"TT 34/2026/TT-BXD – Phụ lục I, Bảng 1.2, mục 1.2.5.1(b) và 1.2.4.6","content":"Phân cấp nhiệt điện khí theo công suất từng tổ máy; phân cấp kho chứa khí hóa lỏng theo tổng dung tích chứa, không theo lượng LNG nhập mỗi năm.","url":"https://vanban.org/van-ban/thong-tu-34-2026-tt-bxd-cap-cong-trinh-xay-dung-phuc-vu-quan-ly-hoat-dong"},{"locator":"NĐ 217/2026/NĐ-CP – Điều 32 khoản 1–3, 5; Điều 33 khoản 1, 3–5; Điều 73 khoản 5–6","content":"Thẩm định FS theo loại dự án, cấp và chuyên ngành; cấp Bộ nếu dự án có công trình cấp đặc biệt, Ban Quản lý KKT nếu thuộc địa bàn được giao và không thuộc thẩm quyền cấp Bộ. Nếu tách dự án độc lập hoặc nhiều công trình chính, áp dụng cách xác định riêng tại Điều 33.","url":"https://vanban.org/van-ban/nghi-dinh-217-2026-nd-cp-luat-xay-dung-quan-ly-hoat-dong-xay-dung/dieu-32"}]},{"topic":"Đất, biển và giao diện dự án","status":"Điều kiện chưa xác minh","conclusion":"Cảng/kho và nhà máy có thể chung hoặc tách dự án. Kiểm tra sử dụng đất/biển, lấn biển, nạo vét/nhận chìm nếu có, nước làm mát và nguồn cấp nước. Không mặc định có tất cả các thủ tục này.","authority":"Legal + Land/Marine/Environment xác định cơ quan có thẩm quyền theo địa bàn, quy mô, loại nguồn nước và phạm vi; BQL KKT phối hợp theo kế hoạch tỉnh.","when":"Trước chốt địa điểm, FS, mặt bằng, nạo vét/thi công liên quan.","work":"Lập bản đồ ranh giới đất/biển, hiện trạng rừng và dân cư, cảng luồng tàu, nguồn nước, thỏa thuận đấu nối; rà từng trigger và người ký riêng.","evidence":"Bản đồ tọa độ, chỉ tiêu sử dụng đất, quy hoạch cảng, hồ sơ đất/biển, water balance, phương án nạo vét và nhận chìm nếu phát sinh.","clauses":[{"locator":"Luật Đất đai – Điều 190 khoản 2, 3","content":"Lấn biển phải phù hợp quy hoạch, đánh giá tác động, có dự án/hạng mục; một số khu vực nhạy cảm cần cấp có thẩm quyền cao hơn theo khoản 3.","url":"https://thuvienphapluat.vn/van-ban/Bat-dong-san/Van-ban-hop-nhat-44-VBHN-VPQH-2026-Luat-Dat-dai-699655.aspx"},{"locator":"Luật Tài nguyên nước – Điều 52 khoản 1–5","content":"Khai thác tài nguyên nước cho sản xuất phải đối chiếu loại giấy phép, đăng ký hoặc ngoại lệ theo nguồn nước và quy mô.","url":"https://lawplayer.com/vn/act/vn-congbao-470647"}]}]}},{"name":"ĐTM, giấy phép môi trường, nghĩa vụ sau phê duyệt","phase":"Tiền dự án → thi công → vận hành","trigger":"Dự án/hạng mục được phân loại theo tiêu chí Luật BVMT và văn bản sửa đổi có hiệu lực.","question":"Đối tượng ĐTM/GPMT? Thời điểm? Điều kiện phát sinh hoạt động nào?","how":"Legal/Env tư vấn chuẩn bị classification memo, trigger matrix, hồ sơ, ý kiến thẩm định; HSE theo dõi điều kiện triển khai, cam kết và bằng chứng.","proof":"Classification opinion, ĐTM hồ sơ/kết quả, permit status, monitoring obligations, closure log.","red":"Tỷ lệ “xong 80%” không phải quyết định phê duyệt; tránh cam kết giờ được san lấp khi chưa đối chiếu.","refs":["MT","ND08","ND05","ND48","L146"],"assessment":{"status":"Rủi ro critical path · phân loại và thẩm quyền cần hồ sơ","findings":[{"topic":"Phân nhóm môi trường I/II và đánh giá sơ bộ ĐTM","status":"Có điều kiện","conclusion":"Điện khí không đồng nhất với nhiệt điện than tại mục 8 Phụ lục II NĐ48. Nếu dự án nhóm A có cấu phần xây dựng ngoài loại hình ô nhiễm và có yếu tố nhạy cảm, có căn cứ nhóm I (Phụ lục III STT 5). Theo STT 6(a), diện tích đất/đất có mặt nước từ 300 ha hoặc 50–dưới 300 ha kèm nhạy cảm cũng là tiêu chí nhóm I; 50–dưới 300 ha không thuộc nhóm I có thể thuộc nhóm II (Phụ lục IV STT 4). Rà các tiêu chí biển, rừng, di dân, nguồn nước khác. Chưa đủ số liệu mới để chốt I/II.","authority":"Chủ dự án chịu trách nhiệm phân loại; Legal/Environment lập ý kiến chuyên môn, trao đổi cơ quan môi trường có thẩm quyền nếu chưa rõ.","when":"Trước hồ sơ chủ trương đầu tư; nếu thuộc đối tượng Điều 29 thì đánh giá sơ bộ đồng thời với đề xuất chủ trương.","work":"Xin địa chính, phạm vi dự án, diện tích biển, kiểm tra yếu tố nhạy cảm Điều 25 khoản 4; lập bảng từng tiêu chí, dữ liệu đầu vào, kết luận và người review.","evidence":"Classification memo, bản đồ GIS, hồ sơ phân kỳ, công suất/dung tích, tài liệu hạ tầng môi trường KCN nếu có.","clauses":[{"locator":"Luật BVMT – Điều 28 khoản 3–4; Điều 29; Điều 30","content":"Phân loại theo nguy cơ môi trường; đánh giá sơ bộ và ĐTM là hai bước có điều kiện riêng.","url":"https://thuvienphapluat.vn/van-ban/Tai-nguyen-Moi-truong/Van-ban-hop-nhat-98-VBHN-VPQH-2026-Luat-Bao-ve-moi-truong-703759.aspx"},{"locator":"NĐ 48/2026/NĐ-CP – Phụ lục II mục 8, Phụ lục III STT 5, 6(a), Phụ lục IV STT 4(a)","content":"Nhóm I/II căn cứ loại hình, quy mô sử dụng đất/biển và yếu tố nhạy cảm, không chỉ số MW.","url":"https://vbpl.moj.gov.vn/bonongnghiep/Pages/vbpq-toanvan.aspx?ItemID=187432&dvid=319"}]},{"topic":"Có phải lập ĐTM không?","status":"Khả năng cao · chưa đủ dữ kiện chốt","conclusion":"NQ 66.19 đang áp dụng: hoạt động lấn biển, đất/đất có mặt nước ≥50 ha hoặc khu vực biển ≥10 ha là các trigger đáng chú ý. Với tổ hợp cảng–kho–điện, lập kế hoạch ĐTM dự phòng là hợp lý; kiểm tra đầy đủ ngoại lệ, đặc biệt dự án trong khu sản xuất kinh doanh dịch vụ tập trung đã có ĐTM/GPMT hạ tầng. KKT không tự động là trường hợp miễn.","authority":"Chủ dự án tổ chức lập, chịu trách nhiệm nội dung; đơn vị tư vấn đủ năng lực hỗ trợ. Cơ quan thẩm định xác định theo nhánh bên dưới.","when":"NQ 66.19 hiệu lực 18/05/2026–28/02/2027; sau đó đối chiếu văn bản mới hoặc quy định gốc và chuyển tiếp.","work":"Chốt ranh giới, kiểm tra điều kiện miễn, đánh giá hiện trạng biển/đất, khí thải, nước làm mát, dân cư, sự cố và tác động tích lũy; không chia nhỏ để né nghĩa vụ.","evidence":"Bản ghi trigger, hồ sơ môi trường hạ tầng nếu đề nghị miễn, TOR tư vấn, kế hoạch khảo sát, thư trao đổi cơ quan.","clauses":[{"locator":"NQ 66.19/2026/NQ-CP – Phần A Mục VI khoản 1, điểm b, c, d và các ngoại lệ","content":"Xác định đối tượng ĐTM trong thời gian NQ có hiệu lực: có lấn biển; đạt ngưỡng đất/biển; hoặc các điều kiện khác nêu tại Mục VI.","url":"https://thuvienphapluat.vn/van-ban/bo-may-hanh-chinh/nghi-quyet-66-19-2026-nq-cp-cat-giam-phan-quyen-don-gian-hoa-thu-tuc-hanh-chinh-706060.aspx"},{"locator":"Luật BVMT – Điều 31–33","content":"Chủ dự án tổ chức ĐTM; báo cáo bao gồm đánh giá tác động, giải pháp, giám sát và tham vấn theo quy định.","url":"https://thuvienphapluat.vn/van-ban/Tai-nguyen-Moi-truong/Van-ban-hop-nhat-98-VBHN-VPQH-2026-Luat-Bao-ve-moi-truong-703759.aspx"}]},{"topic":"Ai thẩm định và phê duyệt kết quả ĐTM?","status":"Thẩm quyền theo nhánh","conclusion":"Trong thời hạn NQ 66.19: nếu diện tích đất/đất có mặt nước ≥300 ha hoặc khu vực biển ≥60 ha (và không thuộc ngoại lệ tương ứng), Bộ Nông nghiệp và Môi trường thẩm định; Bộ cũng giữ các nhóm trường hợp khác tại điểm a,b,d. Nếu không thuộc Bộ/quốc phòng/công an và dự án trên địa bàn tỉnh, Chủ tịch UBND Thanh Hóa thẩm định. Hồ sơ liên tỉnh/vùng biển chưa phân định rà Điều 27b NĐ08 đã sửa. Chưa thể chốt cơ quan cho phương án mới.","authority":"Cơ quan/người có thẩm quyền thẩm định cũng là cơ quan/người có thẩm quyền phê duyệt kết quả thẩm định theo Điều 34 khoản 1; tư vấn và HSE không ký thay.","when":"NQ: tối đa 30 ngày cấp Bộ hoặc 20 ngày cấp tỉnh từ hồ sơ hợp lệ, không tính toàn bộ thời gian lập/sửa hồ sơ. ĐTM (nếu thuộc diện) phải có quyết định trước phê duyệt/quyết định đầu tư xây dựng theo Điều 34 khoản 2.","work":"Tư vấn chuẩn bị hồ sơ theo mẫu, tham vấn, trình thẩm định cùng FS nếu phù hợp, theo dõi giải trình, cập nhật thiết kế và cam kết theo quyết định. Legal cập nhật lại thẩm quyền sau 28/02/2027.","evidence":"Diện tích đất/biển, bảng áp điểm a–d, giấy tiếp nhận, báo cáo ĐTM, biên bản tham vấn, quyết định phê duyệt kết quả thẩm định, commitment register.","clauses":[{"locator":"NQ 66.19/2026/NQ-CP – Phần B Mục I khoản 1–2, 4–5; hiệu lực đến 28/02/2027","content":"Phân quyền thẩm định và thời hạn 30/20 ngày; Bộ giữ các trường hợp nêu tại khoản 1, còn lại cấp tỉnh theo khoản 2.","url":"https://xaydungchinhsach.chinhphu.vn/phan-quyen-tham-dinh-bao-cao-danh-gia-tac-dong-moi-truong-119260520165823805.htm"},{"locator":"Luật BVMT – Điều 34 khoản 1–2; Điều 35; Điều 37","content":"Thẩm định và phê duyệt kết quả; đồng thời FS có điều kiện; thực hiện nghĩa vụ và rà thay đổi sau phê duyệt.","url":"https://thuvienphapluat.vn/van-ban/Tai-nguyen-Moi-truong/Van-ban-hop-nhat-98-VBHN-VPQH-2026-Luat-Bao-ve-moi-truong-703759.aspx"},{"locator":"Hồ sơ thủ tục ĐTM – Điều 4 TT09/2026/TT-BNNMT, mẫu theo TT22/2026/TT-BNNMT","content":"Cổng dịch vụ công công bố văn bản đề nghị, báo cáo ĐTM và thành phần hồ sơ; kiểm đúng thủ tục theo cơ quan nhận.","url":"https://vpcp.dichvucong.gov.vn/p/home/dvc-tthc-thu-tuc-hanh-chinh-chi-tiet.html?ma_thu_tuc=295834"}]},{"topic":"Giấy phép môi trường (GPMT) và vận hành thử","status":"Khả năng thuộc diện · xác nhận nguồn thải","conclusion":"Dự án nhóm I/II/III phát sinh nước thải hoặc bụi, khí thải xả ra môi trường phải xử lý khi vận hành chính thức, hoặc trường hợp khác ở Điều 39, thuộc diện GPMT nếu không có ngoại lệ. Với điện khí, xác minh nước thải, khí thải tổ máy, nước làm mát và các công trình xử lý; chưa có hồ sơ dự án để xác nhận.","authority":"Theo NQ 66.19 Phần B Mục II đang có hiệu lực, Chủ tịch UBND tỉnh cấp GPMT cho đối tượng không thuộc các trường hợp Bộ giữ lại (nhập phế liệu, dịch vụ xử lý CTNH liên tỉnh, quốc phòng/an ninh). Dự kiến cấp tỉnh nếu hồ sơ thuộc diện và không có ngoại lệ; phải xác minh lại thời điểm nộp thực tế.","when":"Nếu phải ĐTM và phải GPMT: có GPMT trước vận hành thử công trình xử lý chất thải theo Điều 42 khoản 2(a); không đồng nhất với mốc khởi công. Rà Điều 46 cho vận hành thử.","work":"HSE/Environment lập water balance, emission inventory, discharge points, giới hạn, monitoring plan; làm hồ sơ theo phạm vi thiết kế cuối; đối chiếu GPMT với commissioning schedule.","evidence":"Báo cáo đề xuất GPMT, ĐTM (nếu có), thiết kế xử lý, kết quả thẩm định/cấp phép, test plan và kết quả quan trắc.","clauses":[{"locator":"Luật BVMT – Điều 39 khoản 1,3; Điều 42 khoản 2(a); Điều 46 khoản 2–3","content":"Đối tượng, mốc cấp phép trước thử nghiệm công trình xử lý và trách nhiệm tuân thủ trong vận hành thử.","url":"https://thuvienphapluat.vn/van-ban/Tai-nguyen-Moi-truong/Van-ban-hop-nhat-98-VBHN-VPQH-2026-Luat-Bao-ve-moi-truong-703759.aspx"},{"locator":"NQ 66.19/2026/NQ-CP – Phần B Mục II khoản 1–2 và chuyển tiếp","content":"Phân quyền cấp GPMT về cấp tỉnh, Bộ giữ một số trường hợp; hiệu lực đến 28/02/2027.","url":"https://xaydungchinhsach.chinhphu.vn/phan-quyen-cap-giay-phep-moi-truong-119260521093254292.htm"}]}]}},{"name":"PCCC & CNCH trong từng bước thiết kế","phase":"Thiết kế → thi công → nghiệm thu","trigger":"Phụ thuộc công năng, loại công trình, phạm vi, giai đoạn thiết kế, thay đổi và văn bản PCCC hiện hành.","question":"Ai thẩm định nội dung nào; hồ sơ nào phải có trước bước nào?","how":"Engineering lập matrix kỹ thuật/thiết kế; Legal kiểm điều khoản và cơ quan; HSE theo dõi checklist high-hazard và outstanding issues.","proof":"PCCC design basis, review log, kết quả thủ tục theo thẩm quyền, nghiệm thu/điều kiện tương ứng.","red":"Không mặc định mọi công trình đều do Công an thẩm duyệt hoặc HSE Manager tự chấp thuận thiết kế.","refs":["PCCC","PCCCVBHN26","ND105","XD"],"assessment":{"status":"Thuộc danh mục PCCC · cần chốt cấp công trình và tuyến thẩm định","findings":[{"topic":"Đối tượng và nội dung thiết kế PCCC","status":"Xác định được theo loại công trình","conclusion":"Nhà máy điện và kho chứa khí hóa lỏng thuộc danh mục thẩm định thiết kế PCCC (không cần dùng số MW để chứng minh đối tượng). Trạm biến áp từ 110 kV và bến cảng biển từ cấp III trở lên cũng có trong danh mục; xác định phạm vi và cấp cảng theo hồ sơ.","authority":"Chủ đầu tư tổ chức thiết kế/thẩm định phần thuộc trách nhiệm mình; cơ quan chuyên môn xây dựng và Công an thẩm định theo nội dung được phân công.","when":"FS/FEED và thiết kế triển khai sau khi dự án được phê duyệt, trước thi công hạng mục thuộc diện.","work":"Engineering/Fire Safety lập PCCC design basis; bảng a–đ (khoảng cách, giao thông tiếp cận, thoát nạn, chịu lửa/ngăn cháy, chống khói) và e–g (điện phục vụ PCCC, phương tiện/hệ thống PCCC); rà điều khoản gốc trước chốt thiết kế.","evidence":"PCCC applicability matrix, site plan, phân khu cháy nổ, fire & gas philosophy, firewater design, bản vẽ và thuyết minh.","clauses":[{"locator":"NĐ 347/2026/NĐ-CP – Phụ lục III mục 9(a), 9(b) và 13","content":"Kho khí hóa lỏng, nhà máy chế biến khí, nhà máy điện, trạm biến áp từ 110 kV và bến cảng biển từ cấp III trở lên nằm trong danh mục thẩm định thiết kế PCCC.","url":"https://thuvienphapluat.vn/chinh-sach-phap-luat-moi/vn/ho-tro-phap-luat/chinh-sach-moi/120733/danh-muc-cong-trinh-thuoc-dien-tham-dinh-thiet-ve-pccc-theo-nghi-dinh-347-2026-nd-cp-ra-sao"},{"locator":"Luật PCCC & CNCH 55/2024/QH15 (bản đã sửa) – Điều 16 khoản 1, Điều 17 khoản 1","content":"Yêu cầu thiết kế theo công năng và phân công cơ quan thẩm định theo từng nhóm nội dung.","url":"https://qlda.gxd.vn/van-ban/pccc/vbhn-58-2026-vpqh"}]},{"topic":"Ai thẩm định thiết kế và khi nào?","status":"Thẩm quyền cụ thể có điều kiện","conclusion":"Bước FS: cơ quan chuyên môn xây dựng thẩm định nhóm nội dung Điều 16 khoản 1(a–đ) khi thẩm định FS thuộc diện; nếu FS không thuộc diện thẩm định tại cơ quan chuyên môn nhưng thuộc diện PCCC, người quyết định đầu tư tổ chức thẩm định theo điểm a khoản 1 Điều 17. Bước thiết kế triển khai sau phê duyệt: điểm đ khoản 1 Điều 17 giao chủ đầu tư thẩm định phần a–đ nếu thiết kế không thuộc diện cơ quan chuyên môn xây dựng thẩm định nhưng thuộc diện Công an thẩm định; thẩm định phần e, g nếu không thuộc diện Công an thẩm định. Cơ quan Công an thẩm định phần e, g đối với đối tượng thuộc danh mục theo điểm d. Nếu có công trình cấp đặc biệt, dự kiến Cục Cảnh sát PCCC & CNCH; nếu không thuộc tiêu chí khoản 1 Điều 9 TT36 sửa đổi bởi TT62, Phòng Cảnh sát PCCC & CNCH Công an tỉnh Thanh Hóa. Kiểm tra thêm tiêu chí công trình quy mô lớn, kỹ thuật phức tạp hoặc cấp I có đề nghị; không chọn Cục chỉ vì 1.500 MW.","authority":"Cơ quan chuyên môn xây dựng theo NĐ217 Điều 32–33; Công an theo Điều 9 TT36 đã được Điều 8 TT62/2026 sửa đổi; chủ đầu tư chịu trách nhiệm thiết kế, phê duyệt theo phân quyền.","when":"Trước khởi công hạng mục phải thẩm định; thiết kế thay đổi ảnh hưởng yêu cầu PCCC thì rà thẩm định điều chỉnh trước tiếp tục thi công.","work":"Lập authority matrix theo từng hạng mục; chốt cấp tổ máy/kho, soát hồ sơ, lấy ý kiến và văn bản thẩm định; nối từng ý kiến với thiết kế đã phê duyệt.","evidence":"FS và kết quả thẩm định, bộ hồ sơ thiết kế sau phê duyệt, văn bản thẩm định Công an, hồ sơ đóng ý kiến và thay đổi.","clauses":[{"locator":"Luật PCCC – Điều 17 khoản 1 điểm a,b,d,đ; khoản 2–3 (đã sửa bởi Luật 135/2025/QH15)","content":"Phân định thẩm định FS thuộc/không thuộc cơ quan chuyên môn xây dựng; Công an thẩm định phần e,g nếu thuộc diện; chủ đầu tư thẩm định theo điều kiện cụ thể tại điểm đ. Điều chỉnh thiết kế nếu thay đổi yêu cầu PCCC; phải có văn bản thẩm định của cơ quan quản lý chuyên ngành trước thi công thuộc diện.","url":"https://vanban.org/van-ban/luat-phong-chay-chua-chay-va-cuu-nan-cuu-ho-2024-55-2024-qh15/dieu-17"},{"locator":"NĐ 217/2026/NĐ-CP – Điều 74; NĐ105 Điều 6 khoản 1, đã sửa tiếp bởi NĐ347","content":"Lồng ghép thẩm định thiết kế PCCC của cơ quan chuyên môn xây dựng trong thẩm định FS.","url":"https://m.thuvienphapluat.vn/van-ban/xay-dung-do-thi/Nghi-dinh-217-2026-ND-CP-huong-dan-Luat-Xay-dung-quan-ly-hoat-dong-xay-dung-696494.aspx"},{"locator":"TT 62/2026/TT-BCA – Điều 8 sửa Điều 9 TT36/2025/TT-BCA","content":"Cục thẩm định công trình thuộc dự án có công trình cấp đặc biệt và trường hợp liệt kê tại khoản 1; cấp tỉnh thực hiện phần thuộc thẩm quyền còn lại.","url":"https://thuvienphapluat.vn/van-ban/Bo-may-hanh-chinh/Thong-tu-62-2026-TT-BCA-quy-dinh-phan-cap-cat-giam-don-gian-hoa-thu-tuc-hanh-chinh-706184.aspx?tab=7"}]},{"topic":"Nghiệm thu PCCC trước vận hành","status":"Quy định mới từ 15/09/2026","conclusion":"Không áp nguyên quy trình xin văn bản chấp thuận kết quả nghiệm thu PCCC của Công an như trước. NĐ347 bãi bỏ Điều 10 NĐ105 và sửa Điều 12 khoản 1 điểm đ: chủ đầu tư tổ chức nghiệm thu, chịu trách nhiệm, khai báo trên hệ thống dữ liệu PCCC/CNCH và truyền tin báo cháy trước hoạt động. Vẫn phải thực hiện nghiệm thu công trình và kiểm tra nghiệm thu xây dựng nếu thuộc diện.","authority":"Chủ đầu tư/chủ sở hữu tổ chức nghiệm thu theo hồ sơ; Engineering và nhà thầu chứng minh kết quả; cơ quan xây dựng kiểm tra nghiệm thu xây dựng riêng nếu thuộc diện.","when":"Trước đưa hạng mục/công trình vào hoạt động; kiểm lại quy định hiện hành khi commissioning năm 2030.","work":"Lập test plan, kiểm định/test, biên bản nghiệm thu hệ thống, kiểm soát punch list, chuẩn bị khai báo dữ liệu, chứng minh điều kiện PCCC và xây dựng.","evidence":"Biên bản nghiệm thu PCCC, test records, hồ sơ hoàn công, bằng chứng khai báo/truyền tin, kết quả kiểm tra nghiệm thu xây dựng nếu thuộc diện.","clauses":[{"locator":"NĐ 105/2025/NĐ-CP – Điều 12 khoản 1 điểm đ (sửa bởi NĐ 347/2026/NĐ-CP); Điều 10 bị bãi bỏ","content":"Chủ đầu tư nghiệm thu, chịu trách nhiệm và khai báo trước hoạt động; bỏ thủ tục kiểm tra nghiệm thu PCCC theo Điều 10 cũ.","url":"https://hocvienpccc.bocongan.gov.vn/blog/quy-dinh-moi-ve-tham-dinh-thiet-ke-nghiem-thu-ve-pccc-theo-nghi-dinh-so-347-2026-nd-cp_7648"},{"locator":"NĐ 207/2026/NĐ-CP – Điều 25–27","content":"Kiểm tra công tác nghiệm thu xây dựng là thủ tục khác, xác định theo loại/cấp công trình.","url":"https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Nghi-dinh-207-2026-ND-CP-huong-dan-Luat-Xay-dung-quan-ly-chat-luong-thi-cong-xay-dung-701883.aspx?tab=1"}]}]}},{"name":"Thi công và công tác chủ đầu tư","phase":"Hợp đồng → thi công","trigger":"Khi hoạt động xây dựng, thi công thực tế được triển khai theo hợp đồng/gói thầu.","question":"Nhiệm vụ owner-side trong an toàn thi công và quyền can thiệp là gì?","how":"Đối chiếu khoản 20 Điều 16 NĐ 207/2026; hệ thống giám sát, phối hợp liên nhà thầu, stop-work/escalation procedure.","proof":"HSE Plan/approval route, observation/stop record, EPC CAPA, SIMOPS plan, project director brief.","red":"Không để EPC tự kiểm tra thay toàn bộ trách nhiệm của chủ đầu tư.","refs":["ND207","Q18","XD"],"assessment":{"status":"Mục tiêu khởi công QII/2027 · chưa chứng minh đủ điều kiện","findings":[{"topic":"Điều kiện khởi công và giấy phép xây dựng","status":"Phải kiểm chứng theo từng hạng mục","conclusion":"Không đồng nhất chấp thuận chủ trương với quyền san lấp/khởi công. Công trình thuộc diện thẩm định tại cơ quan chuyên môn xây dựng có thể được miễn giấy phép theo Điều 43; rà đầy đủ điều kiện miễn, thông báo và hồ sơ riêng. Không mặc định mọi gói đều được miễn.","authority":"Chủ đầu tư chịu trách nhiệm điều kiện khởi công; Legal/Construction xác định cơ quan quản lý xây dựng và giấy phép theo từng hạng mục; HSE rà điều kiện an toàn và môi trường.","when":"Trước bàn giao mặt bằng và khởi công từng phần; mục tiêu QII/2027 phụ thuộc hồ sơ thật.","work":"Tổ chức pre-mobilization gate: đất/mặt bằng, thiết kế đã phê duyệt, hợp đồng, thông báo khởi công, hồ sơ môi trường, PCCC nếu thuộc diện, kiểm soát rủi ro thi công; không cho tiến độ thay bằng chứng.","evidence":"Legal/Permit Register, giấy phép hoặc căn cứ miễn, bản vẽ đã duyệt, hợp đồng, thông báo khởi công, biên bản bàn giao và điều kiện ĐTM/PCCC.","clauses":[{"locator":"Luật Xây dựng 135/2025/QH15 – Điều 43 và Điều 48 khoản 1 điểm a–đ","content":"Điều kiện khởi công gồm mặt bằng, giấy phép khi thuộc diện, thiết kế được duyệt, hợp đồng và thông báo khởi công.","url":"https://lawplayer.com/vn/act/vn-vbpl-185659"},{"locator":"NĐ 207/2026/NĐ-CP – Điều 12 khoản 1; Luật Xây dựng Điều 43","content":"Đối chiếu điều kiện khởi công theo luật, căn cứ miễn cấp phép phải kiểm theo từng công trình.","url":"https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Nghi-dinh-207-2026-ND-CP-huong-dan-Luat-Xay-dung-quan-ly-chat-luong-thi-cong-xay-dung-701883.aspx?tab=1"},{"locator":"Luật PCCC – Điều 17 khoản 3","content":"Công trình/hạng mục thuộc diện thẩm định phải có văn bản thẩm định PCCC của cơ quan quản lý chuyên ngành trước thi công.","url":"https://vanban.org/van-ban/luat-phong-chay-chua-chay-va-cuu-nan-cuu-ho-2024-55-2024-qh15/dieu-17"}]},{"topic":"Trách nhiệm HSE chủ đầu tư trong thi công","status":"Áp dụng khi thi công","conclusion":"Quản lý an toàn owner-side không thay công việc của EPC. Chủ đầu tư bố trí hệ thống giám sát, điều phối giao diện, can thiệp khi phát hiện dấu hiệu vi phạm; EPC tổ chức thực hiện an toàn công việc.","authority":"Người quản lý an toàn của chủ đầu tư được giao nhiệm vụ; EPC chịu trách nhiệm biện pháp và tổ chức thi công; Project Director phê duyệt phân quyền và cơ chế escalation.","when":"Trước huy động nhà thầu và xuyên suốt thi công.","work":"RACI/authority matrix; kế hoạch assurance theo rủi ro, critical controls, SIMOPS, PTW, NCR/CAPA, escalation; chỉ cho mở lại theo quy trình và đúng người có thẩm quyền.","evidence":"Quyết định giao nhiệm vụ, contractor HSE plan, hồ sơ giám sát, biên bản dừng việc, CAPA và chứng cứ đóng.","clauses":[{"locator":"NĐ 207/2026/NĐ-CP – Điều 16 khoản 2,3,20(a,b,c)","content":"Giám sát việc tuân thủ của nhà thầu; phối hợp giữa nhà thầu và xử lý vấn đề; tạm dừng hoặc đình chỉ nếu phát hiện dấu hiệu vi phạm an toàn.","url":"https://vanban.org/van-ban/nghi-dinh-207-2026-nd-cp-luat-xay-dung-quan-ly-chat-luong-thi-cong-xay-dung/dieu-16"},{"locator":"NĐ 207/2026/NĐ-CP – Điều 15 và Điều 20 khoản 1","content":"Trách nhiệm nhà thầu thi công và nội dung giám sát xây dựng cần được kiểm theo từng hợp đồng.","url":"https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Nghi-dinh-207-2026-ND-CP-huong-dan-Luat-Xay-dung-quan-ly-chat-luong-thi-cong-xay-dung-701883.aspx?tab=1"}]}]}},{"name":"Kho LNG trên bờ & design safety","phase":"FEED → thiết kế → chạy thử","trigger":"Có kho chứa LNG trên bờ trong phạm vi và dự án thuộc đối tượng áp dụng QCVN 19:2022/BCT.","question":"Các yêu cầu phân vùng, khoảng cách, thiết bị an toàn, thiết kế và vận hành phù hợp?","how":"Owner HSE quản lý requirement traceability, mời chuyên gia process/loss prevention kiểm tra compliance basis, HAZOP/QRA actions.","proof":"Design basis, compliance matrix, hazard-study action closure, technical sign-off.","red":"QCVN 19 không tự biến thành giấy phép cho cảng hoặc toàn nhà máy điện.","refs":["Q19","TC8611","TC8612","TC8613","IFCLNG"],"assessment":{"status":"Khả năng áp dụng cao · xác nhận kho LNG trên bờ và sức chứa","findings":[{"topic":"Kho LNG: xác định phạm vi QCVN","status":"Có điều kiện theo thiết kế","conclusion":"Phương án đề xuất có kho/cảng LNG, nhưng 3–3,6 triệu tấn/năm là năng lực tiếp nhận, không phải sức chứa tĩnh. QCVN19 áp dụng kho LNG cố định trên bờ sức chứa trên 200 tấn trong phạm vi quy chuẩn. Cảng/đường ống/nhà máy điện cần riêng compliance basis.","authority":"Chủ đầu tư kho, thiết kế/Technical Authority và EPC thực hiện; cơ quan có thẩm quyền xác định theo hồ sơ chuyên ngành. HSE điều phối, không phê duyệt thay chuyên gia.","when":"Ngay FEED/FS, khóa design basis trước đặt thiết bị/award EPC.","work":"Xác minh sức chứa, battery limits, plot plan, tiêu chuẩn thiết kế và version. Review địa kỹ thuật, khí tượng, tác động cộng đồng, phân khu, khoảng cách, ngăn lan, ứng cứu, interface cảng–kho–nhà máy.","evidence":"Tank data sheet, PFD/P&ID, plot plan, hazard assessment, design compliance matrix, action closure.","clauses":[{"locator":"QCVN 19:2022/BCT – Phần I mục 1–2; Phần II mục 2.1–2.3","content":"Giới hạn phạm vi quy chuẩn và yêu cầu khảo sát, đánh giá nguy cơ, bố trí an toàn kho LNG.","url":"https://vanban.chinhphu.vn/?docid=207203&pageid=27160"},{"locator":"QCVN 19:2022/BCT – Phần II mục 12.1","content":"Chương trình kiểm soát chất lượng phải bao phủ từ thiết kế, chế tạo, thi công, lắp đặt đến chạy thử và nghiệm thu.","url":"https://thuvienphapluat.vn/TCVN/Tai-nguyen-Moi-truong/QCVN-19-2022-BCT-An-toan-kho-chua-khi-thien-nhien-hoa-long-LNG-tren-bo-919882.aspx"}]}]}},{"name":"Hợp đồng EPC, capability và bridging","phase":"Đấu thầu → EPC mobilization","trigger":"Lập HSMT/HSDT hoặc ký hợp đồng nhà thầu tư vấn/thi công.","question":"Các HSE deliverables, review authority, hold points và KPI có ràng buộc hợp đồng không?","how":"HSE tham gia xây HSE schedule/contract annex, scoring rubrics, interface matrix và cơ chế audit.","proof":"Employer HSE Requirements, capability scorecard, contractor HSE Plan, bridging document.","red":"Không bổ sung “nghĩa vụ” sau award mà thiếu cơ sở hợp đồng/luật.","refs":["IOGP","ND210","ND207"],"assessment":{"status":"Chuẩn bị trước HSMT và hợp đồng EPC","findings":[{"topic":"Ràng buộc HSE trong EPC","status":"Cần chuẩn bị ngay · mô hình EPC chưa chốt","conclusion":"Nhà máy, kho/cảng, đường ống, đấu nối có thể chia nhiều gói; phân định trách nhiệm và giao diện trước award. NĐ210 yêu cầu quản lý an toàn, môi trường, cháy nổ theo hợp đồng; IOGP 423 là thông lệ tham khảo, không phải luật bắt buộc.","authority":"Chủ đầu tư/Procurement/Legal tổ chức yêu cầu hợp đồng, người có thẩm quyền ký; EPC chịu trách nhiệm trong phạm vi được giao; HSE xây yêu cầu và tham gia đánh giá.","when":"Trước phát hành HSMT/ký hợp đồng; kiểm trước huy động EPC.","work":"Soạn Employer HSE Requirements, ma trận nghĩa vụ pháp lý chuyển vào EPC, KPI và deliverable, hold points, audit, capability, quyền dừng việc, cơ chế thay đổi; đánh giá năng lực và bridging trước huy động.","evidence":"HSE contract annex, evaluation matrix, approved design basis, schedule, authority matrix, mobilization readiness.","clauses":[{"locator":"NĐ 210/2026/NĐ-CP – Điều 4 khoản 1(b,c), khoản 2(d), khoản 5(a,b)","content":"Đồng bộ phạm vi nhiều nhà thầu; quản lý ATLĐ, môi trường và cháy nổ; bên giao thầu kiểm soát các mốc EPC, bên nhận thầu chịu trách nhiệm về thiết kế/thiết bị/công nghệ.","url":"https://vanban.org/van-ban/nghi-dinh-210-2026-nd-cp-luat-xay-dung-hop-dong-xay-dung/dieu-4"},{"locator":"NĐ 207/2026/NĐ-CP – Điều 16 khoản 3,20","content":"Thiết lập hệ thống quản lý và giám sát an toàn phía chủ đầu tư; không chuyển hết trách nhiệm cho EPC.","url":"https://vanban.org/van-ban/nghi-dinh-207-2026-nd-cp-luat-xay-dung-quan-ly-chat-luong-thi-cong-xay-dung/dieu-16"}]}]}},{"name":"PSSR / nạp khí lần đầu","phase":"Commissioning","trigger":"Khi dự án có system completion và chuẩn bị đưa năng lượng/hóa chất nguy hiểm vào hệ thống.","question":"Các hệ thống an toàn trọng yếu, đào tạo, SOP, commissioning permits, barrier tests có đạt chưa?","how":"HSE tham gia PSSR stage-gate, bảo đảm action closure và báo risk exceptions; technical owner/operator quyết định.","proof":"PSSR dossier, test certificates, safety-critical punch list, authorization.","red":"Không tự ký quyết định first gas nếu chưa được giao thẩm quyền và thiếu đánh giá kỹ thuật.","refs":["IFCLNG","Q19","IOGP"],"assessment":{"status":"Mốc commissioning/first gas và bàn giao · không tự cấp phép","findings":[{"topic":"PSSR, chạy thử kho LNG và nạp khí lần đầu","status":"Cần xác định theo hệ thống và phạm vi","conclusion":"QCVN19 yêu cầu kiểm tra an toàn trước chạy thử/nghiệm thu kho và có kế hoạch thử theo tiêu chuẩn. PSSR là phương pháp quản trị sẵn sàng hữu ích, không mặc định tên thủ tục pháp lý. First gas không đồng nghĩa đã đủ điều kiện vận hành thương mại.","authority":"Technical Authority, Commissioning Manager, Operations và người có thẩm quyền theo phân quyền chịu quyết định kỹ thuật; HSE kiểm chứng readiness và báo Project Director.","when":"Trước đưa LNG/năng lượng nguy hiểm vào từng hệ thống, sau khi hoàn thành điều kiện pháp lý và kỹ thuật phù hợp.","work":"Thiết lập system boundaries, PSSR checklist, kiểm barrier, test chứng minh, MOC, critical punch list, SOP/đào tạo/ứng cứu; xác minh GPMT trước vận hành thử xử lý chất thải nếu thuộc diện, nghiệm thu PCCC theo quy định hiện hành.","evidence":"PSSR dossier, test records, technical sign-off, emergency drill, permit matrix, giấy phép và điều kiện mở gate.","clauses":[{"locator":"QCVN 19:2022/BCT – Phần II mục 12.2–12.3, 13.1","content":"Kiểm tra hồ sơ, điều kiện hiện trường và sẵn sàng an toàn trước chạy thử; thử nghiệm theo tiêu chuẩn thiết kế, vận hành theo quy trình và đào tạo.","url":"https://thuvienphapluat.vn/TCVN/Tai-nguyen-Moi-truong/QCVN-19-2022-BCT-An-toan-kho-chua-khi-thien-nhien-hoa-long-LNG-tren-bo-919882.aspx"},{"locator":"Luật BVMT – Điều 42 khoản 2(a), Điều 46 khoản 2–3","content":"Nếu thuộc diện, phải có GPMT trước thử nghiệm công trình xử lý chất thải và tuân thủ điều kiện giấy phép.","url":"https://thuvienphapluat.vn/van-ban/Tai-nguyen-Moi-truong/Van-ban-hop-nhat-98-VBHN-VPQH-2026-Luat-Bao-ve-moi-truong-703759.aspx"},{"locator":"NĐ105 Điều 12 khoản 1 điểm đ, sửa bởi NĐ347/2026","content":"Nghiệm thu PCCC và khai báo theo quy định trước hoạt động; rà luật áp dụng ở thời điểm thực hiện.","url":"https://hocvienpccc.bocongan.gov.vn/blog/quy-dinh-moi-ve-tham-dinh-thiet-ke-nghiem-thu-ve-pccc-theo-nghi-dinh-so-347-2026-nd-cp_7648"}]},{"topic":"Nghiệm thu xây dựng và bàn giao O&M","status":"Điều kiện theo cấp và đối tượng","conclusion":"Công trình phải kiểm tra nghiệm thu nhà nước nếu thuộc diện Điều 25 NĐ207. Nếu cấp đặc biệt, thường là cơ quan chuyên môn bộ quản lý chuyên ngành; cảng hàng hải và các ngoại lệ Điều 26 phải tách riêng. Không đồng nhất nghiệm thu PCCC với kiểm tra nghiệm thu xây dựng hoặc giấy phép vận hành điện lực.","authority":"Chủ đầu tư tổ chức nghiệm thu và bàn giao; cơ quan kiểm tra theo Điều 26 nếu thuộc diện; operator tiếp nhận và thực hiện trách nhiệm chuyên ngành.","when":"Trước đưa công trình vào khai thác, theo từng hạng mục và phân kỳ.","work":"Kiểm tra hoàn công, hồ sơ thử nghiệm, thiết bị kiểm định, HSE handover dossier, CAPA, giấy phép chuyên ngành còn thiếu; Legal rà thêm giấy phép hoạt động điện lực, điều kiện cảng, hóa chất và bảo hiểm theo phạm vi thực tế.","evidence":"Báo cáo hoàn thành, biên bản nghiệm thu, văn bản kiểm tra/chấp thuận nếu thuộc diện, hồ sơ O&M, permit register và trách nhiệm vận hành.","clauses":[{"locator":"NĐ 207/2026/NĐ-CP – Điều 25–27 (Điều 26 khoản 1,2)","content":"Đối tượng, phân cấp thẩm quyền và trình tự kiểm tra công tác nghiệm thu; cơ quan cấp Bộ kiểm công trình cấp đặc biệt thuộc chuyên ngành, có ngoại lệ.","url":"https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Nghi-dinh-207-2026-ND-CP-huong-dan-Luat-Xay-dung-quan-ly-chat-luong-thi-cong-xay-dung-701883.aspx?tab=1"}]}]}}],"trungNamPractice":[{"name":"LNG Cà Ná – phát triển trước EPC","type":"Thông tin công khai","date":"28/01 và 10/04/2026","fact":"Liên danh Trung Nam – Sideros River được lựa chọn làm nhà đầu tư và tiếp đó ký hợp đồng đầu tư kinh doanh với địa phương cho LNG Cà Ná.","link":"https://cms.baochinhphu.vn/lien-danh-trung-nam-sideros-river-trung-thau-du-an-nha-may-nhiet-dien-lng-ca-na-10226012815085901.htm","impact":"HSE owner nên kiểm tra sớm pháp nhân, legal milestones, scope và TOR tư vấn trước khi lập yêu cầu EPC."},{"name":"LNG Cà Ná – hợp đồng thiết bị công nghệ","type":"Thông tin công khai","date":"20/11/2026","fact":"Trung Nam công bố ký hợp đồng tuabin khí GT36 với Ansaldo Energia và MOU với Shanghai Electric.","link":"https://trungnamgroup.com.vn/en-US/news-1/communication/trungnam-signs-gt36-gas-turbine-supply-contract-with-ansaldo-energia-and-mou-with-shanghai-electric-for-ca-na-lng-project","impact":"HSE owner phải đưa vendor safety data, FEED interfaces, design comments, FAT/SAT và tài liệu an toàn vào hợp đồng/điểm kiểm chứng."},{"name":"Trung Nam Thuận Nam – tách chủ đầu tư và tổng thầu","type":"Thông tin công khai","date":"Dự án trước đây","fact":"Hồ sơ năng lực dự án điện mặt trời Thuận Nam nêu pháp nhân chủ đầu tư và Trungnam E&C ở vai trò nhà thầu mua sắm/thi công.","link":"https://trungnamec.com.vn/wp-content/uploads/2026/04/FULL-VN_T3-2.pdf","impact":"Cùng hệ sinh thái không làm mất yêu cầu hợp đồng, phân quyền và kiểm tra độc lập của HSE BQLDA."},{"name":"LNG Nghi Sơn – tình trạng nhà đầu tư","type":"Chưa có xác nhận trao dự án","date":"Đối chiếu kế hoạch 10/2026","fact":"Các thông tin công khai tháng 10/2026 ghi nhận liên danh Xuân Cầu Holdings – Trung Nam quan tâm, mốc lựa chọn nhà đầu tư dự kiến tháng 12/2026; chưa có quyết định trao dự án xác minh ở đây.","link":"https://luatvietnam.vn/dien-luc/ke-hoach-408-kh-ubnd-thanh-hoa-2026-theo-doi-tien-do-du-an-nguon-dien-luoi-dien-451990-d2.html","impact":"Xác minh giai đoạn thực tế, pháp nhân chủ đầu tư, phạm vi dự án, cơ cấu quản lý và thẩm quyền HSE từ hồ sơ chính thức trước khi xác lập kế hoạch."}],"projectLegal":{"asOf":"25/11/2026","title":"LNG Nghi Sơn · đánh giá theo phương án vị trí mới","snapshot":["Kế hoạch 408/KH-UBND năm 2026, Phụ lục I, mục 5: 1.500 MW, 45.000 tỷ đồng dự kiến; liên danh Xuân Cầu Holdings – Trung Nam được ghi là nhà đầu tư quan tâm. Chủ trương đầu tư tại vị trí cũ đã chấm dứt.","Phương án Trung Nam trình bày tại KKT Nghi Sơn: núi Chuột Chù, tổ hợp điện khí, kho và cảng LNG, hạ tầng phụ trợ; năng lực tiếp nhận đề xuất 3–3,6 triệu tấn LNG/năm. Không phải dung tích bồn chứa.","Mốc mục tiêu theo kế hoạch tỉnh: chấp thuận chủ trương/lựa chọn nhà đầu tư tháng 12/2026; khởi công quý II/2027; vận hành dự kiến tháng 12/2030. Mở rộng lên 4.500 MW là kiến nghị, chưa coi là phạm vi đã phê duyệt.","Chưa xác minh được quyết định đầu tư tại vị trí mới, tọa độ/diện tích đất và biển, công suất từng tổ máy, dung tích bồn, ranh giới dự án cảng/kho/đường ống, pháp nhân được giao và hồ sơ ĐTM/PCCC/GPMT. Không chuyển số liệu địa điểm cũ sang phương án mới."],"links":[{"label":"Kế hoạch 408/KH-UBND – Phụ lục I, mục 5","url":"https://luatvietnam.vn/dien-luc/ke-hoach-408-kh-ubnd-thanh-hoa-2026-theo-doi-tien-do-du-an-nguon-dien-luoi-dien-451990-d2.html"},{"label":"Cục Đầu tư nước ngoài – phương án Trung Nam tại núi Chuột Chù","url":"https://via.gov.vn//tin-tuc/t13612/thanh-hoa-xem-xet-cac-phuong-an-bo-tri-nha-may-dien-khi-lng-nghi-son"}],"warning":"Đánh giá nghiên cứu từ nguồn công khai, không phải xác nhận pháp lý hoặc trạng thái permit của dự án. Các mốc 2027 phải rà lại văn bản vào ngày nộp hồ sơ; NQ 66.19 có thời hạn đến hết 28/02/2027."}},"legalClauses":[{"id":"ND5_1","sourceId":"ND207","code":"NĐ 207/2026/NĐ-CP","clause":"Điều 5 khoản 1 điểm a, b","summary":"Chủ đầu tư giao BQLDA thực hiện nhiệm vụ bằng văn bản; chủ đầu tư chỉ đạo, kiểm tra và chịu trách nhiệm; BQLDA chịu trách nhiệm phần được giao.","application":"Yêu cầu quyết định thành lập/giao nhiệm vụ, sơ đồ tổ chức và ma trận thẩm quyền trước khi nhận trách nhiệm.","scope":"Chỉ khi chủ đầu tư thành lập BQLDA trực thuộc","status":"verified","url":"https://xaydungchinhsach.chinhphu.vn/nghi-dinh-so-207-2026-nd-cp-ve-quan-ly-chat-iuong-thi-cong-bao-tri-cong-trinh-xay-dung-119260616081951719.htm","proof":"Quyết định thành lập BQLDA, văn bản phân quyền, sơ đồ tổ chức","verifiedAt":"2026-11-23"},{"id":"ND5_2","sourceId":"ND207","code":"NĐ 207/2026/NĐ-CP","clause":"Điều 5 khoản 2 điểm a, b và khoản 7","summary":"Khi lause":"Điều 16 khoản 2–3","summary":"Chủ đầu tư tổ chức giám sát, thiết lập hệ thống quản lý thi công, thông báo nhiệm vụ quyền hạn và bố trí nhân lực giám sát/an toàn phù hợp.","application":"Xây tổ chức HSE chủ đầu tư, kế hoạch assurance và phân công phù hợp quy mô, rủi ro.","scope":"Khi tổ chức quản lý thi công","status":"verified","url":"https://xaydungchinhsach.chinhphu.vn/nghi-dinh-so-207-2026-nd-cp-ve-quan-ly-chat-iuong-thi-cong-bao-tri-cong-trinh-xay-dung-119260616081951719.htm","proof":"Organization chart, quyết định giao việc, assurance plan","verifiedAt":"2026-11-23"},{"id":"ND16_20","sourceId":"ND207","code":"NĐ 207/2026/NĐ-CP","clause":"Điều 16 khoản 20 điểm a, b, c","summary":"Người quản lý an toàn trong thi công của chủ đầu tư giám sát quy định an toàn của các nhà thầu, phối hợp xử lý giao diện, tạm dừng/đình chỉ khi thấy dấu hiệu vi phạm.","application":"Thiết lập quyền dừng việc và đường escalation, điều phối nhiều EPC tại ranh giới công việc.","scope":"Trách nhiệm của người thực hiện công tác quản lý an toàn THI CÔNG phía chủ đầu tư, theo phân công","status":"verified","url":"https://xaydungchinhsach.chinhphu.vn/nghi-dinh-so-207-2026-nd-cp-ve-quan-ly-chat-iuong-thi-cong-bao-tri-cong-trinh-xay-dung-119260616081951719.htm","proof":"Delegation/Stop Work Authority, nhật ký giám sát, biên bản xử lý giao diện","verifiedAt":"2026-11-23"},{"id":"ND20","sourceId":"ND207","code":"NĐ 207/2026/NĐ-CP","clause":"Điều 20 khoản 1 và khoản 4","summary":"Nội dung giám sát gồm kiểm tra điều kiện năng lực, phương pháp thi công và thực hiện; các mô hình giám sát tùy chủ thể, hợp đồng.","application":"Đặt lịch kiểm chứng dựa trên rủi ro, kiểm tra năng lực và bằng chứng thực hiện biện pháp.","scope":"Khi giám sát thi công; kiểm tra khoản/điểm cụ thể với hồ sơ và loại hình giám sát","status":"verified","url":"https://xaydungchinhsach.chinhphu.vn/nghi-dinh-so-207-2026-nd-cp-ve-quan-ly-chat-iuong-thi-cong-bao-tri-cong-trinh-xay-dung-119260616081951719.htm","proof":"Biên bả
