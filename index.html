function riskBand(n){return n>=17?['Rất cao','risk-extreme']:n>=10?['Cao','risk-high']:n>=5?['Trung bình','risk-medium']:['Thấp','risk-low']}
function riskScale(n){const x=Number(n);return Number.isInteger(x)&&x>=1&&x<=5?x:null}
function cleanRiskPractice(r,v){if(!v||typeof v!=='object')return null;const s=riskScale(v.s),l=riskScale(v.l),rs=riskScale(v.rs),rl=riskScale(v.rl);if(!s||!l)return null;const controls={};for(let c of r.controls){let x=v.controls?.[c.id]||{},status=['pending','pass','fail'].includes(x.status)?x.status:'pending',evidence=String(x.evidence||'').trim().slice(0,600);if(status==='pass'&&evidence.length<4)status='pending';controls[c.id]={status,evidence}}const ready=r.controls.every(c=>controls[c.id].status==='pass');return {s,l,rs:ready?rs:null,rl:ready?rl:null,note:String(v.note||'').slice(0,2000),controls}}
function riskStored(r){return cleanRiskPractice(r,saved.riskPractice[r.id])}
function riskPhases(){return [...DATA.phases,DATA.criticalRiskGuide.operation.phase]}
function riskPhaseLabel(id){return id==='P5'?'P5 · O&M':id}
function riskFilter(){let q=ui.riskQuery.trim().toLocaleLowerCase('vi');return DATA.criticalRisks.filter(r=>(ui.riskPhase==='all'||r.phases.includes(ui.riskPhase))&&(ui.riskGroup==='all'||r.group===ui.riskGroup)&&(ui.riskSystem==='all'||r.system===ui.riskSystem)&&(!q||[r.id,r.title,r.activity,r.hazard,r.event,r.group,r.system||'',r.omNote||'',r.basis,...r.causes,...r.controls.map(c=>c.name)].join(' ').toLocaleLowerCase('vi').includes(q)))}
function riskScore(s,l){let n=s*l,b=riskBand(n);return '<span class="risk-score '+b[1]+'">'+s+' × '+l+' = '+n+' · '+b[0]+'</span>'}
function riskList(a){return '<ul class="bullets">'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'}
function riskSelect(id,label,v,blank=true){return '<label>'+esc(label)+'<select class="field" id="'+id+'">'+(blank?'<option value="">Chưa đánh giá</option>':'')+[1,2,3,4,5].map(n=>'<option value="'+n+'" '+(v===n?'selected':'')+'>'+n+'</option>').join('')+'</select></label>'}
function riskMatrix(r){let e=r.example;return '<div class="risk-matrix-wrap"><table class="risk-matrix"><caption>Ma trận 5×5 · điểm minh họa A trước, B sau</caption><thead><tr><th scope="col">L ↓ / S →</th>'+[1,2,3,4,5].map(s=>'<th scope="col">'+s+'</th>').join('')+'</tr></thead><tbody>'+[5,4,3,2,1].map(l=>'<tr><th scope="row">'+l+'</th>'+[1,2,3,4,5].map(s=>{let a=s===e.s&&l===e.l,b=s===e.rs&&l===e.rl;return '<td class="'+riskBand(s*l)[1]+'">'+s*l+(a||b?'<b> '+(a?'A':'')+(b?'B':'')+'</b>':'')+'</td>'}).join('')+'</tr>').join('')+'</tbody></table></div>'}
function renderRisk(r){ui.riskId=r.id;let e=r.example,p=riskStored(r),ready=!!p&&r.controls.every(c=>p.controls[c.id].status==='pass'),failed=!!p&&r.controls.some(c=>p.controls[c.id].status==='fail');return `<article class="card risk-detail"><div class="tagline"><span class="tag orange">${esc(r.id)} · Critical</span><span class="tag">${esc(r.group)}</span>${r.phases.map(x=>'<span class="tag">'+esc(riskPhaseLabel(x))+'</span>').join('')}</div><h2>${esc(r.title)}</h2>${r.system?`<div class="tagline"><span class="tag blue">${esc(r.system)}</span></div>`:''}<p class="lede">${esc(r.activity)}</p><div class="risk-summary"><div><span class="micro-label">BAN ĐẦU (A) · MẪU</span>${riskScore(e.s,e.l)}</div><div><span class="micro-label">CÒN LẠI (B) · MẪU</span>${riskScore(e.rs,e.rl)}</div><div><span class="micro-label">HÀNG RÀO ĐỀ XUẤT</span><b class="risk-count">${r.controls.length}</b></div></div><div class="detail-jump"><button class="btn small" data-scroll="risk-identify">Nhận diện</button><button class="btn small" data-scroll="risk-assess">Ma trận 5×5</button><button class="btn small" data-scroll="risk-controls">Critical Controls</button><button class="btn small" data-scroll="risk-hold">Stop / Hold</button><button class="btn small" data-scroll="risk-sources">Căn cứ</button><button class="btn small work-only" data-scroll="risk-check">Kiểm chứng</button></div>${r.omNote?`<div class="callout"><b>Liên hệ O&M:</b> ${esc(r.omNote)} <p class="caption">Các kiểm soát bên dưới được xây dựng cho giai đoạn gốc. Khi áp dụng vận hành, O&M phải xác định lại control owner, tần suất, phạm vi pháp lý và tiêu chuẩn kỹ thuật; không sử dụng phân quyền EPC thay đơn vị vận hành.</p></div>`:''}<div class="detailsection" id="risk-identify"><h3>01 · Nhận diện rủi ro</h3><p class="hazard-line"><b>Nguồn nguy hiểm:</b> ${esc(r.hazard)}</p><div class="bowtie-mini"><div class="bowtie-threat"><span class="micro-label">NGUYÊN NHÂN</span>${riskList(r.causes)}</div><div class="bowtie-event"><span class="micro-label">TOP EVENT</span><b>${esc(r.event)}</b></div><div class="bowtie-outcome"><span class="micro-label">HẬU QUẢ</span><p>${esc(r.consequence)}</p></div></div><div class="bowtie-barriers"><div><span class="micro-label">HÀNG RÀO PHÒNG NGỪA</span>${riskList(r.controls.filter(c=>c.type==='Phòng ngừa').map(c=>c.name))}</div><div><span class="micro-label">HÀNG RÀO GIẢM NHẸ</span>${r.controls.some(c=>c.type==='Giảm nhẹ hậu quả')?riskList(r.controls.filter(c=>c.type==='Giảm nhẹ hậu quả').map(c=>c.name)):'<p class="caption">Chưa có hàng rào giảm nhẹ riêng trong mẫu; xác minh thêm theo HAZID/HAZOP.</p>'}</div></div><p class="caption">Sơ đồ khái niệm từ dữ liệu tham chiếu, chưa phải Bow-tie được thẩm định.</p></div>
<div class="detailsection" id="risk-assess"><h3>02 · Đánh giá rủi ro · ví dụ giả định</h3><p class="caption">${esc(e.why)} Không phải mức rủi ro thực của LNG Nghi Sơn.</p>${riskMatrix(r)}<p class="caption">S = mức nghiêm trọng · L = khả năng xảy ra. Giữ phân loại critical kể cả khi điểm B giảm.</p></div>
<div class="detailsection" id="risk-controls"><h3>03 · Critical Controls</h3><p class="caption">Danh mục đề xuất cho workshop: Technical Authority và risk owner phải xác minh các hàng rào, tính độc lập và tiêu chuẩn hiệu suất theo hồ sơ dự án. Không dùng thay biện pháp thi công, SOP vận hành hoặc phương án bảo trì được phê duyệt.</p>${r.controls.map((c,i)=>`<section class="legal-ref cc-card"><div class="cc-card-title"><span class="cc-icon">${uiIcon("shield",21)}</span><div><div class="tagline"><span class="idpill">CC${i+1}</span><span class="tag ${c.type==='Phòng ngừa'?'blue':'violet'}">${esc(c.type)}</span></div><h4>${esc(c.name)}</h4></div></div><div class="cc-criterion"><span class="micro-label">Tiêu chuẩn hiệu suất đề xuất:</span><p>${esc(c.criterion)}</p></div><div class="cc-fields"><div><span class="micro-label">Control owner dự kiến:</span><p>${esc(c.owner)}</p></div><div><span class="micro-label">Thời điểm / tần suất:</span><p>${esc(c.frequency)}</p></div><div class="cc-evidence"><span class="micro-label">Cách kiểm chứng / bằng chứng:</span><p>${esc(c.evidence)}</p></div></div></section>`).join('')}</div>
<div class="detailsection" id="risk-hold"><h3>04 · ${r.system?'Vai trò HSE O&M / bảo đảm an toàn vận hành':'Vai trò HSE phía chủ đầu tư'}</h3><p>${esc(r.assurance)}</p><div class="callout hold-callout"><b>STOP WORK / HOLD GATE:</b> ${esc(r.stop)}</div><div class="softcard"><b>Điều kiện xem xét tiếp tục:</b><p>${esc(r.restart)}</p><p class="caption">Quyết định tiếp tục theo phân quyền và hồ sơ thật; ứng dụng không cấp permit hay tự chấp thuận.</p></div></div>
${r.kpi?`<div class="detailsection"><h3>Chỉ báo an toàn vận hành (KPI đề xuất)</h3>${riskList(r.kpi)}<p class="caption">${esc(DATA.criticalRiskGuide.operation.kpiNote)}</p></div>`:''}<div class="detailsection" id="risk-sources"><h3>05 · Căn cứ và quy trình liên quan</h3><p>${esc(r.basis)}</p><div class="tagline">${sourcechips(r.refs)}</div><div class="btnrow" style="margin-top:10px">${r.tasks.map(id=>'<button class="btn" data-task="'+esc(id)+'">'+esc(id)+' · '+esc(task(id)?.title)+' →</button>').join('')}</div></div>
<div class="evidencepanel work-only" id="risk-check"><h3>06 · Đánh giá và kiểm chứng tham chiếu</h3><p class="caption">Không dùng dữ liệu dự án mật. Nhập S/L ban đầu và cơ sở đánh giá, sau đó tự kiểm từng hàng rào. Điểm còn lại chỉ được lưu khi tất cả hàng rào có trạng thái đạt và bằng chứng tự nhập; app không xác thực bằng chứng.</p><div class="formgrid">${riskSelect('riskS','S ban đầu',p?.s)}${riskSelect('riskL','L ban đầu',p?.l)}</div>${r.controls.map(c=>{let a=p?.controls[c.id]||{status:'pending',evidence:''};return '<div class="legal-ref"><b>'+esc(c.name)+'</b><div class="formgrid"><label>Trạng thái tự kiểm<select class="field" id="risk-status-'+c.id+'">'+[['pending','Chưa kiểm'],['pass','Đạt (mô phỏng)'],['fail','Không đạt']].map(([k,v])=>'<option value="'+k+'" '+(a.status===k?'selected':'')+'>'+v+'</option>').join('')+'</select></label><label>Bằng chứng / ghi nhận<input class="field" id="risk-evidence-'+c.id+'" value="'+esc(a.evidence)+'" placeholder="Mã hồ sơ giả định, kết quả kiểm tra..."></label></div></div>'}).join('')}
<div class="formgrid">${riskSelect('riskRS','S còn lại (nếu đủ evidence)',p?.rs)}${riskSelect('riskRL','L còn lại (nếu đủ evidence)',p?.rl)}</div><label>Cơ sở giả định / nhận xét<textarea class="field" id="riskNote" rows="3" placeholder="Vì sao chọn S/L? Hàng rào nào hiệu lực? Điều kiện nào cần xác minh?">${esc(p?.note||'')}</textarea></label>
<div class="btnrow"><button class="btn primary" data-action="save-risk">Tính & lưu đánh giá</button><button class="btn" data-action="clear-risk">Xóa đánh giá</button></div>${p?`<div class="softcard"><b>Kết quả đánh giá tham chiếu:</b><p>Ban đầu: ${riskScore(p.s,p.l)}</p><p>Còn lại: ${ready&&p.rs&&p.rl?riskScore(p.rs,p.rl):'Chưa đủ điều kiện ghi điểm còn lại'}</p><p><b>${failed?'Có hàng rào không đạt – HOLD/STOP theo tình huống.':!ready?'Chưa chứng minh đủ Critical Controls – HOLD.':'Đã tự rà đủ hàng rào trong đánh giá tham chiếu; không đồng nghĩa được phép làm việc.'}</b></p></div>`:''}<p id="riskFeedback" class="caption"></p></div></article>`}
function criticalrisk(){
 let g=DATA.criticalRiskGuide,list=riskFilter().sort((a,b)=>ui.riskPhase==='P5'?Number(!!b.system)-Number(!!a.system):0),r=list.find(x=>x.id===ui.riskId)||list[0],groups=[...new Set(DATA.criticalRisks.map(x=>x.group))],systems=[...new Set(DATA.criticalRisks.map(x=>x.system).filter(Boolean))],n=DATA.criticalRisks.length,ops=DATA.criticalRisks.filter(x=>x.system).length,opAll=DATA.criticalRisks.filter(x=>x.phases.includes('P5')).length,cc=DATA.criticalRisks.reduce((s,x)=>s+x.controls.length,0);
 return header('Risk governance / Critical Control Management','Critical Risk – '+n+' rủi ro trọng yếu','Danh mục tham chiếu theo vòng đời dự án. Chọn rủi ro để xem nguyên nhân, đánh giá, hàng rào, bằng chứng và điều kiện dừng.', '<button class="btn" data-action="export-risk">'+uiIcon('download',17)+' Risk Register CSV</button>')+
 `<section class="risk-command"><div class="risk-command-summary"><div><span class="micro-label">RỦI RO TRỌNG YẾU</span><b>${n}</b></div><div><span class="micro-label">CRITICAL CONTROLS</span><b>${cc}</b></div><div><span class="micro-label">O&M CHUYÊN SÂU</span><b>${ops}</b></div></div><div class="risk-distribution" id="mod-risk-distribution"><div class="sectionrow"><div><span class="micro-label">RISK PORTFOLIO</span><h3>Phân bố theo nhóm nghiệp vụ</h3></div><span class="caption">Số lượng danh mục, không phải mức rủi ro thực tế</span></div><div class="distribution-stack" aria-hidden="true">${groups.map((x,i)=>`<span class="dist-${i%5}" style="flex:${DATA.criticalRisks.filter(y=>y.group===x).length}"></span>`).join("")}</div><div class="distribution-list">${groups.map((x,i)=>{let k=DATA.criticalRisks.filter(y=>y.group===x).length;return `<button class="distribution-row ${ui.riskGroup===x?"is-selected":""}" data-action="risk-group-${i}" aria-pressed="${ui.riskGroup===x}"><span class="dist-dot dist-${i%5}"></span><span>${esc(x)}</span><b>${k}</b>${uiIcon("arrow",14)}</button>`}).join("")}</div></div><div class="risk-modebar"><button class="btn ${ui.riskPhase==='all'&&ui.riskGroup==='all'?'primary':''}" data-action="risk-reset">Tất cả ${n} rủi ro</button><button class="btn ${ui.riskGroup==='An toàn vận hành & bảo trì (O&M)'?'primary':''}" data-action="risk-ops-new">${ops} rủi ro O&M chuyên sâu</button><button class="btn ${ui.riskPhase==='P5'&&ui.riskGroup==='all'&&ui.riskSystem==='all'?'primary':''}" data-action="risk-ops-all">${opAll} rủi ro liên quan O&M</button></div><details class="scope-details risk-scope"><summary><b>An toàn vận hành & bảo trì (O&M) · P5</b><span class="subnote">5 hệ thống · Nhịp quản trị</span></summary><p>${esc(g.operation.scope)}</p><div class="ops-areas">${systems.map((x,i)=>'<button class="taskbtn '+(ui.riskSystem===x?'selected':'')+'" data-action="risk-system-'+i+'"><span class="idpill">'+DATA.criticalRisks.filter(y=>y.system===x).length+' rủi ro mới</span><b>'+esc(x)+'</b></button>').join('')}</div><div class="owner-rhythm">${g.operation.rhythm.map(x=>'<div class="softcard"><span class="tag blue">'+esc(x.when)+'</span><p>'+esc(x.work)+'</p><p><b>Chủ trì:</b> '+esc(x.owner)+'</p><p><b>Bằng chứng:</b> '+esc(x.evidence)+'</p></div>').join('')}</div><p class="caption">${esc(g.operation.kpiNote)}</p></details><details class="scope-details risk-scope"><summary><b>Phương pháp 5×5, phạm vi và căn cứ</b><span class="subnote">Ma trận tham chiếu</span></summary><p>${esc(g.disclaimer)}</p>${riskList(g.method)}<div class="detailcols"><div><h4>Severity · S</h4>${riskList(g.severity)}</div><div><h4>Likelihood · L</h4>${riskList(g.likelihood)}</div></div><p>${g.bands.map(x=>esc(x)).join(' · ')}</p>${g.sources.map(x=>'<p><a href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+esc(x.label)+' ↗</a></p>').join('')}</details></section>
 <div class="filterarea risk-filter"><input class="field small" id="riskSearch" type="search" placeholder="Tìm LNG, nâng hạ, LOTO..." value="${esc(ui.riskQuery)}" aria-label="Tìm rủi ro"><select id="riskPhase" class="field small" aria-label="Lọc giai đoạn"><option value="all">Tất cả giai đoạn</option>${riskPhases().map(p=>'<option value="'+esc(p.id)+'" '+(ui.riskPhase===p.id?'selected':'')+'>'+esc(p.short)+'</option>').join('')}</select><select id="riskGroup" class="field small" aria-label="Lọc nhóm"><option value="all">Tất cả nhóm</option>${groups.map(x=>'<option value="'+esc(x)+'" '+(ui.riskGroup===x?'selected':'')+'>'+esc(x)+'</option>').join('')}</select><select id="riskSystem" class="field small" aria-label="Lọc hệ thống vận hành"><option value="all">Tất cả hệ thống O&M</option>${systems.map(x=>'<option value="'+esc(x)+'" '+(ui.riskSystem===x?'selected':'')+'>'+esc(x)+'</option>').join('')}</select><span class="result-count">${list.length}/${n} rủi ro</span></div><div class="layoutsplit risk-workspace" id="mod-risk-detail"><section class="tasklist" aria-label="Danh sách rủi ro">${list.map(x=>'<button class="taskbtn '+(r?.id===x.id?'selected':'')+'" data-risk="'+esc(x.id)+'"><div class="rowbetween"><span class="idpill">'+esc(x.id)+'</span><span class="tag orange">Critical</span></div><div class="taskhead">'+esc(x.title)+'</div><p class="muted smalltext">'+esc(x.system||x.group)+' · '+esc(x.phases.map(riskPhaseLabel).join(' · '))+'</p><div class="risk-list-score"><span class="risk-score '+riskBand(x.example.s*x.example.l)[1]+'">'+x.example.s*x.example.l+'</span><span>→</span><span class="risk-score '+riskBand(x.example.rs*x.example.rl)[1]+'">'+x.example.rs*x.example.rl+'</span><span class="caption">Mẫu</span>'+(riskStored(x)?'<span class="work-only caption">Đã tự đánh giá</span>':'')+'</div></button>').join('')||'<p class="muted">Không có rủi ro phù hợp.</p>'}</section><section>${r?renderRisk(r):'<div class="card empty">Đổi bộ lọc để xem rủi ro.</div>'}</section></div>`;
}
function saveRiskPractice(){let r=DATA.criticalRisks.find(x=>x.id===ui.riskId);if(!r)return;const s=riskScale($('#riskS')?.value),l=riskScale($('#riskL')?.value),rs=riskScale($('#riskRS')?.value),rl=riskScale($('#riskRL')?.value),note=String($('#riskNote')?.value||'').trim().slice(0,2000);if(!s||!l||note.length<10){alert('Chọn S và L ban đầu, nhập cơ sở đánh giá tối thiểu 10 ký tự.');return}let controls={};for(let c of r.controls){let status=$('#risk-status-'+c.id)?.value||'pending',evidence=String($('#risk-evidence-'+c.id)?.value||'').trim().slice(0,600);if(!['pending','pass','fail'].includes(status)){alert('Trạng thái không hợp lệ');return}if(status==='pass'&&evidence.length<4){alert(c.id+' phải có bằng chứng khi đánh dấu Đạt.');return}controls[c.id]={status,evidence}}let ready=r.controls.every(c=>controls[c.id].status==='pass');if(ready&&(!!rs!==!!rl)){alert('Chọn cả S và L còn lại hoặc để trống cả hai.');return}let p=cleanRiskPractice(r,{s,l,rs,rl,note,controls});saved.riskPractice[r.id]=p;let ok=persist();render();let f=$('#riskFeedback');if(f)f.textContent=ok?(ready?'✓ Đã lưu đánh giá tham chiếu.':'✓ Đã lưu; điểm còn lại không được lưu vì hàng rào chưa đủ bằng chứng.'):'Không lưu được trên thiết bị; hãy xuất tiến độ.'}
function exportRiskRegister(){const h=['Mã','Nhóm','Giai đoạn','Rủi ro','Hoạt động','Mối nguy','Top event','Nguyên nhân','Hậu quả','S mẫu','L mẫu','Điểm mẫu','S còn lại mẫu','L còn lại mẫu','Điểm còn lại mẫu','CC ID','Loại CC','Critical control','Tiêu chuẩn hiệu suất','Control owner dự kiến','Bằng chứng','Tần suất','Stop/Hold','Điều kiện review tiếp tục','PMU assurance','Căn cứ','S tự đánh giá','L tự đánh giá','S còn lại tự đánh giá','L còn lại tự đánh giá','Trạng thái tự kiểm','Bằng chứng tự nhập','Cơ sở tự đánh giá','Hệ thống O&M','Lưu ý O&M','KPI đề xuất','Giới hạn'];let rows=[h];for(let r of DATA.criticalRisks){let p=riskStored(r);for(let c of r.controls){let a=p?.controls[c.id];rows.push([r.id,r.group,r.phases.join(' / '),r.title,r.activity,r.hazard,r.event,r.causes.join('; '),r.consequence,r.example.s,r.example.l,r.example.s*r.example.l,r.example.rs,r.example.rl,r.example.rs*r.example.rl,c.id,c.type,c.name,c.criterion,c.owner,c.evidence,c.frequency,r.stop,r.restart,r.assurance,r.basis,p?.s,p?.l,p?.rs,p?.rl,a?.status||'pending',a?.evidence,p?.note,r.system||'',r.omNote||'',(r.kpi||[]).join('; '),'Khung tham chiếu – không phải chấp thuận rủi ro thực tế'])}}const csv='\ufeff'+rows.map(row=>row.map(v=>{let x=String(v??'');if(/^[\t\r\n ]*[=+\-@]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'HSE_PMU_Critical_Risk_Register.csv')}

function raci(){let roleKeys=['owner','hse','legal','design','epc'],cols=['work','owner','hse','legal','design','epc'];let headers=['Công việc','PM / Chủ đầu tư','HSE BQLDA','Legal','Engineering','EPC'];return header('Phạm vi trách nhiệm','Ai làm, ai kiểm soát, ai được ký?','Ma trận dưới đây là ví dụ tổ chức. RACI không thay cho quyết định phân cấp, luật, hợp đồng hoặc người có đủ năng lực kỹ thuật.')+`<div class="card" style="margin-bottom:18px"><div class="threecol"><div><span class="tag teal">R · Responsible</span><p class="muted">Đơn vị/cá nhân thực hiện công việc.</p></div><div><span class="tag blue">A · Accountable</span><p class="muted">Đầu mối chịu trách nhiệm tổng thể về kết quả.</p></div><div><span class="tag violet">C/I</span><p class="muted">Tham vấn / được thông báo. A không đồng nghĩa thẩm quyền ký kỹ thuật/pháp lý.</p></div></div><div class="notice">Không có công thức “HSE phê duyệt tất cả JSA, HAZOP, QRA”. Người chấp thuận/định đoạt phải được xác định đúng theo pháp luật, phân quyền, năng lực và hợp đồng.</div></div><section class="module-panel raci-panel" id="mod-raci-matrix"><div class="sectionrow"><div><span class="micro-label">RESPONSIBILITY MATRIX</span><h2>Ma trận phân công trách nhiệm</h2></div><span class="caption">Chọn vai trò để làm nổi bật cột, không ẩn các vai trò khác.</span></div><div class="raci-focus"><button class="btn ${ui.raciFocus==="all"?"primary":""}" data-action="raci-all" aria-pressed="${ui.raciFocus==="all"}">Tất cả</button>${roleKeys.map((k,i)=>`<button class="btn ${ui.raciFocus===k?"primary":""}" data-action="raci-${k}" aria-pressed="${ui.raciFocus===k}">${esc(headers[i+1])}</button>`).join("")}</div><div class="raci-legend">${[["R","Thực hiện"],["A","Chịu trách nhiệm tổng thể"],["C","Tham vấn"],["I","Thông báo"]].map(([k,v])=>`<span><i class="raci-chip raci-${k}">${k}</i>${esc(v)}</span>`).join("")}</div>${ui.raciFocus!=="all"?`<div class="raci-role-summary"><b>${esc(headers[roleKeys.indexOf(ui.raciFocus)+1])}</b>${["R","A","C","I"].map(k=>`<span>${k}: ${DATA.raci.filter(r=>String(r[ui.raciFocus]).split("/").includes(k)).length} hạng mục</span>`).join("")}<small>Một hạng mục có thể mang nhiều ký hiệu.</small></div>`:""}<div class="tablewrap"><table class="datatable raci-table"><thead><tr>${headers.map((h,i)=>`<th class="${ui.raciFocus===cols[i]?"raci-highlight":""}">${esc(h)}</th>`).join("")}<th>Giới hạn thực tế</th></tr></thead><tbody>${DATA.raci.map(r=>`<tr>${cols.map((k,i)=>`<td class="${ui.raciFocus===k?"raci-highlight":""}">${i===0?`<b>${esc(r[k])}</b>`:`<span class="raci-code" aria-label="${esc(r[k])}">${String(r[k]).split("/").map(v=>`<span class="raci-chip raci-${/^[RACI]$/.test(v)?v:"other"}">${esc(v)}</span>`).join('<span class="raci-sep">/</span>')}</span>`}</td>`).join("")}<td>${esc(r.note)}</td></tr>`).join("")}</tbody></table></div></section><div class="gridsection twocol" id="mod-raci-limits"><div class="card"><h3>HSE BQLDA phải “sở hữu” điều gì?</h3><ul class="bullets"><li>Đề xuất chiến lược và yêu cầu HSE toàn dự án.</li><li>Kiểm chứng các hệ thống nhà thầu hoạt động hiệu lực.</li><li>Nhận diện rủi ro giao diện giữa gói thầu và giữa thi công – vận hành.</li><li>Giữ luồng báo cáo, escalation và quyết định ở cấp chủ đầu tư.</li><li>Tham mưu về pháp lý và điều kiện HSE theo từng milestone.</li></ul></div><div class="card"><h3>HSE BQLDA không được mặc định làm thay</h3><ul class="bullets"><li>Thiết kế giải pháp kỹ thuật nâng hạ cho EPC.</li><li>Tự thẩm định chuyên môn HAZOP/QRA nếu không đủ năng lực.</li><li>Tự ký các thủ tục môi trường/PCCC không được ủy quyền.</li><li>Giám sát từng người lao động để thay toàn bộ hệ thống EPC.</li><li>Điều tra pháp định thay cơ quan có thẩm quyền.</li></ul></div></div>`}
function legal(){let domains=[...new Set(DATA.sources.map(s=>s.domain))].sort();let arr=DATA.sources.filter(s=>(ui.sourceKind==='all'||s.kind===ui.sourceKind)&&(ui.sourceDomain==='all'||s.domain===ui.sourceDomain)&&(!ui.sourceQuery||(s.code+' '+s.title+' '+s.use).toLocaleLowerCase('vi').includes(ui.sourceQuery.toLocaleLowerCase('vi'))));return header('Tra cứu có kiểm chứng','Thư viện pháp lý & hướng dẫn HSE',`${DATA.sources.length} nguồn cốt lõi được đối chiếu tại các mốc ghi trong thư viện. Phải kiểm tra hiệu lực, bản hợp nhất, phạm vi áp dụng và văn bản chuyên ngành khi sử dụng thực tế.`,`<a class="btn" href="https://vbpl.moj.gov.vn/" target="_blank" rel="noopener noreferrer">↗ CSDL VBQPPL</a>`)+`<div class="callout" style="margin-bottom:18px"><strong>Quy tắc áp dụng:</strong><p>Pháp luật và QCVN có tính bắt buộc trong phạm vi điều chỉnh. Tiêu chuẩn quốc tế như NFPA, hướng dẫn IFC/IOGP là tài liệu tham khảo, chỉ trở thành nghĩa vụ khi pháp luật, hợp đồng, thiết kế được phê duyệt hoặc quy định liên quan dẫn chiếu.</p></div><section class="module-panel library-index" id="mod-library-catalog"><div class="sectionrow"><h3>Phân loại nguồn theo tính chất</h3><span class="caption">Pháp luật / Quy chuẩn / Hướng dẫn tham chiếu</span></div><div class="library-kinds"><button class="library-kind ${ui.sourceKind==="all"?"is-selected":""}" data-action="source-kind-all"><b>${DATA.sources.length}</b><span>Tất cả nguồn</span></button>${[...new Set(DATA.sources.map(s=>s.kind))].map((k,i)=>`<button class="library-kind ${ui.sourceKind===k?"is-selected":""}" data-action="source-kind-${i}"><b>${DATA.sources.filter(s=>s.kind===k).length}</b><span>${esc(k)}</span></button>`).join("")}</div></section><div class="filterarea"><input class="field small" id="sourceSearch" value="${esc(ui.sourceQuery)}" type="search" placeholder="Tìm tên văn bản, chủ đề..." aria-label="Tìm nguồn pháp lý"><select id="sourceDomain" class="field small" aria-label="Lọc lĩnh vực văn bản"><option value="all">Mọi lĩnh vực</option>${domains.map(d=>`<option value="${esc(d)}" ${ui.sourceDomain===d?'selected':''}>${esc(d)}</option>`).join('')}</select><span class="tag">${arr.length} nguồn</span></div><div class="legalgrid">${arr.map(s=>`<article class="card legalcard"><div class="rowbetween"><span class="tag ${s.kind==='Pháp luật VN'?'teal':s.kind==='Quy chuẩn VN'?'blue':'orange'}">${esc(s.kind)}</span><span class="texttiny">${esc(s.domain)}</span></div><div class="source-title"><span class="source-symbol">${uiIcon("book",20)}</span><div><span class="micro-label">${esc(s.code)}</span><h3>${esc(s.code)} · ${esc(s.title)}</h3></div></div><div class="source-coverage"><span>${DATA.legalClauses.filter(c=>c.sourceId===s.id).length} nhóm điều khoản</span><span>${DATA.tasks.filter(t=>t.refs.includes(s.id)).length} quy trình dẫn nguồn</span></div><p><strong>Sử dụng khi:</strong> ${esc(s.use)}</p><div class="notice"><strong>Kiểm tra:</strong> ${esc(s.note)}</div><div class="legalfoot"><a class="btn small" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">Mở nguồn chính thức ↗</a><span class="texttiny">Mốc hiệu lực/ấn bản: ${esc(s.date)}</span></div></article>`).join('')||'<div class="empty">Không tìm được nguồn.</div>'}</div><div class="card gridsection" id="mod-library-method"><h3>4 câu hỏi pháp lý phải trả lời trước khi lập Compliance Register</h3><div class="threecol">${[['01','Đối tượng nào?','Phân loại dự án, hạng mục, quy mô, tính chất và hoạt động thực tế.'],['02','Nghĩa vụ của ai?','Chủ đầu tư, nhà thầu, tư vấn, pháp nhân cảng/kho khí hay vận hành?'],['03','Mốc bắt buộc nào?','Trước khảo sát, chuẩn bị đầu tư, khởi công, chạy thử hay vận hành?'],['04','Ai có quyền xác nhận?','Cơ quan và chủ thể có thẩm quyền, người ký theo phân quyền, bằng chứng hợp lệ.']].map(x=>`<div class="softcard"><span class="stepnum">${x[0]}</span><h4 style="margin-top:9px">${x[1]}</h4><p class="muted">${x[2]}</p></div>`).join('')}</div></div>`}
function reviewItems(t){return saved.templateChecks?.[t.id]||{}}
function getReview(t,id){return reviewItems(t)[id]||{status:'pending',evidence:'',note:''}}
function reviewSummary(t){let n={total:t.checklist.length,pass:0,fail:0,na:0,pending:0,criticalFail:0,valid:0};for(let c of t.checklist){let r=getReview(t,c.id);let status=['pass','fail','na'].includes(r.status)?r.status:'pending';n[status]++;if(status==='fail'&&c.critical)n.criticalFail++;if(status==='pass'&&String(r.evidence||'').trim())n.valid++;if(status==='na'&&String(r.note||'').trim().length>=8)n.valid++}n.completed=(n.pending===0&&n.fail===0&&n.valid===n.total);return n}
function checkStatusOpts(value){return [['pending','Chưa kiểm'],['pass','Đạt – có bằng chứng'],['fail','Chưa đạt'],['na','Không áp dụng – có lý do']].map(([id,label])=>`<option value="${id}" ${value===id?'selected':''}>${esc(label)}</option>`).join('')}
function templates(){let t=DATA.templates.find(x=>x.id===ui.template)||DATA.templates[0], n=reviewSummary(t),done=DATA.templates.filter(x=>reviewSummary(x).completed).length;return header('Hồ sơ, biểu mẫu & kiểm chứng','Biểu mẫu và checklist review HSE phía chủ đầu tư',`${DATA.templates.length} mẫu dữ liệu • ${DATA.templates.reduce((a,t)=>a+t.checklist.length,0)} tiêu chí kiểm tra kèm cách xác minh, bằng chứng và trạng thái. Đây là công cụ rà soát nội bộ, KHÔNG phải phê duyệt hồ sơ pháp định.`)+`

<div class="statgrid v2stats work-only"><div class="stat"><div class="stitle">Biểu mẫu</div><div class="big">${DATA.templates.length}</div><div class="foot">Mẫu CSV mang tính tham khảo</div></div><div class="stat"><div class="stitle">Đã tự rà đủ</div><div class="big">${done}/${DATA.templates.length}</div><div class="foot">Không đồng nghĩa được phê duyệt</div></div><div class="stat"><div class="stitle">Tiêu chí toàn bộ</div><div class="big">${DATA.templates.reduce((a,x)=>a+x.checklist.length,0)}</div><div class="foot">Có cách kiểm và bằng chứng</div></div><div class="stat"><div class="stitle">Đang chọn</div><div class="big">${n.pass}/${n.total}</div><div class="foot">Mục đạt đã đánh dấu</div></div></div>
<div class="layoutsplit template-workspace" id="mod-template-index"><aside class="template-catalog"><div class="catalog-header"><span class="micro-label">DOCUMENT REGISTER</span><h3>${DATA.templates.length} hồ sơ quản trị</h3><span class="caption">Chọn hồ sơ để xem cấu trúc và kiểm chứng</span></div><div class="templategrid">${DATA.templates.map(o=>{let r=reviewSummary(o);return `<div class="card template-card ${o.id===t.id?"selected":""}"><div class="rowbetween"><span class="tag blue">MẪU + REVIEW</span><span class="idpill">${esc(o.id.toUpperCase())}</span></div><h3 style="margin-top:11px">${esc(o.title)}</h3><p class="muted">${esc(o.desc)}</p><div class="template-coverage"><span>${r.total} tiêu chí</span><span>${o.checklist.filter(c=>c.critical).length} trọng yếu</span></div><div class="mini-meter work-only"><i style="width:${Math.round((r.pass+r.na)/r.total*100)}%"></i></div><p class="caption work-only">${r.pass} đạt · ${r.na} N/A · ${r.fail} chưa đạt · ${r.pending} chưa kiểm</p><div class="btnrow"><button class="btn small ${o.id===t.id?"primary":""}" data-template="${o.id}" aria-current="${o.id===t.id?"true":"false"}">Mở checklist (${r.total})</button><button class="btn small" data-download-template="${o.id}">↓ CSV mẫu</button></div></div>`}).join('')}</div></aside>
<section class="card template-preview" id="templatePreview"><div class="sectionrow"><div><h2>${esc(t.title)}</h2><p class="muted">${esc(t.desc)}</p></div><div class="btnrow"><button class="btn small" data-download-template="${t.id}">↓ Tải CSV mẫu</button><button class="btn small" data-download-checklist="${t.id}">↓ Xuất checklist CSV</button></div></div>
<div class="selected-summary template-summary"><div><span class="micro-label">MÃ BIỂU MẪU</span><b>${esc(t.id.toUpperCase())}</b></div><div><span class="micro-label">TIÊU CHÍ KIỂM CHỨNG</span><b>${t.checklist.length}</b></div><div><span class="micro-label">TIÊU CHÍ TRỌNG YẾU</span><b>${t.checklist.filter(c=>c.critical).length}</b></div></div><div class="tagline work-only"><span class="tag teal">${n.pass} đạt</span><span class="tag red">${n.fail} chưa đạt</span><span class="tag orange">${n.pending} chưa kiểm</span><span class="tag violet">${n.na} N/A</span>${n.completed?'<span class="tag teal">Tự rà đủ điều kiện kiểm tra nội bộ</span>':'<span class="tag red">Chưa thể coi là tự rà đủ</span>'}</div>
<div class="detailsection" id="mod-template-schema"><h3>1. Cấu trúc biểu mẫu gốc</h3><div class="tablewrap"><table class="datatable"><thead><tr>${t.columns.map(s=>`<th>${esc(s)}</th>`).join('')}</tr></thead><tbody><tr>${t.row.map(s=>`<td>${esc(s)}</td>`).join('')}</tr></tbody></table></div><p class="caption">Xóa dữ liệu [MẪU] và xác định tài liệu bắt buộc theo hợp đồng/pháp luật trước khi áp dụng thực tế.</p></div>
<div class="detailsection" id="mod-template-checks"><div class="sectionrow"><h3>2. Checklist kiểm soát chất lượng – ${t.checklist.length} tiêu chí</h3><span class="caption work-only">Chọn trạng thái, nhập bằng chứng, nhấn Lưu. Dữ liệu chỉ nằm trên máy này.</span></div>
${t.checklist.map((c,i)=>{let a=getReview(t,c.id);return `<div class="review-item"><div class="review-index">${String(i+1).padStart(2,'0')}</div><div class="review-content"><div class="rowbetween"><h4>${esc(c.question)}</h4>${c.critical?'<span class="tag red">Trọng yếu</span>':'<span class="tag">Kiểm soát</span>'}</div><div class="check-evidence-grid"><div><span class="micro-label">Cách kiểm:</span><p>${esc(c.how)}</p></div><div><span class="micro-label">Bằng chứng mong đợi:</span><p>${esc(c.evidence)}</p></div></div><div class="review-fields"><label><span class="fieldlabel">Đánh giá</span><select class="field" id="check-status-${c.id}">${checkStatusOpts(a.status||'pending')}</select></label><label><span class="fieldlabel">Mã/link bằng chứng (bắt buộc nếu Đạt)</span><input class="field" id="check-evidence-${c.id}" maxlength="500" value="${esc(a.evidence||'')}" placeholder="Ví dụ: REV-003 / biên bản ngày... (không nhập hồ sơ mật)"></label></div><label class="work-only"><span class="fieldlabel">Ghi chú, lý do N/A hoặc kế hoạch khắc phục</span><textarea class="field review-note" id="check-note-${c.id}" rows="2" maxlength="800" placeholder="Ghi việc cần làm, owner, mốc; N/A cần lý do rõ">${esc(a.note||'')}</textarea></label></div></div>`}).join('')}
<div class="review-footer"><div><h3>Kết luận tự rà soát</h3><p class="muted">${n.completed?'Các mục đã được ghi nhận đủ trong ứng dụng; vẫn cần người có thẩm quyền xác nhận tài liệu thật.':`Còn ${n.pending} mục chưa kiểm, ${n.fail} mục chưa đạt, ${n.total-n.valid} mục chưa đủ bằng chứng/lý do. Không ký nhận “đã đạt” chỉ dựa trên màn hình này.`}</p><div class="tagline">${sourcechips(t.refs)}</div></div><div class="btnrow"><button class="btn primary" data-action="save-template-review">✓ Lưu đánh giá biểu mẫu</button><span id="reviewFeedback" class="caption" role="status"></span></div></div></div><div class="detailsection"><h3>Nguồn liên quan</h3><div class="tagline">${sourcechips(t.refs)}</div></div></section></div>`}
function scenarioFilter(){return DATA.scenarios.filter(s=>(ui.casePhase==='all'||s.phase===ui.casePhase)&&(ui.caseDifficulty==='all'||s.difficulty===ui.caseDifficulty)&&(!ui.caseQuery||(s.title+' '+s.story+' '+s.category).toLocaleLowerCase('vi').includes(ui.caseQuery.toLocaleLowerCase('vi')))&&(ui.caseUntried!=='untried'||saved.cases[s.id]===undefined))}
function scenarios(){let filtered=scenarioFilter();let sc=filtered.find(x=>x.id===ui.case)||filtered[0];if(sc)ui.case=sc.id;let recorded=sc?saved.cases[sc.id]:undefined;let referenceOnly=!!sc&&recorded===undefined&&ui.revealCase===sc.id;let answer=referenceOnly?sc.correct:recorded;let tried=DATA.scenarios.filter(s=>saved.cases[s.id]!==undefined).length,correct=DATA.scenarios.filter(s=>saved.cases[s.id]===s.correct).length;return header('Mô phỏng quyết định cấp quản lý',`${DATA.scenarios.length} tình huống HSE BQLDA – ra quyết định như PMU`,'Mỗi ca gồm bối cảnh áp lực, ba lựa chọn, cách làm từng bước, bằng chứng, điểm escalation và giới hạn thẩm quyền. Chọn một phương án để xem phân tích, hướng xử lý và bằng chứng cần kiểm chứng.')+`
<div class="statgrid v2stats work-only"><div class="stat"><div class="stitle">Tổng tình huống</div><div class="big">${DATA.scenarios.length}</div><div class="foot">Trải cả 5 giai đoạn</div></div><div class="stat"><div class="stitle">Đã thử</div><div class="big">${tried}</div><div class="foot">Lưu cục bộ trên máy</div></div><div class="stat"><div class="stitle">Đúng hướng</div><div class="big">${correct}</div><div class="foot">Theo đáp án gợi ý</div></div><div class="stat"><div class="stitle">Chưa thử</div><div class="big">${DATA.scenarios.length-tried}</div><div class="foot">Bao phủ 5 giai đoạn dự án</div></div></div>
<div class="filterarea"><label class="inline-filter"><span class="fieldlabel">Tìm tình huống</span><input class="field small" id="caseSearch" type="search" value="${esc(ui.caseQuery)}" placeholder="Ví dụ: ĐTM, SIMOPS, PSSR..." aria-label="Tìm tình huống"></label><label class="inline-filter"><span class="fieldlabel">Giai đoạn</span><select class="field small" id="casePhase"><option value="all">Tất cả giai đoạn</option>${DATA.phases.map(p=>`<option value="${p.id}" ${ui.casePhase===p.id?'selected':''}>${esc(p.short)}</option>`).join('')}</select></label><label class="inline-filter"><span class="fieldlabel">Độ khó</span><select class="field small" id="caseDifficulty">${['all','Trung bình','Nâng cao','Khẩn cấp'].map(v=>`<option value="${v}" ${ui.caseDifficulty===v?'selected':''}>${v==='all'?'Tất cả':esc(v)}</option>`).join('')}</select></label><label class="inline-filter"><span class="fieldlabel">Tình trạng</span><select class="field small" id="caseUntried"><option value="all">Tất cả</option><option value="untried" ${ui.caseUntried==='untried'?'selected':''}>Chưa thử</option></select></label></div>
<div class="layoutsplit scenario-layout" id="mod-case-index"><div class="card"><h3>Danh sách · ${filtered.length} ca</h3><div class="cardsstack scroll-catalog">${filtered.map((s,i)=>`<button class="taskbtn ${ui.case===s.id?'selected':''}" data-case="${s.id}"><div class="rowbetween"><span class="idpill">${esc(s.id)} · ${esc(phase(s.phase)?.short)}</span><span class="work-only">${saved.cases[s.id]===undefined?'<span class="tag">Chưa thử</span>':saved.cases[s.id]===s.correct?'<span class="tag teal">Đúng</span>':'<span class="tag orange">Cần xem xét</span>'}</span></div><div class="taskhead">${esc(s.title)}</div><div class="caption">${esc(s.difficulty||'Nâng cao')}</div></button>`).join('')||'<p class="muted">Không có tình huống phù hợp. Đổi bộ lọc.</p>'}</div></div>
${!sc?'<div class="card empty">Không có tình huống phù hợp với bộ lọc.</div>':`<div class="card case-detail" id="mod-case-detail"><div class="tagline"><span class="idpill">${esc(sc.id)}</span><span class="tag orange">${esc(sc.difficulty)}</span><span class="tag blue">${esc(phase(sc.phase)?.short)}</span></div><h2 style="margin-top:12px">${esc(sc.title)}</h2><div class="case-context"><span class="micro-label">BỐI CẢNH QUẢN TRỊ</span><p class="lede">${esc(sc.story)}</p></div><div class="sectionrow case-question"><h3>Quyết định ưu tiên của HSE BQLDA là gì?</h3>${answer===undefined?'<button class="btn primary" data-action="case-reveal">Xem phương án khuyến nghị</button>':''}</div>${sc.choices.map((c,i)=>`<button class="choice ${answer!==undefined?(i===sc.correct?'correct':answer===i?'wrong':''):''}" data-choice="${sc.id}:${i}"><b>${String.fromCharCode(65+i)}.</b> ${esc(c)}</button>`).join('')}
${answer===undefined?'<div class="caption">Chọn một phương án trước khi xem hướng xử lý. Không có đáp án chung cho mọi hợp đồng/phân quyền dự án.</div>':`<div class="feedback ${answer===sc.correct?'ok':'no'}"><b>${referenceOnly?'Phương án tham chiếu':answer===sc.correct?'Đúng hướng quản trị':'Cần điều chỉnh'}</b><p>${esc(sc.explain)}</p><p class="caption"><strong>Quyết định khuyến nghị:</strong> ${esc(sc.choices[sc.correct])}</p></div><div class="detailsection"><h3>Hành động quản trị cần tổ chức</h3>${sc.actions.map((v,i)=>`<div class="stepblock"><div class="stepnum">${i+1}</div><p>${esc(v)}</p></div>`).join('')}</div><div class="detailcols detailsection"><div class="softcard"><h3>Hồ sơ/bằng chứng cần yêu cầu</h3><ul class="bullets">${sc.evidence.map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="softcard"><h3>Cần báo cáo/escalation khi nào?</h3><p>${esc(sc.escalate)}</p><h4 style="margin-top:12px">Sai lầm cần tránh</h4><p>${esc(sc.trap)}</p></div></div><div class="detailsection"><h3>Nguồn tham khảo</h3><div class="tagline">${sourcechips(sc.refs)}</div>${sc.related?`<div class="btnrow" style="margin-top:12px"><button class="btn small" data-task="${esc(sc.related)}">→ Mở quy trình liên quan ${esc(sc.related)}</button></div>`:''}</div>`}<div class="btnrow" style="margin-top:17px"><button class="btn" data-next-case="${sc.id}">Tình huống tiếp theo →</button>${answer!==undefined?(referenceOnly?'<button class="btn small" data-action="case-hide">Ẩn phương án tham chiếu</button>':'<button class="btn small" data-action="retry-case">↻ Làm lại</button>'):''}</div></div>`}</div>`}
function glossary(){
 const sorted=[...DATA.glossary].sort((a,b)=>a[0].localeCompare(b[0],'vi')),letter=g=>norm(g[0]).charAt(0).toUpperCase(),letters=[...new Set(sorted.map(letter))].sort();
 const arr=sorted.filter(g=>(ui.glossaryLetter==='all'||letter(g)===ui.glossaryLetter)&&(!ui.glossaryQuery||norm(g.join(' ')).includes(norm(ui.glossaryQuery))));
 return header('Từ điển công việc','Thuật ngữ HSE / LNG cần hiểu','Tra cứu thuật ngữ, ý nghĩa nghiệp vụ và phạm vi trách nhiệm khi triển khai dự án.')+`<section class="module-panel" id="mod-glossary-index"><div class="sectionrow"><h3>Chỉ mục chuyên ngành A–Z</h3><span class="caption">${arr.length}/${DATA.glossary.length} thuật ngữ</span></div><div class="filterarea glossary-search"><input class="field small" id="glossarySearch" type="search" value="${esc(ui.glossaryQuery)}" placeholder="VD: HAZOP, PSSR, SIMOPS..." aria-label="Tìm thuật ngữ"></div><div class="letter-index"><button class="btn ${ui.glossaryLetter==='all'?'primary':''}" data-action="glossary-letter-all">Tất cả</button>${letters.map(l=>`<button class="btn ${ui.glossaryLetter===l?'primary':''}" data-action="glossary-letter-${esc(l)}">${esc(l)}</button>`).join('')}</div></section><div class="glossary-index">${letters.filter(l=>arr.some(g=>letter(g)===l)).map(l=>`<section class="glossary-group"><div class="glossary-letter"><b>${esc(l)}</b><span>${arr.filter(g=>letter(g)===l).length} thuật ngữ</span></div><div class="glossary-grid">${arr.filter(g=>letter(g)===l).map(g=>`<article class="card glossary-card"><span class="term-code">${esc(g[0])}</span><h3>${esc(g[1])}</h3><p>${esc(g[2])}</p></article>`).join('')}</div></section>`).join('')||'<div class="empty">Không có thuật ngữ phù hợp.</div>'}</div>`;
}
function norm(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim()}
function searchEntries(){
 return [
 ...NAV.map(x=>({jump:'view:'+x[0],kind:'Màn hình',title:x[2],desc:'Điều hướng'})),
 ...DATA.tasks.map(x=>({jump:'task:'+x.id,kind:'Quy trình',title:x.id+' · '+x.title,desc:x.area,terms:x.goal+' '+x.inputs.join(' ')})),
 ...DATA.criticalRisks.map(x=>({jump:'risk:'+x.id,kind:'Critical Risk',title:x.id+' · '+x.title,desc:x.system||x.group,terms:x.hazard+' '+x.event+' '+x.causes.join(' ')+' '+x.controls.map(c=>c.name).join(' ')})),
 ...OWNER.legalGates.map((x,i)=>({jump:'legalgate:'+i,kind:'Pháp lý theo mốc',title:x.name,desc:x.phase,terms:x.assessment.findings.map(f=>f.topic+' '+f.clauses.map(c=>c.locator).join(' ')).join(' ')})),
 ...DATA.sources.map(x=>({jump:'source:'+x.id,kind:'Văn bản / nguồn',title:x.code+' · '+x.title,desc:x.domain,terms:x.use})),
 ...DATA.scenarios.map(x=>({jump:'case:'+x.id,kind:'Tình huống',title:x.id+' · '+x.title,desc:x.category,terms:x.story})),
 ...DATA.templates.map(x=>({jump:'template:'+x.id,kind:'Biểu mẫu',title:x.title,desc:x.id,terms:x.desc}))
 ];
}
function renderGlobalResults(){
 const q=norm(ui.globalQuery),tokens=q.split(/\s+/).filter(Boolean),entries=searchEntries();
 let ranked=tokens.length?entries.map(x=>{const title=norm(x.title),meta=norm(x.desc+' '+(x.terms||''));let ok=tokens.every(k=>(title+' '+meta).includes(k));let score=(title.includes(q)?40:0)+tokens.reduce((n,k)=>n+(title.includes(k)?8:meta.includes(k)?1:0),0);return {x,ok,score}}).filter(x=>x.ok).sort((a,b)=>b.score-a.score).map(x=>x.x):['view:ownerlegal','view:criticalrisk','risk:CR30','task:P3-03','view:ownerplan'].map(id=>entries.find(x=>x.jump===id)).filter(Boolean);
 $('#globalSearchResults').innerHTML='<div class="search-result-label">'+(q?ranked.length+' kết quả · '+Math.min(12,ranked.length)+' hiển thị':'Truy cập nhanh')+'</div>'+ranked.slice(0,12).map(x=>'<button class="global-result" data-jump="'+esc(x.jump)+'"><span><small>'+esc(x.kind)+'</small><b>'+esc(x.title)+'</b><span>'+esc(x.desc)+'</span></span>'+uiIcon('arrow',16)+'</button>').join('')+(ranked.length?'':'<p class="muted">Không tìm thấy nội dung phù hợp. Thử từ khóa ngắn hơn.</p>');
}
function closeGlobalSearch(restore=false){ui.searchOpen=false;$('#globalSearchPanel').hidden=true;$('#globalSearchToggle').setAttribute?.('aria-expanded','false');if(restore)$('#globalSearchToggle').focus()}
function openGlobalSearch(){ui.searchOpen=true;$('#globalSearchPanel').hidden=false;$('#globalSearchToggle').setAttribute?.('aria-expanded','true');$('#globalSearchInput').value=ui.globalQuery;renderGlobalResults();$('#globalSearchInput').focus()}
function jumpTo(value){
 const split=value.indexOf(':'),kind=value.slice(0,split),id=value.slice(split+1);
 closeGlobalSearch();
 if(kind==='view'&&NAV.some(x=>x[0]===id))return goto(id);
 if(kind==='task'&&task(id))return openTask(id);
 if(kind==='risk'||kind==='ops'){ui.riskPhase=kind==='ops'?'P5':'all';ui.riskGroup='all';ui.riskSystem='all';ui.riskQuery='';ui.riskId=kind==='ops'?(DATA.criticalRisks.find(x=>x.system)?.id||DATA.criticalRisks[0].id):id;return goto('criticalrisk')}
 if(kind==='legalgate'&&OWNER.legalGates[Number(id)]){ui.ownerLegal=Number(id);return goto('ownerlegal')}
 if(kind==='source'&&src(id)){ui.sourceKind='all';ui.sourceDomain='all';ui.sourceQuery=src(id).code;return goto('legal')}
 if(kind==='case'&&DATA.scenarios.some(x=>x.id===id)){ui.case=id;ui.casePhase='all';ui.caseDifficulty='all';ui.caseUntried='all';ui.caseQuery='';return goto('scenarios')}
 if(kind==='template'&&DATA.templates.some(x=>x.id===id)){ui.template=id;return goto('templates')}
}
function updateViewMode(){document.documentElement.setAttribute('data-view-mode',ui.executive?'executive':'work');$('#modeLabel').textContent=ui.executive?'Trình chiếu':'Làm việc';$('#modeToggle').setAttribute?.('aria-pressed',String(ui.executive));$('#modeToggle').title=ui.executive?'Đang ở chế độ trình chiếu. Bấm để mở chế độ làm việc.':'Đang ở chế độ làm việc. Bấm để chuyển sang trình chiếu.'}
function fullscreen(){try{if(document.fullscreenElement&&document.exitFullscreen){document.exitFullscreen()?.catch?.(()=>{});return}if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen()?.catch?.(()=>alert('Trình duyệt không cho phép toàn màn hình. Trên máy tính có thể dùng F11.'));return}}catch{}alert('Trình duyệt chưa hỗ trợ toàn màn hình tại đây. Trên máy tính có thể dùng F11.')}
let lastRenderedView='';
function render(){updateViewMode();navrender();let app=$('#app');if(!app)return;const selectors=['.tasklist','.owner-scroll','.scroll-catalog','.template-catalog'];const offsets=lastRenderedView===ui.view?selectors.map(s=>app.querySelector?.(s)?.scrollTop||0):[];let fn={dashboard,ownerstart,ownerplan,ownerlegal,criticalrisk,playbooks,gates,raci,legal,templates,scenarios,glossary}[ui.view]||dashboard;app.innerHTML=fn();offsets.forEach((v,i)=>{let list=app.querySelector?.(selectors[i]);if(list)list.scrollTop=v});lastRenderedView=ui.view}
function revealDetail(selector){const el=$('#app')?.querySelector?.(selector);if(!el)return;const rect=el.getBoundingClientRect?.();if(window.matchMedia?.('(max-width:760px)')?.matches||(rect&&rect.top<75))el.scrollIntoView({behavior:'auto',block:'start'})}
function goto(view){closeGlobalSearch();ui.view=view;render();window.scrollTo({top:0,behavior:'instant'})}
function openTask(id){ui.phase='all';ui.area='all';ui.query='';ui.selected=id;goto('playbooks')}
function csvdownload(t){let rows=[t.columns,t.row];let csv='\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'HSE_PMU_'+t.id+'_MAU.csv')}
function downloadChecklist(t){let columns=['ID','Tiêu chí review','Mức','Cách xác minh','Bằng chứng mong đợi','Trạng thái','Bằng chứng thực tế','Ghi chú / N/A reason'];let rows=t.checklist.map(c=>{let a=getReview(t,c.id);return [c.id,c.question,c.critical?'Trọng yếu':'Thông thường',c.how,c.evidence,a.status||'pending',a.evidence||'',a.note||'']});let csv='\ufeff'+[columns,...rows].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadBlob(new Blob([csv],{type:'text/csv;charset=utf-8'}),'HSE_PMU_CHECKLIST_'+t.id+'.csv')}
function downloadBlob(blob,name){let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function exportProgress(){let payload={app:'HSE PMU Command',version:4,exportedAt:new Date().toISOString(),project:saved.context,tasks:saved.tasks,cases:saved.cases,templateChecks:saved.templateChecks,ownerMilestones:saved.ownerMilestones,riskPractice:saved.riskPractice};downloadBlob(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),'HSE_PMU_Progress_'+new Date().toISOString().slice(0,10)+'.json')}
function handleClick(e){const el=e.target.closest('[data-view],[data-task],[data-go-phase],[data-action],[data-template],[data-download-template],[data-download-checklist],[data-case],[data-choice],[data-next-case],[data-owner-decision],[data-owner-stage],[data-owner-legal],[data-risk],[data-jump],[data-scroll]');if(!el)return;
if(el.dataset.jump)return jumpTo(el.dataset.jump);
if(el.dataset.scroll){const id=el.dataset.scroll;if(/^(risk-|task-|legal-finding-|mod-)[a-z0-9-]+$/.test(id))$('#'+id)?.scrollIntoView({behavior:'smooth',block:'start'});return}
if(el.dataset.risk){if(DATA.criticalRisks.some(x=>x.id===el.dataset.risk)){ui.riskId=el.dataset.risk;render();revealDetail('.risk-detail')}return}
if(el.dataset.ownerDecision!==undefined){ui.ownerDecision=Number(el.dataset.ownerDecision);render();revealDetail('.owner-detail');return}
if(el.dataset.ownerStage!==undefined){ui.ownerStage=Number(el.dataset.ownerStage);render();revealDetail('.owner-detail');return}
if(el.dataset.ownerLegal!==undefined){ui.ownerLegal=Number(el.dataset.ownerLegal);render();revealDetail('.owner-detail');return}
if(el.dataset.view){goto(el.dataset.view);return}
if(el.dataset.task){if(ui.view==='playbooks'&&task(el.dataset.task)&&el.closest?.('.tasklist')){ui.selected=el.dataset.task;render();revealDetail('#taskDetail')}else openTask(el.dataset.task);return}
if(el.dataset.goPhase){ui.phase=el.dataset.goPhase;ui.area='all';ui.query='';ui.selected=DATA.tasks.find(x=>x.phase===ui.phase)?.id||DATA.tasks[0].id;goto('playbooks');return}
if(el.dataset.template){ui.template=el.dataset.template;render();revealDetail('#templatePreview');return}
if(el.dataset.downloadTemplate){let t=DATA.templates.find(x=>x.id===el.dataset.downloadTemplate);if(t)csvdownload(t);return}
if(el.dataset.downloadChecklist){let t=DATA.templates.find(x=>x.id===el.dataset.downloadChecklist);if(t)downloadChecklist(t);return}
if(el.dataset.case){ui.case=el.dataset.case;ui.revealCase='';render();revealDetail('.scenario-layout>.card:last-child');return}
if(el.dataset.choice){let [id,choice]=el.dataset.choice.split(':');ui.revealCase='';saved.cases[id]=Number(choice);persist();render();return}
if(el.dataset.nextCase){ui.revealCase='';let filtered=scenarioFilter();let i=filtered.findIndex(x=>x.id===el.dataset.nextCase);ui.case=filtered[(i+1)%filtered.length]?.id||DATA.scenarios[0].id;render();return}
let action=el.dataset.action;
if(action==='case-reveal'){ui.revealCase=ui.case;render();return}
if(action==='case-hide'){ui.revealCase='';render();return}
if(action?.startsWith('raci-')){let k=action.slice(5);if(['all','owner','hse','legal','design','epc'].includes(k)){ui.raciFocus=k;render()}return}
if(action?.startsWith('source-kind-')){let k=action.slice(12);let kinds=[...new Set(DATA.sources.map(s=>s.kind))];ui.sourceKind=k==='all'?'all':kinds[Number(k)]||'all';ui.sourceDomain='all';ui.sourceQuery='';render();return}
if(action?.startsWith('glossary-letter-')){let l=action.slice(16);ui.glossaryLetter=l==='all'?'all':l;render();return}
if(action==='global-search'){ui.searchOpen?closeGlobalSearch(true):openGlobalSearch();return}
if(action==='close-search'){closeGlobalSearch(true);return}
if(action==='toggle-mode'){ui.executive=!ui.executive;try{localStorage.setItem('hse_view_mode',ui.executive?'executive':'work')}catch{}updateViewMode();return}
if(action==='fullscreen')return fullscreen();
if(action==='risk-ops-new'||action==='risk-ops-all'||action==='risk-reset'||action?.startsWith('risk-system-')){let systems=[...new Set(DATA.criticalRisks.map(x=>x.system).filter(Boolean))];ui.riskQuery='';ui.riskPhase=action==='risk-reset'?'all':'P5';ui.riskGroup=action==='risk-ops-new'?'An toàn vận hành & bảo trì (O&M)':'all';ui.riskSystem=action?.startsWith('risk-system-')?(systems[Number(action.slice(12))]||'all'):'all';ui.riskId=action==='risk-reset'?DATA.criticalRisks[0].id:DATA.criticalRisks.find(x=>x.system&&(ui.riskSystem==='all'||x.system===ui.riskSystem))?.id||DATA.criticalRisks[0].id;render();return}
if(action?.startsWith('risk-group-')){let groups=[...new Set(DATA.criticalRisks.map(x=>x.group))],g=groups[Number(action.slice(11))];if(g){ui.riskGroup=ui.riskGroup===g?'all':g;ui.riskPhase='all';ui.riskSystem='all';ui.riskQuery='';render()}return}
if(action==='save-risk')return saveRiskPractice();
if(action==='clear-risk'){if(confirm('Xóa đánh giá của rủi ro đang chọn?')){delete saved.riskPractice[ui.riskId];persist();render()}return}
if(action==='export-risk')return exportRiskRegister();
if(action==='export')return exportProgress();if(action==='import')return $('#importFile').click();if(action==='print')return window.print();
if(action==='save-context'){saved.context={name:$('#ctxname')?.value||'',entity:$('#ctxentity')?.value||'',stage:$('#ctxstage')?.value||'',role:$('#ctxrole')?.value||''};persist();let f=$('#ctxFeedback');if(f)f.textContent='Đã lưu trên thiết bị.';return}

if(action==='save-owner-stage'){let x=OWNER.roadmap[ui.ownerStage];if(!x)return;let status=$('#ownerPlanStatus')?.value||'not_started',evidence=String($('#ownerPlanEvidence')?.value||'').trim().slice(0,500),note=String($('#ownerPlanNote')?.value||'').trim().slice(0,1200);if(!['not_started','in_progress','blocked','verified'].includes(status)){alert('Trạng thái không hợp lệ');return}if(status==='verified'&&evidence.length<4){alert('Đánh dấu đã kiểm chứng cần có mã hồ sơ/bằng chứng.');return}if(status==='blocked'&&note.length<8){alert('Cần mô tả nguyên nhân bị vướng.');return}saved.ownerMilestones[x.code]={status,evidence,note,updated:new Date().toISOString()};persist();render();let n=$('#ownerStageSaved');if(n)n.textContent='✓ Đã lưu';return}
if(action==='retry-case'){ui.revealCase='';delete saved.cases[ui.case];persist();render();return}
if(action==='save-template-review'){
 let t=DATA.templates.find(x=>x.id===ui.template);if(!t)return;let out={};
 for(let c of t.checklist){let status=$('#check-status-'+c.id)?.value||'pending',evidence=String($('#check-evidence-'+c.id)?.value||'').trim().slice(0,500),note=String($('#check-note-'+c.id)?.value||'').trim().slice(0,800);
  if(!['pending','pass','fail','na'].includes(status)){alert('Trạng thái không hợp lệ: '+c.id);return}
  if(status==='pass'&&evidence.length<4){alert(c.id+': mục Đạt phải có bằng chứng cụ thể.');$('#check-evidence-'+c.id)?.focus();return}
  if((status==='na'||status==='fail')&&note.length<8){alert(c.id+': mục Chưa đạt / N/A phải có ghi chú hoặc lý do (ít nhất 8 ký tự).');$('#check-note-'+c.id)?.focus();return}
  out[c.id]={status,evidence,note,updated:new Date().toISOString()};
 }
 saved.templateChecks[t.id]=out;persist();render();$('#templatePreview')?.scrollIntoView({behavior:'smooth',block:'start'});let f=$('#reviewFeedback');if(f)f.textContent='✓ Đã lưu checklist';return
}
if(action==='save-progress'){let id=ui.selected;if(!task(id))return;let status=$('#progressStatus')?.value||'not_started',owner=$('#progressOwner')?.value||'',due=$('#progressDue')?.value||'',evidence=$('#progressEvidence')?.value?.trim()||'',note=$('#progressNote')?.value?.trim()||'';if(status==='verified'&&!evidence&&!note){alert('Muốn đánh dấu Đã kiểm chứng, cần ghi bằng chứng hoặc ghi chú xác minh.');return}if(status==='na'&&note.length<10){alert('Khi chọn Không áp dụng, hãy ghi lý do (ít nhất 10 ký tự).');return}saved.tasks[id]={status,owner,due,evidence,note,updated:new Date().toISOString()};persist();render();let f=$('#saveResult');if(f)f.textContent='✓ Đã lưu';return}}

saved.riskPractice={};for(let r of DATA.criticalRisks){const p=cleanRiskPractice(r,data.riskPractice?.[r.id]);if(p)saved.riskPractice[r.id]=p}
